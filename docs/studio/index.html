<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>mufac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="js-yaml.min.js"></script>
<style>
/* 작업실 콘솔: 왼쪽 곡 목록, 오른쪽 한 곡의 진행 단계(Suno → 곡 → 영상 → 유튜브) */
:root{
  --bg:#111214; --panel:#18191c; --raise:#212227; --line:#2b2d33;
  --fg:#eeece6; --muted:#90918f; --accent:#e9b24c; --accent-ink:#1b1408;
  --ok:#86c79f; --err:#e5736b;
  --serif:"Gowun Batang",serif;
  --sans:"Pretendard",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:var(--accent)}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right)) 80px max(16px,env(safe-area-inset-left))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.mark{font:700 26px/1 var(--serif);letter-spacing:.02em}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 14px;color:var(--muted);cursor:pointer}
.ghost:hover{color:var(--fg);border-color:var(--muted)}

/* 만들기 */
.make{display:grid;grid-template-columns:1fr 1fr auto auto;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:24px}
.make input{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;font-size:18px}
.make input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.btn{border:0;border-radius:12px;padding:14px 22px;font-weight:700;font-size:18px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.second{background:var(--raise);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.ghost:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.cols{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
.list{display:flex;flex-direction:column;gap:6px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.item{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;text-align:left;background:none;border:1px solid transparent;border-radius:12px;padding:8px;cursor:pointer}
.item:hover{background:var(--panel)}
.item.on{background:var(--panel);border-color:var(--line)}
.thumb{width:52px;height:52px;border-radius:8px;background:var(--raise) center/cover;flex:none}
.item .t{font:700 16px/1.3 var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:3px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.wait{background:var(--muted)} .dot.run{background:var(--accent);animation:pulse 1.2s infinite} .dot.ready{background:var(--accent)} .dot.done{background:var(--ok)} .dot.fail{background:var(--err)}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot.run{animation:none}}

/* 상세 */
.detail{display:flex;flex-direction:column;gap:18px;min-width:0}
.head h1{font:700 clamp(28px,4vw,40px)/1.25 var(--serif);margin:0 0 8px;text-wrap:balance}
.head p{margin:0;color:var(--muted)}
.step{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.step h2{font-size:14px;letter-spacing:.12em;color:var(--muted);margin:0 0 14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.flabel{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:14px;color:var(--muted)}
.copy{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:14px;cursor:pointer}
.copy.ok{color:var(--ok);border-color:var(--ok)}
.val{background:var(--raise);border-radius:10px;padding:12px 14px;font:15px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word}
.val.lyrics{font:17px/1.75 var(--sans);max-height:360px;overflow:auto}
.drop{display:block;border:1.5px dashed var(--line);border-radius:14px;padding:30px 16px;text-align:center;color:var(--muted);cursor:pointer;font-size:18px}
.drop.over{border-color:var(--accent);color:var(--fg)}
.drop input{display:none}
audio{width:100%;margin-top:12px}
.videos{display:grid;grid-template-columns:minmax(0,16fr) minmax(0,5fr);gap:14px;align-items:start}
video{width:100%;border-radius:10px;background:#000;display:block}
.note{color:var(--muted);font-size:15px;margin:10px 0 0}
.state{display:flex;align-items:center;gap:10px;font-size:18px}
.links{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.empty{color:var(--muted);padding:60px 0;text-align:center;font-size:18px}
.err{color:var(--err)}

/* 토큰 */
.gate{max-width:560px;margin:10vh auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px}
.gate h1{font:700 28px var(--serif);margin:0 0 10px}
.gate ol{padding-left:20px;color:var(--muted);margin:14px 0 18px}
.gate input{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;font:15px var(--mono)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:12px 18px;font-size:16px;max-width:calc(100% - 32px)}

@media (max-width:820px){
  .make{grid-template-columns:1fr 1fr}
  .make input{grid-column:span 2}
  .cols{grid-template-columns:1fr}
  .list{position:static;max-height:none;flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .item{min-width:220px}
  .videos{grid-template-columns:1fr}
  .videos video.v{max-width:300px}
}
</style>
</head>
<body>
<div class="wrap">

<section class="gate" id="gate" hidden>
  <h1>mufac</h1>
  <p>이 화면이 저장소를 움직이려면 GitHub 토큰이 한 번 필요해요. 이 브라우저에만 저장됩니다.</p>
  <ol>
    <li><a href="https://github.com/settings/personal-access-tokens/new?name=mufac&description=mufac%20dashboard&expires_in=none&contents=write&actions=write" target="_blank" rel="noopener">토큰 만들기</a>에서 Repository access를 <b>mufac</b>만 고르기</li>
    <li>Permissions에서 <b>Actions</b>와 <b>Contents</b>를 Read and write로</li>
    <li>만든 토큰을 아래에 붙여넣기</li>
  </ol>
  <input id="tokenIn" type="password" placeholder="github_pat_..." autocomplete="off">
  <button class="btn primary" id="tokenSave">시작</button>
  <p class="note err" id="gateErr"></p>
</section>

<div id="app" hidden>
  <header>
    <div class="mark">mufac</div>
    <button class="ghost" id="logout" title="토큰 지우기">토큰</button>
  </header>

  <section class="make">
    <input id="kw" placeholder="키워드나 상황" autocomplete="off">
    <input id="style" placeholder="곡 스타일 (선택)" autocomplete="off">
    <button class="btn primary" id="makeKw">이걸로 만들기</button>
    <button class="btn second" id="makeAuto">자동 생성</button>
  </section>

  <div class="cols">
    <nav class="list" id="list"></nav>
    <main class="detail" id="detail"><div class="empty">불러오는 중</div></main>
  </div>
</div>

</div>
<div class="toast" id="toast" hidden></div>

<script>
const OWNER = "kjhoeakjy", REPO = "mufac", BRANCH = "main";
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
const AUDIO = /\.(mp3|wav|m4a|flac)$/i;
const $ = (id) => document.getElementById(id);

const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch {} },
};
let token = store.get("mufac.token");
let songs = [];          // {slug, meta, audio, release, runs}
let pending = [];        // 대시보드에서 요청한 새 곡 {req, at, label}
let runs = [];
let selected = store.get("mufac.selected");
const yamlCache = new Map();

// ---------------------------------------------------------------- GitHub
async function gh(path, opts = {}) {
  const res = await fetch(path.startsWith("http") ? path : API + path, {
    ...opts,
    headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json",
               "X-GitHub-Api-Version": "2022-11-28", ...(opts.headers || {}) },
  });
  if (res.status === 401) { logout("토큰이 맞지 않아요. 다시 넣어 주세요."); throw new Error("401"); }
  if (!res.ok && res.status !== 404) {
    let msg = res.status + "";
    try { msg = (await res.json()).message || msg; } catch {}
    throw new Error(msg);
  }
  if (res.status === 404) return null;
  if (res.status === 204) return {};
  return res.json();
}

function b64utf8(b64) {
  const bin = atob(b64.replace(/\n/g, ""));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}

async function loadSongs() {
  const head = await gh(`/git/ref/heads/${BRANCH}`);
  const tree = await gh(`/git/trees/${head.object.sha}?recursive=1`);
  const bySlug = {};
  for (const n of tree.tree) {
    const m = n.path.match(/^songs\/([^/]+)\/(.+)$/);
    if (!m || m[2].includes("/")) continue;
    const s = bySlug[m[1]] ||= { slug: m[1], files: {} };
    s.files[m[2]] = n.sha;
  }
  const list = Object.values(bySlug).filter(s => s.files["song.yaml"]);
  await Promise.all(list.map(async s => {
    const sha = s.files["song.yaml"];
    if (!yamlCache.has(sha)) {
      const blob = await gh(`/git/blobs/${sha}`);
      yamlCache.set(sha, jsyaml.load(b64utf8(blob.content)) || {});
    }
    s.meta = yamlCache.get(sha);
    s.audio = Object.keys(s.files).find(f => AUDIO.test(f)) || null;
  }));
  const rels = await gh(`/releases?per_page=100`) || [];
  const relMap = {};
  for (const r of rels) if (r.tag_name.startsWith("song-")) relMap[r.tag_name.slice(5)] = r;
  for (const s of list) s.release = relMap[s.slug] || null;
  list.sort((a, b) => b.slug.localeCompare(a.slug, "en", { numeric: true }));
  songs = list;
  // 새 곡 요청이 끝났으면 대기 목록에서 빼고 그 곡을 연다
  for (const p of [...pending]) {
    const hit = songs.find(s => s.meta?.request?.id === p.req);
    if (hit) { pending = pending.filter(x => x !== p); selected = hit.slug; store.set("mufac.selected", selected); }
  }
}

async function loadRuns() {
  const r = await gh(`/actions/runs?per_page=30`);
  runs = r?.workflow_runs || [];
  for (const p of [...pending]) {
    const run = runs.find(x => x.display_title === `새 곡 ${p.req}`);
    if (run && run.status === "completed" && run.conclusion !== "success") {
      pending = pending.filter(x => x !== p);
      toast("새 곡 만들기가 실패했어요.", run.html_url);
    }
  }
}

function runFor(slug, workflow) {
  return runs.find(r => r.name === workflow && r.display_title.includes(slug));
}
const active = (r) => r && r.status !== "completed";

// ---------------------------------------------------------------- 상태
function status(s) {
  const prod = runFor(s.slug, "영상 만들기"), up = runFor(s.slug, "유튜브 업로드");
  if (active(up)) return ["run", "올리는 중"];
  if (s.meta?.youtube?.main) return ["done", "업로드됨"];
  if (active(prod)) return ["run", "영상 만드는 중"];
  if (s.release) return ["ready", "업로드 대기"];
  if (s.audio && prod?.conclusion === "failure") return ["fail", "영상 실패"];
  if (s.audio) return ["run", "영상 대기"];
  return ["wait", "Suno 대기"];
}

function asset(s, name) {
  const a = s.release?.assets?.find(x => x.name === name);
  return a ? a.browser_download_url : null;
}

// ---------------------------------------------------------------- 그리기
function esc(t) { return String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function renderList() {
  const el = $("list");
  const items = pending.map(p => `
    <div class="item on" aria-busy="true"><div class="thumb"></div>
      <div><div class="t">${esc(p.label)}</div><div class="s"><span class="dot run"></span>가사 쓰는 중</div></div></div>`);
  for (const s of songs) {
    const [k, label] = status(s);
    const th = asset(s, "thumb.jpg");
    items.push(`<button class="item ${s.slug === selected ? "on" : ""}" data-slug="${esc(s.slug)}">
      <div class="thumb" style="${th ? `background-image:url('${th}')` : ""}"></div>
      <div style="min-width:0"><div class="t">${esc(s.meta.title || s.slug)}</div>
      <div class="s"><span class="dot ${k}"></span>${label}</div></div></button>`);
  }
  el.innerHTML = items.join("") || `<div class="empty">아직 곡이 없어요</div>`;
  el.querySelectorAll("[data-slug]").forEach(b => b.onclick = () => { selected = b.dataset.slug; store.set("mufac.selected", selected); render(); });
}

function field(label, value, cls = "") {
  return `<div class="field"><div class="flabel"><span>${label}</span>
    <button class="copy" data-copy="${esc(value)}">복사</button></div>
    <div class="val ${cls}">${esc(value)}</div></div>`;
}

function renderDetail() {
  const el = $("detail");
  const s = songs.find(x => x.slug === selected) || songs[0];
  if (!s) { el.innerHTML = `<div class="empty">위에서 첫 곡을 만들어 보세요</div>`; return; }
  selected = s.slug;
  const m = s.meta, prod = runFor(s.slug, "영상 만들기"), up = runFor(s.slug, "유튜브 업로드");
  const main = asset(s, "main.mp4"), short = asset(s, "short.mp4");
  const yt = m.youtube || {};
  const audioUrl = s.audio ? `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/songs/${encodeURIComponent(s.slug)}/${encodeURIComponent(s.audio)}` : null;

  let video;
  if (active(prod)) video = `<div class="state"><span class="dot run"></span>영상 만드는 중 · 보통 10분 안팎</div>`;
  else if (main) video = `<div class="videos"><video src="${main}" controls preload="metadata" poster="${asset(s, "thumb.jpg") || ""}"></video>
      ${short ? `<video class="v" src="${short}" controls preload="metadata"></video>` : ""}</div>`;
  else if (s.audio && prod?.conclusion === "failure") video = `<div class="state err"><span class="dot fail"></span>영상 만들기 실패</div>
      <p class="note"><a href="${prod.html_url}" target="_blank" rel="noopener">기록 보기</a> · <button class="copy" id="reprod">다시 만들기</button></p>`;
  else if (s.audio) video = `<div class="state"><span class="dot run"></span>곧 시작해요</div>`;
  else video = `<p class="note">곡을 올리면 썸네일과 영상이 만들어져요.</p>`;

  let tube;
  if (active(up)) tube = `<div class="state"><span class="dot run"></span>올리는 중</div>`;
  else if (yt.main) tube = `<div class="links">
      <a href="https://youtu.be/${esc(yt.main)}" target="_blank" rel="noopener">본편 열기</a>
      ${yt.short ? `<a href="https://youtube.com/shorts/${esc(yt.short)}" target="_blank" rel="noopener">쇼츠 열기</a>` : ""}
      <a href="https://studio.youtube.com" target="_blank" rel="noopener">Studio에서 공개로 바꾸기</a></div>`;
  else tube = `<button class="btn primary" id="publish" ${main ? "" : "disabled"}>유튜브 업로드</button>
      ${up?.conclusion === "failure" ? `<p class="note err">지난번 업로드 실패 · <a href="${up.html_url}" target="_blank" rel="noopener">기록 보기</a></p>` : ""}
      <p class="note">본편과 쇼츠가 비공개로 올라가요.</p>`;

  el.innerHTML = `
    <div class="head"><h1>${esc(m.title)}</h1><p>${esc(m.story || "")}</p></div>
    <section class="step"><h2>SUNO <a href="https://suno.com/create" target="_blank" rel="noopener">Suno 열기</a></h2>
      ${field("Style", m.style || "")}
      ${field("Exclude styles", m.exclude || "")}
      ${field("Title", m.title || "")}
      ${field("Lyrics", (m.lyrics || "").trim(), "lyrics")}
    </section>
    <section class="step"><h2>곡</h2>
      <label class="drop" id="drop">${s.audio ? "다른 곡으로 바꾸기" : "MP3를 여기에 놓거나 눌러서 고르기"}
        <input type="file" id="file" accept=".mp3,.wav,.m4a,audio/*"></label>
      ${audioUrl ? `<audio src="${audioUrl}" controls preload="none"></audio>` : ""}
    </section>
    <section class="step"><h2>영상</h2>${video}</section>
    <section class="step"><h2>유튜브</h2>${tube}</section>`;

  el.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copy(b));
  const drop = $("drop"), file = $("file");
  file.onchange = () => file.files[0] && uploadAudio(s, file.files[0]);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) uploadAudio(s, f); };
  if ($("publish")) $("publish").onclick = () => publish(s);
  if ($("reprod")) $("reprod").onclick = () => reproduce(s);
}

function render() {
  if (!songs.some(x => x.slug === selected)) selected = songs[0]?.slug || null;
  renderList(); renderDetail();
}

async function copy(btn) {
  const text = btn.dataset.copy;
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement("textarea"); ta.value = text; document.body.append(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
  btn.textContent = "복사됨"; btn.classList.add("ok");
  setTimeout(() => { btn.textContent = "복사"; btn.classList.remove("ok"); }, 1400);
}

function toast(msg, link) {
  const t = $("toast");
  t.innerHTML = esc(msg) + (link ? ` <a href="${link}" target="_blank" rel="noopener">기록 보기</a>` : "");
  t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 6000);
}

// ---------------------------------------------------------------- 동작
async function dispatch(workflow, inputs) {
  await gh(`/actions/workflows/${workflow}/dispatches`, { method: "POST", body: JSON.stringify({ ref: BRANCH, inputs }) });
}

async function makeSong(auto) {
  const idea = auto ? "" : $("kw").value.trim();
  if (!auto && !idea) { $("kw").focus(); return; }
  const style = $("style").value.trim();
  const req = Date.now().toString(36);
  $("makeKw").disabled = $("makeAuto").disabled = true;
  try {
    await dispatch("new-song.yml", { idea, style, req, hook: "", theme: "자동", vocal: "자동" });
    pending.unshift({ req, at: Date.now(), label: idea || "새 곡" });
    $("kw").value = "";
    renderList();
    toast("가사를 쓰고 있어요. 1분쯤 걸려요.");
    poll(4000);
  } catch (e) { toast("시작하지 못했어요: " + e.message); }
  finally { $("makeKw").disabled = $("makeAuto").disabled = false; }
}

function readB64(file) {
  return new Promise((ok, no) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(",")[1]);
    r.onerror = () => no(r.error);
    r.readAsDataURL(file);
  });
}

async function uploadAudio(s, file) {
  const ext = (file.name.match(/\.(mp3|wav|m4a|flac)$/i) || [".mp3"])[0].toLowerCase();
  if (file.size > 90 * 1024 * 1024) { toast("파일이 너무 커요. 90MB 이하로 올려 주세요."); return; }
  const drop = $("drop");
  drop.firstChild.textContent = "올리는 중…";
  try {
    const name = "song" + ext;
    // 곡을 바꾸면 예전 자막 타이밍과 다른 이름의 곡 파일은 지운다
    for (const f of Object.keys(s.files)) {
      if (f === "timing.lrc" || (AUDIO.test(f) && f !== name)) {
        await gh(`/contents/songs/${s.slug}/${f}`, { method: "DELETE",
          body: JSON.stringify({ message: `정리: ${s.slug}/${f}`, sha: s.files[f], branch: BRANCH }) });
      }
    }
    const body = { message: `mp3: ${s.slug}`, content: await readB64(file), branch: BRANCH };
    if (s.files[name]) body.sha = s.files[name];
    await gh(`/contents/songs/${s.slug}/${name}`, { method: "PUT", body: JSON.stringify(body) });
    toast("올렸어요. 영상 만들기가 곧 시작돼요.");
    await refresh();
    poll(5000);
  } catch (e) {
    toast("올리지 못했어요: " + e.message);
    drop.firstChild.textContent = "MP3를 여기에 놓거나 눌러서 고르기";
  }
}

async function publish(s) {
  $("publish").disabled = true;
  try { await dispatch("upload.yml", { slug: s.slug }); toast("유튜브에 올리기 시작했어요."); setTimeout(refresh, 4000); poll(5000); }
  catch (e) { toast("시작하지 못했어요: " + e.message); $("publish").disabled = false; }
}

async function reproduce(s) {
  try { await dispatch("produce.yml", { slug: s.slug }); toast("영상을 다시 만들어요."); setTimeout(refresh, 4000); poll(5000); }
  catch (e) { toast("시작하지 못했어요: " + e.message); }
}

// ---------------------------------------------------------------- 갱신
let timer = null, busyBefore = false;
async function refresh() {
  try {
    await loadRuns();
    const busy = pending.length || runs.some(active);
    // 실행이 끝났거나 처음이면 곡 데이터도 다시 읽는다
    if (!songs.length || busyBefore !== busy || !busy || pending.length) await loadSongs();
    busyBefore = busy;
    render();
    return busy;
  } catch (e) {
    if (e.message !== "401") $("detail").innerHTML = `<div class="empty err">불러오지 못했어요: ${esc(e.message)}</div>`;
    return false;
  }
}
function poll(ms) {
  clearTimeout(timer);
  timer = setTimeout(async () => { const busy = await refresh(); poll(busy ? 8000 : 60000); }, ms);
}

function logout(msg) {
  token = null; store.set("mufac.token", null);
  $("app").hidden = true; $("gate").hidden = false; $("gateErr").textContent = msg || "";
}

$("tokenSave").onclick = async () => {
  token = $("tokenIn").value.trim();
  if (!token) return;
  store.set("mufac.token", token);
  start();
};
$("logout").onclick = () => logout();
$("makeKw").onclick = () => makeSong(false);
$("makeAuto").onclick = () => makeSong(true);
$("kw").onkeydown = e => { if (e.key === "Enter") makeSong(false); };
document.addEventListener("visibilitychange", () => { if (!document.hidden && token) poll(100); });

async function start() {
  $("gate").hidden = true; $("app").hidden = false;
  const busy = await refresh();
  poll(busy ? 8000 : 60000);
}
token ? start() : ($("gate").hidden = false);
</script>
