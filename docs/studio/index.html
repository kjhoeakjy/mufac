<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>mufac</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="js-yaml.min.js"></script>
<style>
/* 작업실: 위에 만들기, 왼쪽 곡 목록, 오른쪽 한 곡(Suno → 곡 → 영상 → 유튜브). 흰 바탕, 1px 선, 강조색 하나 */
:root{
  --bg:#fff; --panel:#fff; --raise:#f6f6f6; --line:#e3e3e3; --line2:#cfcfcf;
  --fg:#111; --muted:#6f6f6f; --accent:#111; --accent-ink:#fff; --ok:#1d7a46; --err:#c22e2e;
  --sans:"Pretendard",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--fg)}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.mark{font-weight:700;font-size:15px;letter-spacing:.02em}
.ghost{background:none;border:1px solid var(--line2);border-radius:4px;padding:5px 10px;color:var(--muted);cursor:pointer;font-size:13px}
.ghost:hover{color:var(--fg);border-color:var(--fg)}

/* 만들기 */
.make{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-bottom:20px}
.make input,.make select,.make textarea{background:#fff;border:1px solid var(--line2);border-radius:4px;padding:9px 12px;min-width:0;font-size:14px;font-family:inherit}
.make textarea{grid-column:1/3;resize:vertical;min-height:38px;height:38px;line-height:1.4}
.make #style{grid-column:3/5}
.make textarea:focus{outline:1px solid var(--fg);outline-offset:-1px;border-color:var(--fg)}
.head .fix{margin-left:8px;vertical-align:middle;font-weight:400}
.editor input,.editor textarea{width:100%;box-sizing:border-box;font:inherit;background:#fff;border:1px solid var(--line2);border-radius:4px;padding:9px 12px}
.editor input{font-weight:600}
.editor textarea{min-height:360px;line-height:1.6;resize:vertical;margin-top:8px}
.editor .row{display:flex;gap:8px;margin-top:10px;align-items:center}
.editor .row .note{margin:0 0 0 auto}
.editor label.flabel{margin-top:10px;display:block}
.editor textarea.short{min-height:90px}
.make select{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:right 15px top 50%,right 10px top 50%;background-size:5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}
.make input:focus,.make select:focus{outline:1px solid var(--fg);outline-offset:-1px;border-color:var(--fg)}
.btn{border:1px solid var(--fg);border-radius:4px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;background:#fff}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.ghost:focus-visible,.item:focus-visible,.copy:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

.cols{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
.list{display:flex;flex-direction:column;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 6px;cursor:pointer;width:100%}
.item:hover{background:var(--raise)}
.item.on{background:var(--raise)}
.thumb{width:40px;height:40px;border-radius:3px;background:var(--raise) center/cover;flex:none;border:1px solid var(--line)}
.item .t{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .c{font-size:12px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.item .s{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:2px}
.bar{height:2px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--fg);transition:width .8s linear}
.state .bar{width:min(100%,360px)}
.grp summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 6px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;user-select:none}
.grp summary::-webkit-details-marker{display:none}
.grp summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin-left:2px}
.grp[open] summary::before{transform:rotate(45deg)}
.grp summary .n{color:var(--muted);font-weight:400;margin-left:auto}
.grp .item{padding-left:18px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line2);flex:none}
.dot.run{background:var(--fg);animation:pulse 1.2s infinite} .dot.ready{background:var(--fg)} .dot.done{background:var(--ok)} .dot.fail{background:var(--err)}
@keyframes pulse{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.dot.run{animation:none}}

/* 상세 */
.detail{display:flex;flex-direction:column;gap:14px;min-width:0}
.head{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:center}
.head.nocover{grid-template-columns:1fr}
.cover{width:96px;height:96px;border-radius:3px;object-fit:cover;background:var(--raise);display:block;border:1px solid var(--line)}
.head h1{font-size:22px;line-height:1.3;margin:0 0 4px;font-weight:700;text-wrap:balance}
.head p{margin:0;color:var(--muted);font-size:13px}
.step{border:1px solid var(--line);border-radius:4px;padding:14px 16px}
.step h2{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.step h2 a,.step h2 span{letter-spacing:0;font-weight:500;font-size:12px;color:var(--muted)}
.field{margin-bottom:10px}
.field:last-child{margin-bottom:0}
details.field summary{cursor:pointer;list-style:none;margin-bottom:4px}
details.field summary::-webkit-details-marker{display:none}
details.field summary::after{content:"펼치기";font-size:12px;color:var(--muted)}
details.field[open] summary::after{content:"접기"}
.flabel{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:12px;color:var(--muted)}
.copy{background:#fff;border:1px solid var(--line2);border-radius:3px;padding:3px 9px;font-size:12px;cursor:pointer}
.copy.ok{color:var(--ok);border-color:var(--ok)}
.val{background:var(--raise);border-radius:3px;padding:9px 11px;font:13px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word}
.val.lyrics{font:14px/1.7 var(--sans);max-height:320px;overflow:auto}
.reason{color:var(--muted);font-size:13px;line-height:1.65;margin:10px 0 0}
.drop{display:block;border:1px dashed var(--line2);border-radius:4px;padding:22px 16px;text-align:center;color:var(--muted);cursor:pointer;font-size:13px}
.drop.over{border-color:var(--fg);color:var(--fg)}
.drop input{display:none}
audio{width:100%;margin-top:10px;height:32px}
.videos{display:grid;grid-template-columns:minmax(0,16fr) minmax(0,5fr);gap:10px;align-items:start}
video{width:100%;border-radius:3px;background:#000;display:block}
.note{color:var(--muted);font-size:12px;margin:8px 0 0}
.state{display:flex;align-items:center;gap:8px;font-size:13px}
.links{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.empty{color:var(--muted);padding:40px 0;text-align:center;font-size:13px}
.err{color:var(--err)}

/* 토큰 */
.gate{max-width:480px;margin:10vh auto;border:1px solid var(--line);border-radius:4px;padding:24px}
.gate h1{font-size:16px;margin:0 0 10px}
.gate p{color:var(--muted);margin:0 0 12px;font-size:13px}
.gate input{width:100%;background:#fff;border:1px solid var(--line2);border-radius:4px;padding:9px 12px;margin-bottom:10px;font:13px var(--mono)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:#fff;border-radius:4px;padding:9px 14px;font-size:13px;max-width:calc(100% - 32px)}
.toast a{color:#fff}

@media (max-width:900px){
  .make{grid-template-columns:1fr 1fr}
  .make textarea,.make #style,.make #make{grid-column:1/3}
  .cols{grid-template-columns:1fr}
  .list{position:static;max-height:42vh;border-top:0;border-bottom:1px solid var(--line)}
  .videos{grid-template-columns:1fr}
  .videos video.v{max-width:280px}
  .head{grid-template-columns:72px minmax(0,1fr)}
  .cover{width:72px;height:72px}
}
</style>
</head>
<body>
<div class="wrap">

<section class="gate" id="gate" hidden>
  <h1>mufac</h1>
  <p>GitHub 토큰 필요. <a href="https://github.com/settings/personal-access-tokens/new?name=mufac&description=mufac%20dashboard&expires_in=none&contents=write&actions=write" target="_blank" rel="noopener">발급</a> 시 Repository access는 mufac, Permissions는 Actions·Contents 읽기/쓰기. 토큰은 이 브라우저에만 저장됩니다.</p>
  <input id="tokenIn" type="password" placeholder="github_pat_..." autocomplete="off">
  <button class="btn primary" id="tokenSave">시작</button>
  <p class="note err" id="gateErr"></p>
</section>

<div id="app" hidden>
  <header>
    <div class="mark">mufac</div>
    <button class="ghost" id="logout">토큰 변경</button>
  </header>

  <section class="make">
    <input id="title" placeholder="제목" autocomplete="off">
    <input id="kw" placeholder="키워드" autocomplete="off">
    <select id="genre" aria-label="장르">
      <option value="자동">장르 자동</option><option>트로트</option><option>인디밴드</option><option>발라드</option><option>락</option>
      <option>OST</option><option>팝</option><option>힙합</option><option>포크</option><option>재즈</option><option>시티팝</option><option>댄스</option><option>펑크</option>
    </select>
    <button class="btn primary" id="make">만들기</button>
    <textarea id="content" placeholder="원하는 내용 (비우면 알아서)" rows="1"></textarea>
    <input id="style" placeholder="곡 스타일 (악기, 보컬, 빠르기 등)" autocomplete="off">
  </section>

  <div class="cols">
    <nav class="list" id="list"></nav>
    <main class="detail" id="detail"><div class="empty">불러오는 중</div></main>
  </div>
</div>

</div>
<div class="toast" id="toast" hidden></div>

<script>
const OWNER = "kjhoeakjy", REPO = "mufac", BRANCH = "main";
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}`;
const AUDIO = /\.(mp3|wav|m4a|flac)$/i;
const DROP_TEXT = "MP3 파일 선택 또는 끌어다 놓기";
const $ = (id) => document.getElementById(id);

const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch {} },
};
let token = store.get("mufac.token");
let songs = [];          // {slug, meta, files, audio, release}
// 대시보드에서 요청한 새 곡 {req, label, at}. 새로고침해도 남도록 저장하고, 30분 지나면 버린다
let pending = (() => { try { return JSON.parse(store.get("mufac.pending") || "[]"); } catch { return []; } })()
  .filter(p => p && p.req && Date.now() - (p.at || 0) < 30 * 60 * 1000);
function setPending(list) { pending = list; store.set("mufac.pending", JSON.stringify(list)); }
// 영상 제작을 막 시작한 곡 {slug: 시각}. 실행이 목록에 나타날 때까지 "시작"으로 보여 준다
let videoPending = (() => { try { return JSON.parse(store.get("mufac.video") || "{}"); } catch { return {}; } })();
function markVideo(slug) { videoPending[slug] = Date.now(); store.set("mufac.video", JSON.stringify(videoPending)); }
function videoStarting(s) {
  const ts = videoPending[s.slug];
  if (!ts) return false;
  const run = runFor(s.slug, "영상 만들기");
  if (Date.now() - ts > 15 * 60 * 1000 || (run && Date.parse(run.created_at) >= ts - 60000)) {
    delete videoPending[s.slug]; store.set("mufac.video", JSON.stringify(videoPending)); return false;
  }
  return true;
}
let runs = [];
let selected = store.get("mufac.selected");
let editSlug = null;     // 제목·가사 수정 중인 곡
let editYt = null;       // 유튜브 글 수정 중인 곡
const yamlCache = new Map();

// ---------------------------------------------------------------- GitHub
async function gh(path, opts = {}) {
  const res = await fetch(path.startsWith("http") ? path : API + path, {
    cache: "no-cache",  // 브라우저는 API 응답을 60초 재사용하므로 매번 서버에 확인(304면 요금 없음)
    ...opts,
    headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json",
               "X-GitHub-Api-Version": "2022-11-28", ...(opts.headers || {}) },
  });
  if (res.status === 401) { logout("토큰이 올바르지 않습니다."); throw new Error("401"); }
  if (!res.ok && res.status !== 404) {
    let msg = res.status + "";
    try { msg = (await res.json()).message || msg; } catch {}
    throw new Error(msg);
  }
  if (res.status === 404) return null;
  if (res.status === 204) return {};
  return res.json();
}

function b64utf8(b64) {
  const bin = atob(b64.replace(/\n/g, ""));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}

async function loadSongs() {
  const head = await gh(`/git/ref/heads/${BRANCH}`);
  const tree = await gh(`/git/trees/${head.object.sha}?recursive=1`);
  const bySlug = {};
  for (const n of tree.tree) {
    const m = n.path.match(/^songs\/([^/]+)\/(.+)$/);
    if (m && !m[2].includes("/")) (bySlug[m[1]] ||= { slug: m[1], files: {} }).files[m[2]] = n.sha;
  }
  const list = Object.values(bySlug).filter(s => s.files["song.yaml"]);
  await Promise.all(list.map(async s => {
    const sha = s.files["song.yaml"];
    if (!yamlCache.has(sha)) {
      const blob = await gh(`/git/blobs/${sha}`);
      yamlCache.set(sha, jsyaml.load(b64utf8(blob.content)) || {});
    }
    s.meta = yamlCache.get(sha);
    s.audio = Object.keys(s.files).find(f => AUDIO.test(f)) || null;
  }));
  const rels = await gh(`/releases?per_page=100`) || [];
  const relMap = {};
  for (const r of rels) if (r.tag_name.startsWith("song-")) relMap[r.tag_name.slice(5)] = r;
  for (const s of list) s.release = relMap[s.slug] || null;
  for (const slug of Object.keys(relMap))
    if (!bySlug[slug]) deleteRelease(relMap[slug], slug).catch(() => {});
  list.sort((a, b) => b.slug.localeCompare(a.slug, "en", { numeric: true }));
  songs = list;
  for (const p of [...pending]) {
    const hit = songs.find(s => s.meta?.request?.id === p.req);
    if (hit) { setPending(pending.filter(x => x !== p)); selected = hit.slug; store.set("mufac.selected", selected); }
  }
}


async function loadRuns() {
  const r = await gh(`/actions/runs?per_page=30`);
  runs = r?.workflow_runs || [];
  for (const p of [...pending]) {
    const run = runs.find(x => x.display_title.startsWith(`새 곡 ${p.req}`));
    if (run && run.status === "completed" && run.conclusion !== "success") {
      setPending(pending.filter(x => x !== p));
      toast("새 곡 생성 실패", run.html_url);
    }
  }
  // 진행 중인 새 곡·영상은 단계(작업 step)를 받아 진행률을 계산한다
  await Promise.all(runs.filter(x => (wf(x) === "새 곡" || wf(x) === "영상 만들기") && active(x)).map(async x => {
    try { x.jobs = (await gh(`/actions/runs/${x.id}/jobs`))?.jobs || []; } catch { x.jobs = []; }
  }));
}

// 작업별 단계: prep은 준비(설치) 구간 [시작 %, 끝 %, 보통 걸리는 초], stages는 [단계 이름, 시작 %, 끝 %, 보통 걸리는 초]
const STAGE_SETS = {
  "새 곡": { prep: [0, 8, 30], stages: [["조사", 8, 30, 50], ["작사", 30, 85, 150], ["검수", 85, 97, 45], ["저장", 97, 100, 5]] },
  "영상 만들기": { prep: [0, 12, 95], stages: [["가사 위치", 12, 45, 170], ["본편", 45, 82, 110], ["쇼츠", 82, 94, 40], ["영상 보관", 94, 98, 6], ["결과 저장", 98, 100, 5]] },
};
function progressOf(run) {
  const set = STAGE_SETS[wf(run)] || STAGE_SETS["새 곡"];
  const steps = run.jobs?.[0]?.steps || [];
  if (run.status === "queued" || !steps.length) return { pct: 2, label: "대기" };
  let band = [...set.prep], label = "준비";
  for (const [key, a, b] of set.stages)
    if (steps.some(s => s.status === "completed" && s.name.startsWith(key))) { band = [b, b, 0]; label = key; }
  const cur = steps.find(s => s.status === "in_progress");
  if (cur) {
    const m = set.stages.find(([k]) => cur.name.startsWith(k));
    let since = cur.started_at;
    if (m) { band = [m[1], m[2], m[3]]; label = m[0]; }
    else if (band[2] === 0) { band = [band[1], band[1] + 3, 20]; }
    else since = run.run_started_at || cur.started_at;  // 준비 구간은 실행 시작부터 센다
    const sec = Math.max(0, (Date.now() - Date.parse(since)) / 1000);
    return { pct: band[0] + (band[1] - band[0]) * Math.min(0.95, sec / band[2]), label };
  }
  return { pct: band[1], label };
}
function making() {
  const out = runs.filter(x => wf(x) === "새 곡" && active(x)).map(x => {
    const req = (x.display_title.match(/^새 곡 (\S*)/) || [])[1] || "";
    const p = pending.find(q => q.req === req);
    const label = p?.label || x.display_title.replace(/^새 곡 \S*\s*/, "") || "새 곡";
    const pr = progressOf(x);
    return { key: x.id, label, stage: pr.label, pct: pr.pct };
  });
  for (const p of pending)
    if (!runs.some(x => x.display_title.startsWith(`새 곡 ${p.req}`))) out.unshift({ key: p.req, label: p.label, stage: "요청", pct: 1 });
  return out;
}

function runFor(slug, workflow) {
  return runs.find(r => wf(r) === workflow && r.display_title.includes(slug));
}
const active = (r) => r && r.status !== "completed";
// 실행의 name은 run-name(예: "새 곡 abc 제목")이라 워크플로 파일로 어떤 작업인지 가린다
const WORKFLOWS = { "new-song.yml": "새 곡", "produce.yml": "영상 만들기", "upload.yml": "유튜브 업로드", "refresh.yml": "글 갱신" };
const wf = (r) => WORKFLOWS[(r?.path || "").split("/").pop()] || r?.name;

// ---------------------------------------------------------------- 상태
function status(s) {
  const prod = runFor(s.slug, "영상 만들기"), up = runFor(s.slug, "유튜브 업로드");
  if (active(runFor(s.slug, "글 갱신"))) return ["run", "글 갱신 중"];
  if (active(up)) return ["run", "업로드 중"];
  if (s.meta?.youtube?.main) return ["done", "업로드 완료"];
  if (videoStarting(s)) return ["run", "영상 제작 시작"];
  if (active(prod)) { const pr = progressOf(prod); return ["run", `영상 제작 · ${pr.label} ${Math.round(pr.pct)}%`]; }
  if (s.release) return ["ready", "업로드 대기"];
  if (s.audio && prod?.conclusion === "failure") return ["fail", "영상 제작 실패"];
  if (s.audio) return ["run", "영상 제작 대기"];
  return ["wait", "Suno 대기"];
}

function asset(s, name) {
  const a = s.release?.assets?.find(x => x.name === name);
  return a ? a.browser_download_url : null;
}
const raw = (s, name) => s.files[name] ? `${RAW}/songs/${encodeURIComponent(s.slug)}/${encodeURIComponent(name)}?v=${s.files[name].slice(0, 8)}` : null;

// ---------------------------------------------------------------- 그리기
function esc(t) { return String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// 곡의 장르: 요청에 적은 장르가 있으면 그것, 없으면 Suno 스타일 문구의 첫 장르로 판정
const GENRES = [["트로트", /trot/], ["발라드", /ballad/], ["OST", /\bost\b|soundtrack|cinematic/], ["시티팝", /city pop/], ["힙합", /hip.?hop|rap\b|trap\b|boom bap/],
  ["재즈", /jazz|swing|bossa/], ["포크", /folk|acoustic/], ["펑크", /punk|ska/], ["댄스", /dance|edm|house|disco/], ["인디밴드", /indie|dream pop|shoegaze/],
  ["락", /rock|metal|grunge/], ["팝", /pop|synth/]];
function genreOf(s) {
  const g = s.meta?.request?.genre;
  if (g && g !== "자동") return g;
  const st = (s.meta?.style || "").toLowerCase();
  return (GENRES.find(([, re]) => re.test(st)) || ["기타"])[0];
}
function grpOpen(g) { const v = store.get("mufac.grp." + g); return v == null ? null : v === "1"; }

function renderList() {
  const el = $("list");
  const items = making().map(p => `
    <div class="item" aria-busy="true"><div class="thumb"></div>
      <div style="min-width:0"><div class="t">${esc(p.label)}</div>
      <div class="s"><span class="dot run"></span>${esc(p.stage)} ${Math.round(p.pct)}%</div>
      <div class="bar"><i style="width:${Math.round(p.pct)}%"></i></div></div></div>`);
  // 보관함: 장르별로 접어 두고, 고른 곡이 있는 장르만 기본으로 펼친다
  const groups = new Map();
  for (const s of songs) { const g = genreOf(s); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(s); }
  const order = [...groups.keys()].sort((a, b) => groups.get(b).length - groups.get(a).length || a.localeCompare(b, "ko"));
  for (const g of order) {
    const list = groups.get(g);
    const hasSel = list.some(s => s.slug === selected);
    const open = grpOpen(g) ?? hasSel;
    const rows = list.map(s => {
      const [k, label] = status(s);
      const th = asset(s, "thumb.jpg") || raw(s, "cover.jpg");
      return `<button class="item ${s.slug === selected ? "on" : ""}" data-slug="${esc(s.slug)}">
        <div class="thumb" style="${th ? `background-image:url('${th}')` : ""}"></div>
        <div style="min-width:0"><div class="t">${esc(s.meta.title || s.slug)}</div>
        <div class="s"><span class="dot ${k}"></span>${label}</div></div></button>`;
    });
    items.push(`<details class="grp" data-g="${esc(g)}" ${open ? "open" : ""}><summary>${esc(g)}<span class="n">${list.length}</span></summary>${rows.join("")}</details>`);
  }
  el.innerHTML = items.join("") || `<div class="empty">곡 없음</div>`;
  el.querySelectorAll("[data-slug]").forEach(b => b.onclick = () => { selected = b.dataset.slug; store.set("mufac.selected", selected); render(); });
  el.querySelectorAll("details.grp").forEach(d => d.ontoggle = () => store.set("mufac.grp." + d.dataset.g, d.open ? "1" : "0"));
}

function field(label, value, cls = "") {
  return `<div class="field"><div class="flabel"><span>${label}</span>
    <button class="copy" data-copy="${esc(value)}">복사</button></div>
    <div class="val ${cls}">${esc(value)}</div></div>`;
}

  const el = $("detail");

  else video = `<div class="state"><span class="dot"></span>MP3 업로드 후 자동 제작</div>`;

  let tube = "";
  const rf = runFor(s.slug, "글 갱신");
  if (active(rf)) tube = `<div class="state"><span class="dot run"></span>유튜브 글 다시 쓰는 중</div>`;
  else if (active(up)) tube = `<div class="state"><span class="dot run"></span>업로드 중</div>`;
  else if (yt.main) tube = `<div class="links">
      <a href="https://youtu.be/${esc(yt.main)}" target="_blank" rel="noopener">본편</a>
      ${yt.short ? `<a href="https://youtube.com/shorts/${esc(yt.short)}" target="_blank" rel="noopener">쇼츠</a>` : ""}
      <a href="https://studio.youtube.com" target="_blank" rel="noopener">YouTube Studio (공개 전환)</a></div>`;
  else if (editYt === s.slug) {
    const pv = m.youtube_preview || {};
    tube = `<form class="editor" id="ytForm">
      <label class="flabel"><span>제목</span></label><input id="ytTitle" value="${esc(pv.title || "")}" maxlength="100" autocomplete="off">
      <label class="flabel"><span>쇼츠 제목</span></label><input id="ytShorts" value="${esc(pv.shorts_title || "")}" maxlength="100" autocomplete="off">
      <label class="flabel"><span>설명</span></label><textarea id="ytDesc" spellcheck="false">${esc(pv.description || "")}</textarea>
      <label class="flabel"><span>해시태그 (띄어쓰기로 구분, 6개까지)</span></label><input id="ytHash" value="${esc((pv.hashtags || []).map(t => "#" + t).join(" "))}" autocomplete="off">
      <label class="flabel"><span>태그 (쉼표로 구분)</span></label><textarea id="ytTags" class="short" spellcheck="false">${esc((pv.tags || []).join(", "))}</textarea>
      <div class="row"><button class="btn primary" type="submit">저장</button><button class="ghost" type="button" id="ytCancel">취소</button>
      <p class="note">저장한 글이 그대로 올라갑니다. 제목·가사를 다시 고치면 글도 다시 만들어집니다.</p></div></form>`;
  } else {
    const pv = m.youtube_preview || {};
    const meta = pv.title ? `
      ${field("제목", pv.title)}
      ${field("쇼츠 제목", pv.shorts_title || "")}
      <details class="field"><summary class="flabel">설명</summary><div class="val lyrics">${esc(pv.description || "")}</div></details>
      ${field("해시태그", (pv.hashtags || []).map(t => "#" + t).join(" "))}
      ${field("태그", (pv.tags || []).join(", "))}
      <div class="field"><div class="flabel"><span>재생목록 · 공개 범위</span></div><div class="val">${esc((pv.playlists || []).join(", "))} · ${esc(pv.privacy || "private")}</div></div>
      <p class="note"><button class="copy" id="ytEdit">글 수정</button>${m.youtube_preview_edited ? ` 직접 고친 글 · <button class="copy" id="ytAuto">다시 자동 생성</button>` : ""}</p>` : "";
    tube = `${meta}<button class="btn primary" id="publish" ${main ? "" : "disabled"}>유튜브 업로드</button>
      ${up?.conclusion === "failure" ? `<p class="note err">이전 업로드 실패 · <a href="${up.html_url}" target="_blank" rel="noopener">실행 기록</a></p>` : ""}`;
  }

  el.innerHTML = `
    <div class="head ${cover ? "" : "nocover"}">${cover ? `<img class="cover" src="${cover}" alt="">` : ""}
      <div><h1>${esc(m.title)}${editSlug === s.slug ? "" : `<button class="ghost fix" id="edit">제목·가사 수정</button><button class="ghost fix" id="del">삭제</button>`}</h1>
      <p>${esc(m.story || "")}</p></div></div>
    ${editSlug === s.slug ? `<section class="step"><h2>수정</h2>
      <form class="editor" id="editForm">
        <input id="editTitle" value="${esc(m.title)}" maxlength="60" autocomplete="off" aria-label="제목">

        <p class="note">저장하면 유튜브 제목·설명·해시태그를 다시 씁니다${s.release ? ". 가사를 바꾸면 영상도 다시 만들어야 합니다" : ""}</p></div>
      </form></section>` : ""}
    <section class="step"><h2>SUNO <span>Custom · ${cover ? `<a href="${cover}" download>곡 이미지</a> · ` : ""}<a href="https://suno.com/create" target="_blank" rel="noopener">Suno</a> · v5 · Weirdness 낮게 · Style Influence 높게</span></h2>
      ${field("Style", m.style || "")}
      ${field("Exclude styles", m.exclude || "")}
      ${field("Title", m.title || "")}
      ${field("Lyrics", (m.lyrics || "").trim(), "lyrics")}
    </section>
    <section class="step"><h2>곡</h2>
      <label class="drop" id="drop">${s.audio ? "다른 MP3로 교체" : DROP_TEXT}
        <input type="file" id="file" accept=".mp3,.wav,.m4a,audio/*"></label>
      ${audioUrl ? `<audio src="${audioUrl}" controls preload="none"></audio>` : ""}

  el.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copy(b));
  const drop = $("drop"), file = $("file");

  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) uploadAudio(s, f); };
  if ($("publish")) $("publish").onclick = () => publish(s);
  if ($("reprod")) $("reprod").onclick = () => reproduce(s);
  if ($("del")) $("del").onclick = () => deleteSong(s);
  if ($("ytEdit")) $("ytEdit").onclick = () => { editYt = s.slug; renderDetail(); $("ytTitle").focus(); };
  if ($("ytCancel")) $("ytCancel").onclick = () => { editYt = null; renderDetail(); };
  if ($("ytAuto")) $("ytAuto").onclick = async () => {

    catch (err) { toast("시작 실패: " + err.message); }
  };
  if ($("ytForm")) $("ytForm").onsubmit = async e => {
    e.preventDefault();
    const hashtags = $("ytHash").value.split(/\s+/).map(x => x.replace(/^#/, "").trim()).filter(Boolean).slice(0, 6);
    const tags = $("ytTags").value.split(",").map(x => x.trim()).filter(Boolean);

    e.submitter.disabled = true;
    try { await saveYoutube(s, pv); editYt = null; toast("유튜브 글 저장"); await loadSongs(); render(); }
    catch (err) { toast("저장 실패: " + err.message); e.submitter.disabled = false; }
  };
  if ($("edit")) $("edit").onclick = () => { editSlug = s.slug; renderDetail(); $("editTitle").focus(); };
  if ($("editCancel")) $("editCancel").onclick = () => { editSlug = null; renderDetail(); };
  if ($("editForm")) $("editForm").onsubmit = async e => {
    e.preventDefault();

    if (!title) { $("editTitle").focus(); return; }
    if (title === m.title && lyrics.trim() === (m.lyrics || "").trim()) { editSlug = null; renderDetail(); return; }
    e.submitter.disabled = true;
    try {
      const changed = await saveEdit(s, title, lyrics);
      editSlug = null;
      toast(changed && s.release ? "저장. 글 갱신 뒤 영상을 다시 제작해야 합니다" : "저장. 유튜브 글 갱신 중");
      await loadSongs(); render(); poll(5000);
    } catch (err) { toast("저장 실패: " + err.message); e.submitter.disabled = false; }
  };
}

function render() {
  if (!songs.some(x => x.slug === selected)) selected = songs[0]?.slug || null;
  renderList(); renderDetail();
}

async function copy(btn) {
  const text = btn.dataset.copy;
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement("textarea"); ta.value = text; document.body.append(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
  btn.textContent = "복사 완료"; btn.classList.add("ok");
  setTimeout(() => { btn.textContent = "복사"; btn.classList.remove("ok"); }, 1400);
}

function toast(msg, link) {
  const t = $("toast");
  t.innerHTML = esc(msg) + (link ? ` <a href="${link}" target="_blank" rel="noopener">실행 기록</a>` : "");
  t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 6000);
}

// ---------------------------------------------------------------- 동작
async function dispatch(workflow, inputs) {
  await gh(`/actions/workflows/${workflow}/dispatches`, { method: "POST", body: JSON.stringify({ ref: BRANCH, inputs }) });
}

async function makeSong() {
  const v = id => $(id).value.trim();
  const title = v("title"), idea = v("kw"), content = v("content"), genre = $("genre").value, style = v("style");
  const req = Date.now().toString(36);
  $("make").disabled = true;
  try {
    await dispatch("new-song.yml", { title, idea, content, genre, style, req, hook: "", theme: "자동", vocal: "자동" });
    setPending([{ req, label: title || idea || content.slice(0, 24) || "자동", at: Date.now() }, ...pending]);
    for (const id of ["title", "kw", "content", "style"]) $(id).value = "";
    renderList();
    toast("작사 시작. 약 5분 소요");
    poll(4000);
  } catch (e) { toast("시작 실패: " + e.message); }
  finally { $("make").disabled = false; }
}

function b64enc(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

// 유튜브 글 직접 수정: song.yaml의 youtube_preview를 바꾸고 표시를 남긴다. 업로드는 이 글을 그대로 쓴다.
async function saveYoutube(s, pv) {
  const path = `/contents/songs/${encodeURIComponent(s.slug)}/song.yaml`;
  const cur = await gh(`${path}?ref=${BRANCH}&t=${Date.now()}`);
  const m = (cur && jsyaml.load(b64utf8(cur.content))) || JSON.parse(JSON.stringify(s.meta));
  m.youtube_preview = { ...(m.youtube_preview || {}), ...pv };
  m.youtube_preview_edited = true;
  await gh(path, { method: "PUT",
    body: JSON.stringify({ message: `유튜브 글: ${s.slug}`, content: b64enc(jsyaml.dump(m, { lineWidth: -1, noRefs: true })), sha: cur ? cur.sha : s.files["song.yaml"], branch: BRANCH }) });
}

// 제목·가사 수정: song.yaml을 바꿔 올리고, 글 갱신 실행으로 유튜브 제목·설명·해시태그를 다시 쓰게 한다
async function saveEdit(s, title, lyrics) {
  // 저장 직전에 최신 파일을 다시 읽어 그 위에 고친다(그 사이 다른 갱신이 있었어도 충돌하지 않게)
  const path = `/contents/songs/${encodeURIComponent(s.slug)}/song.yaml`;
  const cur = await gh(`${path}?ref=${BRANCH}&t=${Date.now()}`);
  const m = (cur && jsyaml.load(b64utf8(cur.content))) || JSON.parse(JSON.stringify(s.meta));
  const old = m.title || "";
  const lyricsChanged = lyrics.trim() !== (m.lyrics || "").trim();
  m.title = title; m.lyrics = lyrics.trim() + "\n";
  const pv = m.youtube_preview;
  if (pv && old && old !== title)  // 갱신이 끝나기 전까지 보일 임시 값
    for (const k of ["title", "shorts_title", "description"]) if (typeof pv[k] === "string") pv[k] = pv[k].split(old).join(title);
  await gh(path, { method: "PUT",
    body: JSON.stringify({ message: `수정: ${title}`, content: b64enc(jsyaml.dump(m, { lineWidth: -1, noRefs: true })), sha: cur ? cur.sha : s.files["song.yaml"], branch: BRANCH }) });
  await dispatch("refresh.yml", { slug: s.slug, lyrics_changed: String(lyricsChanged) });
  return lyricsChanged;
}

function readB64(file) {
  return new Promise((ok, no) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(",")[1]);
    r.onerror = () => no(r.error);
    r.readAsDataURL(file);
  });
}

async function uploadAudio(s, file) {
  const ext = (file.name.match(/\.(mp3|wav|m4a|flac)$/i) || [".mp3"])[0].toLowerCase();
  if (file.size > 90 * 1024 * 1024) { toast("90MB 이하 파일만 가능합니다."); return; }
  const drop = $("drop");
  drop.firstChild.textContent = "업로드 중";
  try {
    const name = "song" + ext;
    // 곡을 바꾸면 예전 자막 타이밍과 다른 이름의 곡 파일은 지운다
    for (const f of Object.keys(s.files)) {
      if (f === "timing.lrc" || (AUDIO.test(f) && f !== name)) {
        await gh(`/contents/songs/${s.slug}/${f}`, { method: "DELETE",
          body: JSON.stringify({ message: `정리: ${s.slug}/${f}`, sha: s.files[f], branch: BRANCH }) });
      }
    }
    const body = { message: `mp3: ${s.slug}`, content: await readB64(file), branch: BRANCH };
    if (s.files[name]) body.sha = s.files[name];
    await gh(`/contents/songs/${s.slug}/${name}`, { method: "PUT", body: JSON.stringify(body) });
    markVideo(s.slug);
    toast("업로드 완료. 영상 제작 시작");
    await refresh();
    poll(5000);
  } catch (e) {
    toast("업로드 실패: " + e.message);
    drop.firstChild.textContent = DROP_TEXT;
  }
}

async function publish(s) {
  $("publish").disabled = true;
  try { await dispatch("upload.yml", { slug: s.slug }); toast("유튜브 업로드 시작"); setTimeout(refresh, 4000); poll(5000); }
  catch (e) { toast("시작 실패: " + e.message); $("publish").disabled = false; }
}

async function deleteRelease(rel, slug) {
  await gh(`/releases/${rel.id}`, { method: "DELETE" });
  await gh(`/git/refs/tags/song-${slug}`, { method: "DELETE" });
}

// 곡 삭제: 폴더의 모든 파일을 한 커밋으로 지우고, 영상(Release)도 지운다. 유튜브에 올린 영상은 남는다
async function deleteSong(s) {
  const yt = s.meta.youtube || {};
  const extra = yt.main ? "\n유튜브에 올린 영상은 남으니 YouTube Studio에서 따로 지워야 합니다." : "";
  if (!confirm(`'${s.meta.title || s.slug}'을(를) 삭제할까요? 가사, 그림, 노래 파일, 영상이 모두 지워집니다.${extra}`)) return;
  $("del").disabled = true;
  try {
    const head = await gh(`/git/ref/heads/${BRANCH}`);
    const commit = await gh(`/git/commits/${head.object.sha}`);
    const tree = await gh(`/git/trees`, { method: "POST", body: JSON.stringify({
      base_tree: commit.tree.sha,
      tree: Object.keys(s.files).map(f => ({ path: `songs/${s.slug}/${f}`, mode: "100644", type: "blob", sha: null })),
    }) });
    const made = await gh(`/git/commits`, { method: "POST", body: JSON.stringify({ message: `삭제: ${s.slug}`, tree: tree.sha, parents: [head.object.sha] }) });
    await gh(`/git/refs/heads/${BRANCH}`, { method: "PATCH", body: JSON.stringify({ sha: made.sha }) });
    if (s.release) await deleteRelease(s.release, s.slug);
    songs = songs.filter(x => x.slug !== s.slug);
    if (selected === s.slug) { selected = null; store.set("mufac.selected", null); }
    toast(`삭제: ${s.meta.title || s.slug}`);
    render();
    setTimeout(refresh, 3000);
  } catch (e) { toast("삭제 실패: " + e.message); if ($("del")) $("del").disabled = false; }
}

async function reproduce(s) {
  try { await dispatch("produce.yml", { slug: s.slug }); markVideo(s.slug); renderList(); renderDetail(); toast("영상 제작 다시 시작"); setTimeout(refresh, 4000); poll(5000); }
  catch (e) { toast("시작 실패: " + e.message); }
}

// ---------------------------------------------------------------- 갱신
let timer = null, busyBefore = false;
async function refresh() {
  try {
    await loadRuns();
    const busy = pending.length || runs.some(active);
    if (!songs.length || busyBefore !== busy || !busy || pending.length) await loadSongs();
    busyBefore = busy;
    render();
    return busy;
  } catch (e) {
    if (e.message !== "401") $("detail").innerHTML = `<div class="empty err">${esc(e.message)}</div>`;
    return false;
  }
}
function poll(ms) {
  clearTimeout(timer);
  timer = setTimeout(async () => { const busy = await refresh(); poll(busy ? 8000 : 60000); }, ms);
}
// 진행률은 시간에 따라 움직이므로 1초마다 목록만 다시 그린다
setInterval(() => {
  const videoBusy = runs.some(r => wf(r) === "영상 만들기" && active(r));
  if (!making().length && !videoBusy) return;
  renderList();
  const s = songs.find(x => x.slug === selected);
  if (s && !editSlug && !editYt && active(runFor(s.slug, "영상 만들기"))) renderDetail();
}, 1000);

function logout(msg) {
  token = null; store.set("mufac.token", null);
  $("app").hidden = true; $("gate").hidden = false; $("gateErr").textContent = msg || "";
}

$("tokenSave").onclick = async () => {
  token = $("tokenIn").value.trim();
  if (!token) return;
  store.set("mufac.token", token);
  start();
};
$("logout").onclick = () => logout();
$("make").onclick = () => makeSong();
for (const id of ["title", "kw", "style"]) $(id).onkeydown = e => { if (e.key === "Enter") makeSong(); };
document.addEventListener("visibilitychange", () => { if (!document.hidden && token) poll(100); });

async function start() {
  $("gate").hidden = true; $("app").hidden = false;
  const busy = await refresh();
  poll(busy ? 8000 : 60000);
}
token ? start() : ($("gate").hidden = false);
</script>
