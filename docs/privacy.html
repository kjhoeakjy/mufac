<h1>개인정보처리방침</h1>
<p>mufac은 운영자 한 명이 자신의 유튜브 채널에 영상을 올리기 위해 쓰는 도구입니다.</p>
<ul>
<li>YouTube Data API로 운영자 본인의 채널에 영상, 제목, 설명, 썸네일을 올리는 데만 Google 계정 권한을 씁니다.</li>
<li>다른 사용자의 개인정보를 수집하거나 저장하지 않습니다.</li>
<li>인증 토큰은 운영자의 GitHub 저장소 비밀 값으로만 보관하며 제3자와 공유하지 않습니다.</li>
<li>권한은 Google 계정의 보안 설정(서드파티 앱)에서 언제든 해제할 수 있습니다.</li>
</ul>
