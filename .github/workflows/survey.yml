name: 줄 끝 조사
run-name: "줄 끝 조사 ${{ inputs.probe && '(구조 확인)' || inputs.genres }}"

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "차트·가사 페이지 구조만 확인"
        type: boolean
        default: false
      genres:
        description: "조사할 묶음(쉼표, 비우면 전부): 발라드,댄스·팝,힙합,R&B,인디,록,트로트,포크,OST"
        required: false
        default: ""
      limit:
        description: "묶음당 곡 수"
        required: false
        default: "160"

permissions:
  contents: write

concurrency:
  group: survey
  cancel-in-progress: false

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 구조 확인
        if: ${{ inputs.probe }}
        run: python tools/endings_survey.py --probe
      - name: 조사
        if: ${{ !inputs.probe }}
        env:
          GENRES: ${{ inputs.genres }}
          LIMIT: ${{ inputs.limit }}
        run: python tools/endings_survey.py --genres "$GENRES" --limit "$LIMIT"
      - name: 저장
        if: ${{ !inputs.probe }}
        run: |
          git config user.name "mufac"
          git config user.email "mufac@users.noreply.github.com"
          git add assets/lyrics/_장르어미.json assets/lyrics/_장르어미.md
          git diff --cached --quiet || git commit -m "장르별 줄 끝 실측"
          pushed=0
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin main && git push -q; then pushed=1; break; fi
            git rebase --abort 2>/dev/null || true; sleep $((i * 5))
          done
          [ "$pushed" = 1 ] || { echo "::error::저장 실패: push가 다섯 번 밀렸습니다"; exit 1; }
