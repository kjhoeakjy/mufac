name: stock-collect-test
on:
  workflow_dispatch:
    inputs:
      args:
        description: "collect args"
        default: ""
  push:
    branches: [claude/project-thread-4ct9w2]
    paths: [stock/collect.py, stock/common.py, .github/workflows/stock-collect-test.yml]
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r stock/requirements.txt
      - uses: actions/cache@v4
        with:
          path: stock/cache
          key: stock-cache-${{ github.run_id }}
          restore-keys: stock-cache-
      - run: python -m stock.collect ${{ inputs.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: stock-data
          path: stock/data
          retention-days: 3
