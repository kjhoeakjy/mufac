name: stock-collect-test
on:
  workflow_dispatch:
    inputs:
      args:
        description: "collect args"
        default: ""
  push:
    branches: [claude/project-thread-4ct9w2]
    paths: [stock/collect.py, stock/collect_text.py, stock/common.py, .github/workflows/stock-collect-test.yml]
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r stock/requirements.txt
      - uses: actions/cache@v4
        with:
          path: stock/cache
          key: stock-cache-${{ github.run_id }}
          restore-keys: stock-cache-
      - run: python -m stock.collect ${{ inputs.args }}
      - run: python -m stock.collect_text ${{ inputs.args }}
      - name: push data branch
        run: |
          cd stock/data
          git init -q -b stock-data
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -qm "data $(date -u +%Y%m%dT%H%M)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" stock-data
