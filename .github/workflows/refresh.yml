name: 글 갱신
run-name: "글 갱신 ${{ inputs.slug }}"

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "곡 폴더 이름 (예: 261030-1)"
        required: true
      lyrics_changed:
        description: "가사가 바뀌었으면 true (자막 타이밍을 지운다)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install anthropic PyYAML
      - name: 유튜브 글 다시 쓰기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLUG: ${{ inputs.slug }}
          CHANGED: ${{ inputs.lyrics_changed }}
        run: |
          flag=""; [ "$CHANGED" = "true" ] && flag="--lyrics-changed"
          python -m mufac refresh "$SLUG" $flag
      - name: 저장
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          git config user.name "mufac"
          git config user.email "mufac@users.noreply.github.com"
          git add -A "songs/$SLUG"
          git diff --cached --quiet || git commit -m "글 갱신: $SLUG"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
