name: 상한가 예측
run-name: "상한가 예측 ${{ github.event_name == 'schedule' && '자동' || '수동' }}"

on:
  workflow_dispatch:
    inputs:
      fast:
        description: "빠른 시험(3개월 검증)"
        type: boolean
        default: false
  schedule:
    # 평일 아침 07:20 KST (22:20 UTC 전날). 수집·학습 후 08:30 전에 페이지 갱신.
    - cron: "20 22 * * 0-4"

permissions:
  contents: write

concurrency:
  group: stock-daily
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r stock/requirements.txt anthropic
      - uses: actions/cache@v4
        with:
          path: stock/cache
          key: stock-cache-${{ github.run_id }}
          restore-keys: stock-cache-
      - name: 수집
        run: |
          python -m stock.collect
          python -m stock.collect_text
      - name: 학습·예측
        run: python -m stock.run ${{ inputs.fast && '--fast' || '' }}
      - name: 데이터 브랜치 갱신
        run: |
          cd stock/data
          rm -f panel.parquet
          git init -q -b stock-data
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -qm "data $(date -u +%Y%m%dT%H%M)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" stock-data
      - name: 결과 커밋
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add docs/stock
          git diff --cached --quiet || git commit -qm "상한가 예측 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git pull -q --rebase origin ${{ github.ref_name }} || true
          git push -q origin HEAD:${{ github.ref_name }}
