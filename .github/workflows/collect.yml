name: 클래식 악보 수집
run-name: "클래식 악보 수집 ${{ inputs.ids }}"

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "곡 id (띄어쓰기로 여러 개, 비우면 아직 없는 곡 전부)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests PyYAML numpy mido
      - name: 수집
        env:
          IDS: ${{ inputs.ids }}
        run: python tools/collect_midi.py $IDS
      - name: 검증(읽히는지, 음이 있는지)
        run: |
          python - <<'EOF'
          import sys; sys.path.insert(0, '.')
          from pathlib import Path
          from mufac import midi, classical
          bad = []
          for f in sorted(classical.MIDI_DIR.glob('*.mid')):
              try:
                  ns = midi.notes(f)
                  sky = midi.skyline(ns)
                  if len(ns) < 30 or len(sky) < 20:
                      raise ValueError(f'음이 너무 적음 {len(ns)}')
                  print(f'{f.stem:22} 음 {len(ns):5}  선율 {len(sky):4}  길이 {max(e for _,e,*_ in ns):6.1f}s')
              except Exception as e:
                  print('삭제', f.name, e); bad.append(f); f.unlink()
          EOF
      - name: 저장
        run: |
          git config user.name "mufac"
          git config user.email "mufac@users.noreply.github.com"
          git add assets/classical/midi
          git diff --cached --quiet || git commit -m "클래식 MIDI 수집"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
