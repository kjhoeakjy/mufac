name: 새 곡
run-name: "새 곡 ${{ inputs.req }} ${{ inputs.title || inputs.idea || '자동' }}"

on:
  workflow_dispatch:
    inputs:
      idea:
        description: "키워드나 상황 (비우면 알아서)"
        required: false
        default: ""
      hook:
        description: "후렴 문장을 직접 정하려면 (비워도 됨)"
        required: false
        default: ""
      theme:
        description: "주제"
        type: choice
        options: [자동, 사랑, 어른, 아픔]
        default: 자동
      style:
        description: "곡 스타일 (예: 어쿠스틱, 남자 보컬, 밴드 사운드)"
        required: false
        default: ""
      classic:
        description: "클래식 원곡: auto(의미로 고름), none, 또는 곡 id"
        required: false
        default: "auto"
      req:
        description: "대시보드 요청 번호 (비워도 됨)"
        required: false
        default: ""
      vocal:
        description: "보컬"
        type: choice
        options: [자동, 여성, 남성, 듀엣]
        default: 자동
      title:
        description: "제목 (비우면 알아서)"
        required: false
        default: ""
      content:
        description: "노래에 담을 내용 (비워도 됨)"
        required: false
        default: ""
      genre:
        description: "장르 (자동, 트로트, 인디밴드, 발라드, 락, OST, 팝, 힙합, 포크, 재즈, 시티팝, 댄스, 펑크)"
        required: false
        default: "자동"
  schedule:
    # 매일 아침 8시(한국 시간)에 한 곡씩 준비해 둔다. 원하지 않으면 이 두 줄을 지우세요.
    - cron: "0 23 * * *"

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  new:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      IDEA: ${{ inputs.idea }}
      HOOK: ${{ inputs.hook }}
      THEME: ${{ inputs.theme }}
      VOCAL: ${{ inputs.vocal }}
      STYLE: ${{ inputs.style }}
      REQ: ${{ inputs.req }}
      CLASSIC: ${{ inputs.classic || 'auto' }}
      TITLE_IN: ${{ inputs.title }}
      CONTENT: ${{ inputs.content }}
      GENRE: ${{ inputs.genre || '자동' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install anthropic requests PyYAML Pillow numpy mido imageio-ffmpeg
      - name: 원곡 고르기 · 조사
        run: python -m mufac new --stage plan --idea "$IDEA" --hook "$HOOK" --theme "$THEME" --vocal "$VOCAL" --style "$STYLE" --req "$REQ" --classic "$CLASSIC" --title "$TITLE_IN" --content "$CONTENT" --genre "$GENRE"
      - name: 작사
        run: python -m mufac new --stage write
      - name: 검수 · 사진 · 멜로디
        id: song
        run: python -m mufac new --stage finish
      - name: 저장
        env:
          SLUG: ${{ steps.song.outputs.slug }}
          TITLE: ${{ steps.song.outputs.title }}
        run: |
          git config user.name "mufac"
          git config user.email "mufac@users.noreply.github.com"
          git add "songs/$SLUG"
          git commit -m "새 곡: $TITLE"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          echo "### [$TITLE](https://github.com/${{ github.repository }}/tree/main/songs/$SLUG)" >> "$GITHUB_STEP_SUMMARY"
