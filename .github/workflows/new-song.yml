name: 새 곡
run-name: "새 곡 ${{ inputs.req }} ${{ inputs.title || inputs.idea || '자동' }}"

on:
  workflow_dispatch:
    inputs:
      idea:
        description: "키워드나 상황 (비우면 알아서)"
        required: false
        default: ""
      hook:
        description: "후렴 문장을 직접 정하려면 (비워도 됨)"
        required: false
        default: ""
      theme:
        description: "주제"
        type: choice
        options: [자동, 사랑, 어른, 아픔]
        default: 자동
      style:
        description: "곡 스타일 (예: 어쿠스틱, 남자 보컬, 밴드 사운드)"
        required: false
        default: ""
      req:
        description: "대시보드 요청 번호 (비워도 됨)"
        required: false
        default: ""
      vocal:
        description: "보컬"
        type: choice
        options: [자동, 여성, 남성, 듀엣]
        default: 자동
      title:
        description: "제목 (비우면 알아서)"
        required: false
        default: ""
      content:
        description: "노래에 담을 내용 (비워도 됨)"
        required: false
        default: ""
      genre:
        description: "장르 (자동, 발라드, 록발라드, 팝, R&B, 어쿠스틱, 포크, 밴드, 인디밴드, 락, 펑크, 메탈, 힙합, 댄스, 일렉트로닉, 시티팝, 재즈, 블루스, 레게, OST, 트로트, 국악, 캐럴, 동요, 자장가, 무가사, 뉴에이지, 로파이)"
        required: false
        default: "자동"
  schedule:
    # 매일 아침 8시(한국 시간)에 한 곡씩 준비해 둔다. 원하지 않으면 이 두 줄을 지우세요.
    - cron: "0 23 * * *"

permissions:
  contents: write

# 요청마다 따로 돈다 (같은 묶음에 넣으면 GitHub가 대기 중인 실행을 하나만 남기고 취소한다)
concurrency:
  group: new-song-${{ inputs.req || github.run_id }}
  cancel-in-progress: false

jobs:
  new:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      IDEA: ${{ inputs.idea }}
      HOOK: ${{ inputs.hook }}
      THEME: ${{ inputs.theme }}
      VOCAL: ${{ inputs.vocal }}
      STYLE: ${{ inputs.style }}
      REQ: ${{ inputs.req }}
      TITLE_IN: ${{ inputs.title }}
      CONTENT: ${{ inputs.content }}
      GENRE: ${{ inputs.genre || '자동' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install anthropic requests PyYAML Pillow numpy
      - name: 조사
        run: python -m mufac new --stage plan --idea "$IDEA" --hook "$HOOK" --theme "$THEME" --vocal "$VOCAL" --style "$STYLE" --req "$REQ" --title "$TITLE_IN" --content "$CONTENT" --genre "$GENRE"
      - name: 작사
        run: python -m mufac new --stage write
      - name: 검수 · 사진 · 멜로디
        id: song
        run: python -m mufac new --stage finish
      - name: 저장
        env:
          SLUG: ${{ steps.song.outputs.slug }}
          TITLE: ${{ steps.song.outputs.title }}
        run: |
          git config user.name "mufac"
          git config user.email "mufac@users.noreply.github.com"
          # 최신 main을 받은 뒤 비어 있는 번호에 넣는다. 다른 실행이 같은 번호를 먼저 쓰면 다음 번호로 밀린다
          mv "songs/$SLUG" "$RUNNER_TEMP/song"
          pushed=0
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            SLUG=$(python -m mufac place "$RUNNER_TEMP/song")
            git add "songs/$SLUG" && git commit -q -m "새 곡: $TITLE"
            if git push -q origin HEAD:main; then pushed=1; break; fi
            rm -rf "songs/$SLUG"; sleep $((i * 5))
          done
          [ "$pushed" = 1 ] || { echo "::error::저장 실패: push가 다섯 번 밀렸습니다"; exit 1; }
          echo "### [$TITLE](https://github.com/${{ github.repository }}/tree/main/songs/$SLUG)" >> "$GITHUB_STEP_SUMMARY"
