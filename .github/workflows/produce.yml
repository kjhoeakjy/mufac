name: 영상 만들기

on:
  push:
    branches: [main]
    paths:
      - "songs/**/*.mp3"
      - "songs/**/*.wav"
      - "songs/**/*.m4a"
      - "songs/**/*.flac"
  workflow_dispatch:
    inputs:
      slug:
        description: "곡 폴더 이름 (예: 261030-1)"
        required: true
      upload:
        description: "유튜브에 올리기"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: produce-${{ inputs.slug || github.sha }}
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: 어떤 곡인지 찾기
        id: pick
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          if [ -n "$SLUG" ]; then
            echo "slugs=$SLUG" >> "$GITHUB_OUTPUT"
          else
            slugs=$(git diff --name-only HEAD~1 HEAD -- songs | grep -iE '\.(mp3|wav|m4a|flac)$' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          fi
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ hashFiles('config.yaml') }}
          restore-keys: whisper-
      - name: 영상 만들고 올리기
        env:
          SLUGS: ${{ steps.pick.outputs.slugs }}
          UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          for s in $SLUGS; do
            if [ "$UPLOAD" = "true" ]; then python -m mufac produce "$s" --upload; else python -m mufac produce "$s"; fi
            mkdir -p dist/$s && cp songs/$s/out/main.mp4 songs/$s/out/short.mp4 songs/$s/out/thumb.jpg dist/$s/ 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: videos
          path: dist/
          retention-days: 30
      - name: 결과 저장
        env:
          SLUGS: ${{ steps.pick.outputs.slugs }}
        run: |
          git config user.name "mufac"
          git config user.email "mufac@users.noreply.github.com"
          for s in $SLUGS; do git add "songs/$s/song.yaml" "songs/$s/README.md" "songs/$s/timing.lrc" songs/$s/photo*.jpg 2>/dev/null || true; done
          git diff --cached --quiet || git commit -m "영상 완료: $SLUGS"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          for s in $SLUGS; do echo "### [$s](https://github.com/${{ github.repository }}/tree/main/songs/$s)" >> "$GITHUB_STEP_SUMMARY"; done
