name: 영상 만들기
run-name: "영상 만들기 ${{ inputs.slug || github.event.head_commit.message }}"

on:
  push:
    branches: [main]
    paths:
      - "songs/**/*.mp3"
      - "songs/**/*.wav"
      - "songs/**/*.m4a"
      - "songs/**/*.flac"
  workflow_dispatch:
    inputs:
      slug:
        description: "곡 폴더 이름 (예: 261030-1)"
        required: true

permissions:
  contents: write

concurrency:
  group: produce-${{ inputs.slug || github.sha }}
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: 어떤 곡인지 찾기
        id: pick
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          if [ -n "$SLUG" ]; then
            echo "slugs=$SLUG" >> "$GITHUB_OUTPUT"
          else
            # 새로 올라온 노래 파일만 (지운 파일, 원곡 멜로디 melody*/theme* 는 제외)
            slugs=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- songs | grep -iE '\.(mp3|wav|m4a|flac)$' | grep -vE '/(melody[^/]*|theme[^/]*)$' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          fi
      - uses: FedericoCarboni/setup-ffmpeg@v3  # apt보다 훨씬 빠르다(받아 둔 것을 재사용)
        with:
          ffmpeg-version: release
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ hashFiles('config.yaml') }}
          restore-keys: whisper-
      - name: 가사 위치 찾기
        env:
          SLUGS: ${{ steps.pick.outputs.slugs }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: for s in $SLUGS; do python -m mufac produce "$s" --stage align; done
      - name: 본편 영상
        env:
          SLUGS: ${{ steps.pick.outputs.slugs }}
        run: for s in $SLUGS; do python -m mufac produce "$s" --stage video; done
      - name: 쇼츠 영상
        env:
          SLUGS: ${{ steps.pick.outputs.slugs }}
        run: for s in $SLUGS; do python -m mufac produce "$s" --stage short; done
      - name: 영상 보관(Release)
        env:
          SLUGS: ${{ steps.pick.outputs.slugs }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for s in $SLUGS; do
            files="songs/$s/out/main.mp4 songs/$s/out/thumb.jpg"
            [ -f "songs/$s/out/short.mp4" ] && files="$files songs/$s/out/short.mp4"
            if gh release view "song-$s" >/dev/null 2>&1; then
              gh release upload "song-$s" $files --clobber
            else
              gh release create "song-$s" $files --title "$s" --notes "mufac 영상" --latest=false
            fi
          done
      - name: 결과 저장
        env:
          SLUGS: ${{ steps.pick.outputs.slugs }}
        run: |
          git config user.name "mufac"
          git config user.email "mufac@users.noreply.github.com"
          for s in $SLUGS; do git add "songs/$s/song.yaml" "songs/$s/README.md" "songs/$s/timing.lrc" songs/$s/photo*.jpg "songs/$s/cover.jpg" 2>/dev/null || true; done
          git diff --cached --quiet || git commit -m "영상 완료: $SLUGS"
          pushed=0
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin main && git push -q; then pushed=1; break; fi
            git rebase --abort 2>/dev/null || true; sleep $((i * 5))
          done
          [ "$pushed" = 1 ] || { echo "::error::저장 실패: push가 다섯 번 밀렸습니다"; exit 1; }
