name: 사진 다시 만들기

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "곡 폴더 이름 (예: 261030-1)"
        required: true
      prompt:
        description: "원하는 장면을 영어나 한국어로 (비우면 원래 장면으로 다시)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  photo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install anthropic requests PyYAML Pillow numpy
      - env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SLUG: ${{ inputs.slug }}
          PROMPT: ${{ inputs.prompt }}
        run: python -m mufac photo "$SLUG" --prompt "$PROMPT"
      - env:
          SLUG: ${{ inputs.slug }}
        run: |
          git config user.name "mufac"
          git config user.email "mufac@users.noreply.github.com"
          git add "songs/$SLUG"
          git diff --cached --quiet || git commit -m "사진 교체: $SLUG"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
