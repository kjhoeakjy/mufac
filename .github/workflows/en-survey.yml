name: 영어 가사 조사
run-name: "영어 가사 조사 ${{ inputs.probe && '(구조 확인)' || '' }}"

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "목록·가사·장르 출처가 읽히는지만 확인"
        type: boolean
        default: false
      top:
        description: "해마다 상위 몇 곡"
        required: false
        default: "100"

permissions:
  contents: write

concurrency:
  group: en-survey
  cancel-in-progress: false

jobs:
  probe:
    if: ${{ inputs.probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/en_survey.py --probe

  # 연대마다 따로 돌려 시간 한도 안에 끝낸다. 조각에는 곡별 통계만 들어 있다(가사 원문 없음).
  part:
    if: ${{ !inputs.probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        years: ["1990-1999", "2000-2009", "2010-2019", "2020-2025"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 조사
        env:
          YEARS: ${{ matrix.years }}
          TOP: ${{ inputs.top }}
        run: python tools/en_survey.py --years "$YEARS" --top "$TOP" --budget 150 --part "part-$YEARS.json"
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.years }}
          path: part-${{ matrix.years }}.json
          retention-days: 3

  merge:
    if: ${{ !inputs.probe && !cancelled() }}
    needs: part
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
          merge-multiple: true
      - name: 합치기
        run: python tools/en_survey.py --merge parts/*.json
      - name: 저장
        run: |
          git config user.name "mufac"
          git config user.email "mufac@users.noreply.github.com"
          git add assets/lyrics/_영어실측.json assets/lyrics/_영어실측.md
          git diff --cached --quiet || git commit -m "영어 히트곡 가사 실측"
          pushed=0
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin main && git push -q; then pushed=1; break; fi
            git rebase --abort 2>/dev/null || true; sleep $((i * 5))
          done
          [ "$pushed" = 1 ] || { echo "::error::저장 실패: push가 다섯 번 밀렸습니다"; exit 1; }
