# 클래식 원곡 카탈로그.
# 저작권 규칙(mufac/classical.py): 작곡가 사망 연도 <= 1955 (사후 70년) AND 작곡·출판 연도 <= 1930 (미국 기준).
# 둘 중 하나라도 비거나 어긋나면 목록에서 자동으로 빠진다.
# 선율은 assets/classical/midi/<id>.mid 가 있을 때만 쓴다(공개 악보 저장소에서 수집). 손으로 적은 선율은 hand: 로 지정.
# mutopia: Mutopia 검색어. collect 워크플로가 이걸로 MIDI를 찾는다.

pieces:

- id: canon
  name: 파헬벨 캐논
  composer: 요한 파헬벨
  died: 1706
  year: 1680
  hand: canon
  mutopia: Pachelbel Canon
  themes: [약속, 결혼, 변하지 않는 것, 반복되는 하루, 이별, 오래된 연인]
  story: |
    1680년 무렵 뉘른베르크의 오르가니스트 파헬벨이 쓴 곡. 두 마디 베이스가 스물여덟 번 반복되는 위에 세 성부가 같은 선율을 두 마디 간격으로 따라 들어온다.
    파헬벨은 1683년 흑사병으로 첫 아내와 갓난 아들을 한꺼번에 잃었다. 바흐의 형 요한 크리스토프의 결혼식(1694)을 위해 쓰였다는 설이 있으나 확실하지 않다.
    200년 넘게 잊혔다가 1968년 파야르 실내악단의 녹음으로 되살아났고, 지금은 세상에서 가장 많이 결혼식에서 연주되는 곡이 되었다. 장례식에서도 자주 쓰인다.

- id: bach_air
  name: G선상의 아리아
  composer: 요한 제바스티안 바흐
  died: 1750
  year: 1730
  mutopia: Bach Air BWV 1068
  themes: [고요, 기다림, 오래된 사랑, 하루의 끝, 위로]
  story: |
    1730년 무렵 라이프치히에서 쓴 관현악 모음곡 3번의 두 번째 곡. 바흐 생전에는 궁정 무도회 사이에 끼워 넣는 잔잔한 곡이었다.
    1871년 바이올리니스트 빌헬미가 바이올린의 가장 낮은 G선 한 줄만으로 연주할 수 있게 편곡하면서 "G선상의 아리아"라는 이름이 붙었다. 한 줄로만 내는 소리라 낮고 깊다.
    긴 음 하나가 조용히 버티고, 그 아래로 베이스가 한 걸음씩 걸어 내려간다. 서두르지 않는 사람의 음악.

- id: bach_prelude
  name: 바흐 전주곡 C장조
  composer: 요한 제바스티안 바흐
  died: 1750
  year: 1722
  hand: bach_prelude
  mutopia: Bach Prelude BWV 846
  themes: [아버지, 처음, 배움, 아침, 시작, 아이]
  story: |
    1722년 바흐가 쓴 「평균율 클라비어곡집」 1권의 첫 곡. 표지에 "배우고자 하는 음악 청년들의 쓰임과 이익을 위해"라고 적었다. 아들 빌헬름 프리데만을 가르치려고 만든 연습장에서 나온 곡이다.
    선율 없이 분산화음만 서른다섯 마디 이어진다. 1853년 구노가 이 위에 「아베 마리아」 선율을 얹었고, 그 뒤로 수많은 노래가 이 바탕 위에 쓰였다.
    아버지가 아이를 위해 쓴 첫 페이지. 무엇이든 시작하는 자리의 음악.

- id: jesu
  name: 예수, 인류 소망의 기쁨
  composer: 요한 제바스티안 바흐
  died: 1750
  year: 1723
  hand: jesu
  mutopia: Bach Jesu Joy BWV 147
  themes: [묵묵한 사랑, 일상, 가족, 버팀, 결혼, 부모]
  story: |
    1723년 라이프치히에서 쓴 칸타타 BWV 147의 마지막 합창. 바흐는 이해부터 매주 한 곡씩 예배용 칸타타를 써야 했다.
    바흐는 스무 명의 자녀 중 열 명을 어려서 잃었고, 1720년에는 여행에서 돌아와 보니 첫 아내 마리아 바르바라가 이미 세상을 떠나 묻혀 있었다. 이 곡은 그 뒤 재혼한 안나 막달레나와 새 가정을 꾸리던 시기의 음악이다.
    멈추지 않는 셋잇단음표 위에 찬송 선율이 길게 놓인다. 슬픔 위에서 계속되는 일상, 묵묵히 이어지는 사랑.

- id: bach_arioso
  name: 바흐 아리오소
  composer: 요한 제바스티안 바흐
  died: 1750
  year: 1729
  mutopia: Bach Arioso BWV 156
  themes: [병상, 받아들임, 평온, 끝과 시작, 위로]
  story: |
    1729년 칸타타 「나는 한 발을 무덤에 딛고 서 있네」(BWV 156)의 서곡. 제목처럼 죽음을 눈앞에 둔 사람이 그것을 조용히 받아들이는 내용의 칸타타다.
    바흐는 같은 선율을 뒤에 쳄발로 협주곡 5번의 느린 악장에 다시 썼다. 오보에가 길게 노래하고 현은 짧게 끊어 받친다.
    두려움 없이 끝을 바라보는 사람의 음악. 장례식보다 병실에서, 울음보다 미소에 가깝다.

- id: sheep
  name: 양들은 한가로이 풀을 뜯고
  composer: 요한 제바스티안 바흐
  died: 1750
  year: 1713
  mutopia: Bach Schafe können ruhig weiden
  themes: [평화, 보살핌, 어린 시절, 엄마, 안심, 오후]
  story: |
    1713년 바이마르 궁정의 사냥 칸타타(BWV 208)에 들어 있는 아리아. 가사는 "좋은 목자가 지키는 곳에서 양들은 한가로이 풀을 뜯는다"이다.
    두 대의 리코더가 흔들리듯 반주하고 소프라노가 느긋하게 노래한다. 바흐가 스물여덟 살, 첫 아이들이 태어나던 때의 곡이다.
    누군가 지켜 주고 있어서 아무 걱정 없이 쉬던 시간의 음악. 어린 날의 오후, 엄마가 있던 방.

- id: goldberg
  name: 골드베르크 변주곡 아리아
  composer: 요한 제바스티안 바흐
  died: 1750
  year: 1741
  mutopia: Bach Goldberg Aria
  themes: [잠 못 드는 밤, 돌아옴, 시작과 끝, 혼자, 위로]
  story: |
    1741년 출판. 전해지는 이야기로는 불면증에 시달리던 카이저링크 백작이 밤마다 연주할 곡을 부탁했고, 젊은 쳄발로 주자 골드베르크가 옆방에서 이 곡을 쳤다고 한다.
    느린 사라반드 선율의 아리아로 시작해 서른 개의 변주를 거친 뒤, 마지막에 처음의 아리아가 그대로 다시 돌아온다. 1955년 글렌 굴드의 녹음으로 세계에 알려졌고, 굴드는 죽기 한 해 전 이 곡을 다시 녹음했다.
    멀리 돌아 처음 자리로 돌아오는 음악. 잠 못 드는 사람 곁에 있어 주던 곡.

- id: cello_suite1
  name: 무반주 첼로 모음곡 1번 전주곡
  composer: 요한 제바스티안 바흐
  died: 1750
  year: 1720
  mutopia: Bach Cello Suite 1 Prelude
  themes: [혼자, 흐르는 시간, 아침, 길, 다짐]
  story: |
    1720년 무렵 쾨텐에서 쓴 곡. 첼로 한 대가 쉬지 않고 열여섯분음표를 이어 간다. 악보는 바흐의 두 번째 아내 안나 막달레나가 베껴 쓴 사본으로 전해진다.
    200년 가까이 연습곡 취급을 받다가, 열세 살의 파블로 카잘스가 바르셀로나의 헌책방에서 악보를 발견했다. 카잘스는 12년을 연습한 뒤에야 무대에서 연주했고 평생 매일 아침 이 곡으로 하루를 열었다.
    혼자 걷는 사람의 음악. 하루를 시작하는 다짐.

- id: lascia
  name: 울게 하소서
  composer: 게오르크 프리드리히 헨델
  died: 1759
  year: 1711
  mutopia: Handel Lascia ch'io pianga
  themes: [울음, 갇힘, 자유, 이별, 버팀]
  story: |
    1711년 오페라 「리날도」에서 포로가 된 알미레나가 부르는 아리아. 가사는 "나를 울게 내버려 두세요, 나의 가혹한 운명을"이다. 헨델이 스물여섯 살에 런던에서 처음 올린 오페라였다.
    선율은 그가 몇 해 전 다른 작품에서 썼던 사라반드 춤곡에서 가져왔다. 느린 세 박자가 한 걸음씩 가라앉는다.
    영화 「파리넬리」로 널리 알려졌다. 참지 않고 우는 것을 허락하는 노래.

- id: ombra
  name: 옴브라 마이 푸
  composer: 게오르크 프리드리히 헨델
  died: 1759
  year: 1738
  mutopia: Handel Ombra mai fu
  themes: [나무, 그늘, 고마움, 쉼, 오래된 것]
  story: |
    1738년 오페라 「세르세」의 첫 아리아. 페르시아 왕 세르세가 플라타너스 나무 그늘에 대고 부르는 노래로, 가사는 "이토록 사랑스럽고 다정한 그늘은 없었네"이다.
    사람이 아니라 나무에게 부르는 사랑 노래다. 오페라는 실패했고 이 곡만 남아 "헨델의 라르고"로 불리며 장례식과 예배에서 연주된다.
    늘 거기 있어 준 것에게 늦게 건네는 고마움의 음악.

- id: handel_sarabande
  name: 헨델 사라반드
  composer: 게오르크 프리드리히 헨델
  died: 1759
  year: 1733
  mutopia: Handel Sarabande HWV 437
  themes: [운명, 무게, 시간, 결심, 어른]
  story: |
    1733년 출판된 쳄발로 모음곡 D단조의 느린 춤곡. 같은 네 마디 화성이 변주되며 점점 무거워진다.
    1975년 영화 「배리 린든」에서 결투 장면과 처음과 끝에 쓰이면서 세계적으로 알려졌다.
    피할 수 없는 것을 향해 천천히 걸어가는 음악. 어른이 되어 짊어지게 된 무게.

- id: winter_largo
  name: 사계 겨울 2악장
  composer: 안토니오 비발디
  died: 1741
  year: 1725
  mutopia: Vivaldi Winter Largo
  themes: [겨울, 집, 창밖의 비, 따뜻함, 쉼]
  story: |
    1725년 출판된 「사계」 중 「겨울」의 느린 악장. 악보에 붙은 소네트에는 "밖에는 비가 쏟아지는데, 난롯가에서 조용하고 만족스러운 날을 보낸다"고 적혀 있다.
    현이 빗방울처럼 피치카토로 똑똑 떨어지고 그 위에서 바이올린이 길게 노래한다. 비발디는 베네치아의 고아원 피에타에서 여자아이들에게 음악을 가르치며 이 곡들을 썼다.
    추운 날 집 안에 있는 사람의 음악. 창밖은 겨울, 안은 따뜻하다.

- id: spring
  name: 사계 봄
  composer: 안토니오 비발디
  died: 1741
  year: 1725
  mutopia: Vivaldi Spring
  themes: [봄, 시작, 설렘, 아침, 새]
  story: |
    1725년 출판된 「사계」의 첫 곡. 소네트는 "봄이 왔다, 새들이 즐거운 노래로 봄을 맞는다"로 시작한다. 바이올린 세 대가 새소리를 흉내 낸다.
    비발디는 평생 붉은 머리 사제로 불렸고, 죽을 때는 빈에서 가난하게 잊힌 채 묻혔다. 「사계」는 20세기에 다시 발견되어 세상에서 가장 많이 연주되는 곡이 되었다.
    다시 시작하는 계절의 음악. 누구나 아는 첫 네 마디.

- id: mozart_k467
  name: 피아노 협주곡 21번 2악장
  composer: 볼프강 아마데우스 모차르트
  died: 1791
  year: 1785
  mutopia: Mozart Piano Concerto 21 Andante
  themes: [꿈, 떠오르는 얼굴, 첫사랑, 여름, 그리움]
  story: |
    1785년 빈에서 모차르트가 스물아홉 살에 쓴 곡. 아버지 레오폴트가 빈에 와서 아들의 연주회를 본 해였고, 아버지는 "눈물이 날 만큼 기뻤다"고 편지에 썼다.
    셋잇단음표 반주 위를 피아노가 떠다니듯 노래한다. 1967년 스웨덴 영화 「엘비라 마디간」에 쓰인 뒤 그 이름으로 불린다. 영화는 도망친 두 연인의 마지막 여름 이야기다.
    눈을 감으면 떠오르는 얼굴의 음악. 지나간 여름.

- id: clarinet_adagio
  name: 클라리넷 협주곡 2악장
  composer: 볼프강 아마데우스 모차르트
  died: 1791
  year: 1791
  mutopia: Mozart Clarinet Concerto Adagio
  themes: [작별, 친구, 마지막, 평온, 저녁]
  story: |
    1791년 10월, 모차르트가 죽기 두 달 전에 친구인 클라리넷 주자 안톤 슈타들러를 위해 쓴 마지막 협주곡. 슈타들러는 모차르트에게 돈을 자주 빌리고 갚지 않은 친구였지만, 모차르트는 끝까지 그를 위해 곡을 썼다.
    느린 악장은 클라리넷이 숨을 고르듯 길게 노래하고 오케스트라가 조용히 받는다.
    영화 「아웃 오브 아프리카」에서 아프리카 초원 위에 흘렀다. 떠나는 사람이 남기는 가장 조용한 인사.

- id: lacrimosa
  name: 레퀴엠 라크리모사
  composer: 볼프강 아마데우스 모차르트
  died: 1791
  year: 1791
  mutopia: Mozart Requiem Lacrimosa
  themes: [눈물, 마지막, 떠난 사람, 미완성, 남겨진 사람]
  story: |
    1791년 모차르트가 죽어 가며 쓰던 「레퀴엠」의 한 곡. 라크리모사는 여덟 마디까지만 모차르트의 손으로 쓰였고, 그는 그 자리에서 펜을 놓았다. 나머지는 제자 쥐스마이어가 채웠다.
    익명의 의뢰인이 주문한 곡이었고, 모차르트는 자기 자신의 장례 미사를 쓰고 있다고 믿었다. 가사는 "눈물의 그날"로 시작한다.
    끝내 마치지 못한 사람의 음악. 남겨진 사람들이 나머지를 채운다.

- id: ave_verum
  name: 아베 베룸 코르푸스
  composer: 볼프강 아마데우스 모차르트
  died: 1791
  year: 1791
  mutopia: Mozart Ave verum corpus
  themes: [고요, 감사, 여름, 아내, 마지막 여름]
  story: |
    1791년 6월, 모차르트가 죽기 반년 전에 쓴 46마디짜리 짧은 합창곡. 온천 마을 바덴에서 출산을 앞두고 요양하던 아내 콘스탄체를 돌봐 주던 합창 지휘자 슈톨에게 고마움으로 써 준 곡이다.
    화려한 것이 하나도 없다. 합창이 조용히 들어와 조용히 나간다.
    가진 게 없을 때 고마운 사람에게 건넨 선물. 모차르트의 마지막 여름.

- id: eine_kleine
  name: 아이네 클라이네 나흐트무지크
  composer: 볼프강 아마데우스 모차르트
  died: 1791
  year: 1787
  mutopia: Mozart Eine kleine Nachtmusik
  themes: [밤 나들이, 들뜸, 친구들, 주말, 가벼움]
  story: |
    1787년 8월 빈에서 쓴 세레나데. 제목은 "작은 밤의 음악"이라는 뜻으로 모차르트가 작품 목록에 직접 적은 이름이다. 누구를 위해 썼는지는 기록이 없다.
    같은 달 아버지 레오폴트가 세상을 떠난 직후였고, 모차르트는 오페라 「돈 조반니」를 쓰고 있었다. 그런 때에 이렇게 밝은 곡이 나왔다.
    들뜬 밤의 음악. 어둠 속에서도 걸음이 가벼운 사람.

- id: k545
  name: 피아노 소나타 16번
  composer: 볼프강 아마데우스 모차르트
  died: 1791
  year: 1788
  mutopia: Mozart Sonata K 545
  themes: [처음 배우던 날, 아이, 피아노 학원, 단순함, 어린 시절]
  story: |
    1788년 모차르트가 자신의 작품 목록에 "초보자를 위한 작은 소나타"라고 적어 넣은 곡. 그해 모차르트는 빚에 쫓기며 친구에게 돈을 빌리는 편지를 여러 통 썼다.
    쉬워 보이지만 연주자들은 가장 어려운 곡 중 하나로 꼽는다. 숨길 데가 없어서다.
    피아노 학원에서 누구나 한 번은 쳐 본 첫 소나타. 어린 날의 오후, 연습실의 음악.

- id: fur_elise
  name: 엘리제를 위하여
  composer: 루트비히 판 베토벤
  died: 1827
  year: 1810
  hand: fur_elise
  mutopia: Beethoven Für Elise
  themes: [짝사랑, 보내지 못한 편지, 거절, 닿지 않는 마음, 이름]
  story: |
    1810년 4월 27일 베토벤이 쓴 바가텔. 악보 첫머리의 "엘리제를 위하여"는 사실 "테레제를 위하여"를 잘못 읽은 것이라는 설이 유력하다. 테레제 말파티는 그해 베토벤이 청혼했다가 거절당한 제자다.
    베토벤은 이 무렵 이미 청력을 거의 잃어 가고 있었다. 악보는 그가 죽고 40년이 지난 1867년에야 발견되어 출판됐고, 정작 받을 사람은 끝내 듣지 못했다.
    닿지 못한 고백, 이름조차 잘못 전해진 마음의 노래.

- id: moonlight
  name: 월광 소나타
  composer: 루트비히 판 베토벤
  died: 1827
  year: 1801
  hand: moonlight
  mutopia: Beethoven Moonlight Sonata
  themes: [잠 못 드는 밤, 비밀, 이룰 수 없는 사랑, 상실, 어둠, 달]
  story: |
    1801년 베토벤이 쓴 피아노 소나타 14번 「환상곡풍 소나타」. 제자였던 열일곱 살 줄리에타 귀차르디 백작 영애에게 헌정했다. 베토벤은 그녀를 사랑했으나 신분 차이로 결혼은 이뤄지지 않았다.
    같은 해 베토벤은 친구 베겔러에게 처음으로 귀가 안 들린다는 사실을 편지로 고백했다. 1악장은 느린 셋잇단음표가 처음부터 끝까지 멈추지 않는다.
    "월광"이라는 이름은 베토벤이 죽은 뒤 1832년 평론가 렐슈타프가 루체른 호수의 달빛 같다고 쓴 데서 왔다. 말하지 못한 것을 품고 잠들지 못하는 밤의 음악.

- id: ode_to_joy
  name: 환희의 송가
  composer: 루트비히 판 베토벤
  died: 1827
  year: 1824
  hand: ode_to_joy
  mutopia: Beethoven Ode to Joy
  themes: [함께, 다시 일어섬, 위로, 형제, 새해, 희망]
  story: |
    1824년 교향곡 9번 마지막 악장. 가사는 실러가 1785년에 쓴 시 「환희에 부쳐」로, "모든 사람은 형제가 되리라"는 구절이 중심이다. 베토벤은 20대부터 이 시를 곡으로 만들고 싶어 했고 30년 만에 완성했다.
    초연 때 베토벤은 완전히 귀가 먹은 상태였다. 연주가 끝나고도 박수를 듣지 못해 등을 돌리고 서 있었고, 알토 가수가 그를 돌려세워 환호하는 청중을 보게 했다.
    들리지 않는 사람이 쓴, 함께 부르자는 노래. 베를린 장벽이 무너진 1989년 성탄절에 "환희" 대신 "자유"로 바꿔 불렸다.

- id: pathetique2
  name: 비창 소나타 2악장
  composer: 루트비히 판 베토벤
  died: 1827
  year: 1798
  mutopia: Beethoven Pathetique Adagio
  themes: [위로, 품, 다정함, 괜찮다는 말, 저녁]
  story: |
    1798년 스물일곱 살의 베토벤이 쓴 소나타 8번의 느린 악장. 격렬한 1악장 뒤에 오는 이 악장은 누군가의 어깨를 토닥이듯 시작한다. 제목 "비창"은 베토벤 자신이 붙인 드문 경우다.
    이 무렵 그는 귀에 이상을 느끼기 시작했지만 아직 아무에게도 말하지 않았다.
    빌리 조엘의 「This Night」가 이 선율로 후렴을 만들었다. 힘든 날 끝에 듣는 괜찮다는 말.

- id: symphony7_2
  name: 교향곡 7번 2악장
  composer: 루트비히 판 베토벤
  died: 1827
  year: 1812
  mutopia: Beethoven Symphony 7 Allegretto
  themes: [행렬, 함께 걷기, 버팀, 무게, 떠나보냄]
  story: |
    1812년 완성, 1813년 부상병을 위한 자선 연주회에서 초연됐다. 나폴레옹 전쟁의 한가운데였고 청중은 이 악장을 그 자리에서 다시 연주하게 했다.
    같은 리듬(길게 짧게 짧게 길게 길게)이 처음부터 끝까지 반복된다. 느리게 걷는 행렬 같다.
    영화 「킹스 스피치」에서 말을 더듬는 왕이 전쟁 연설을 마치는 장면에 흘렀다. 무거운 것을 지고 함께 걷는 사람들의 음악.

- id: ave_maria_schubert
  name: 슈베르트 아베 마리아
  composer: 프란츠 슈베르트
  died: 1828
  year: 1825
  mutopia: Schubert Ave Maria
  themes: [엄마, 기도, 밤, 지켜 주는 사람, 두려움]
  story: |
    1825년 슈베르트가 월터 스콧의 서사시 「호수의 여인」에 붙인 노래 「엘렌의 노래 3번」. 쫓기는 아버지와 함께 동굴에 숨은 소녀 엘렌이 성모에게 "저희를 지켜 주소서" 하고 부르는 기도다. 교회 음악이 아니라 딸의 노래였다.
    슈베르트는 이 곡으로 처음 출판 수입다운 돈을 벌었고, 아버지에게 쓴 편지에 "사람들이 내 경건함에 놀란다"고 썼다. 그는 3년 뒤 서른한 살에 죽었다.
    두려운 밤에 어머니 같은 존재에게 부르는 노래.

- id: serenade_schubert
  name: 슈베르트 세레나데
  composer: 프란츠 슈베르트
  died: 1828
  year: 1828
  mutopia: Schubert Ständchen Schwanengesang
  themes: [밤의 고백, 창문 아래, 짝사랑, 마지막 해, 그리움]
  story: |
    1828년 슈베르트가 죽기 몇 달 전에 쓴 노래. 「백조의 노래」라는 제목의 유작집에 실렸다. 가사는 "내 노래가 밤을 지나 조용히 그대에게 간다"로 시작하는, 창문 아래서 부르는 사랑 노래다.
    기타를 흉내 낸 피아노 반주 위로 선율이 단조와 장조 사이를 오간다. 슈베르트는 평생 자기 집도 피아노도 없이 친구들 집을 옮겨 다니며 살았고, 이 노래를 쓸 때 이미 병이 깊었다.
    닿을지 모르는 사람에게 밤에 보내는 노래.

- id: trout
  name: 송어
  composer: 프란츠 슈베르트
  died: 1828
  year: 1817
  mutopia: Schubert Die Forelle
  themes: [여름, 물가, 젊음, 가벼움, 친구들과의 여행]
  story: |
    1817년 스무 살의 슈베르트가 쓴 노래. 맑은 개울에서 헤엄치는 송어를 바라보는 가사로, 피아노가 물결처럼 반주한다.
    2년 뒤 친구들과 오스트리아 북부 슈타이어로 여름 여행을 갔을 때, 그곳 후원자의 부탁으로 이 선율을 변주한 피아노 오중주 「송어」를 썼다. 슈베르트의 짧은 생에서 가장 행복했던 여름으로 꼽힌다.
    물가의 여름, 아무 걱정 없던 젊은 날의 음악.

- id: impromptu_gb
  name: 즉흥곡 Op.90-3
  composer: 프란츠 슈베르트
  died: 1828
  year: 1827
  mutopia: Schubert Impromptu Op 90 No 3
  themes: [흐르는 물, 평온, 혼자 걷는 길, 받아들임, 저녁]
  story: |
    1827년 슈베르트가 죽기 한 해 전에 쓴 네 곡의 즉흥곡 중 세 번째. 왼손이 물결처럼 쉬지 않고 흐르고 오른손이 그 위에서 길게 노래한다.
    출판사는 조표가 어렵다며 내지 않았고, 슈베르트가 죽은 지 30년이 지나서야 조를 바꿔 출판됐다. 그는 이 곡이 연주되는 것을 듣지 못했다.
    흐르는 물을 보며 혼자 서 있는 사람의 음악.

- id: lindenbaum
  name: 보리수
  composer: 프란츠 슈베르트
  died: 1828
  year: 1827
  mutopia: Schubert Der Lindenbaum
  themes: [고향, 어린 시절의 나무, 떠남, 돌아가고 싶은 곳, 겨울]
  story: |
    1827년 연가곡 「겨울 나그네」의 다섯 번째 노래. 실연한 젊은이가 겨울밤 마을을 떠나며, 어릴 때부터 그늘에서 꿈을 꾸던 성문 앞 우물가 보리수를 지나친다. 나뭇가지가 "이리 와, 여기서 쉬어"라고 속삭이지만 그는 돌아보지 않고 걷는다.
    슈베르트는 이 곡들을 친구들 앞에서 처음 불렀고, 친구들은 너무 어둡다고 했다. 그는 "나는 이 노래들이 다른 어떤 것보다 좋다"고 답했다.
    독일에서는 민요처럼 불린다. 떠나온 곳의 나무 한 그루.

- id: wedding_march
  name: 멘델스존 결혼행진곡
  composer: 펠릭스 멘델스존
  died: 1847
  year: 1842
  mutopia: Mendelssohn Wedding March
  themes: [결혼, 시작, 축하, 행진, 새 가족]
  story: |
    1842년 셰익스피어의 「한여름 밤의 꿈」 극음악으로 쓴 곡. 멘델스존은 열일곱 살에 이 희곡의 서곡을 썼고, 16년 뒤 프로이센 왕의 의뢰로 나머지 음악을 완성했다.
    1858년 빅토리아 여왕의 장녀가 결혼식 퇴장곡으로 쓰면서 세계의 결혼식 음악이 되었다.
    멘델스존은 누나 파니와 평생 음악을 나눈 사이였고, 파니가 갑자기 죽은 지 반년 뒤 서른여덟 살에 뒤따라 죽었다. 문이 열리고 함께 걸어 나가는 음악.

- id: spring_song
  name: 봄노래
  composer: 펠릭스 멘델스존
  died: 1847
  year: 1844
  mutopia: Mendelssohn Spring Song
  themes: [봄, 설렘, 산책, 가벼운 마음, 햇빛]
  story: |
    1844년 출판된 「무언가(말 없는 노래)」 5권의 마지막 곡. 멘델스존은 가사 없이 노래하는 피아노 소품을 평생 마흔여덟 곡 썼고, "말로 하면 오히려 뜻이 좁아진다"고 했다.
    영국에서 「봄노래」라는 별명이 붙었다. 꾸밈음이 꽃잎처럼 흩어진다.
    가사가 없는 노래라는 뜻의 곡집에서 가장 유명한 곡. 봄날 걷는 사람의 발걸음.

- id: nocturne_op9_2
  name: 녹턴 Op.9-2
  composer: 프레데리크 쇼팽
  died: 1849
  year: 1832
  mutopia: Chopin Nocturne Op 9 No 2
  themes: [밤, 고향, 타향, 그리움, 혼자 있는 저녁]
  story: |
    1830년에서 1832년 사이, 스무 살의 쇼팽이 폴란드를 떠나 파리에 막 도착했을 때 쓴 곡. 떠난 직후 바르샤바에서 봉기가 일어났고 실패했다. 그는 평생 고향에 돌아가지 못했다.
    피아노 스승이던 마리 플레옐에게 헌정했다. 같은 선율이 돌아올 때마다 꾸밈이 더 많아진다.
    쇼팽이 죽은 뒤 누이가 그의 심장을 몰래 바르샤바로 가져갔다. 돌아가지 못한 사람의 밤 음악.

- id: raindrop
  name: 빗방울 전주곡
  composer: 프레데리크 쇼팽
  died: 1849
  year: 1839
  mutopia: Chopin Prelude Op 28 No 15
  themes: [비, 기다림, 불안, 돌아오는 사람, 창가]
  story: |
    1838년 겨울 쇼팽이 조르주 상드와 마요르카 섬의 버려진 수도원에 머물 때 쓴 곡. 상드가 아이들과 폭풍우 속에 나갔다 늦게 돌아온 날, 쇼팽은 피아노 앞에서 울며 이 곡을 치고 있었다고 상드는 썼다.
    같은 음 하나가 처음부터 끝까지 빗방울처럼 떨어진다. 쇼팽은 "빗방울을 흉내 낸 게 아니다"라며 그 이야기를 싫어했다.
    비 오는 날 누군가를 기다리는 사람의 음악.

- id: prelude_e_minor
  name: 전주곡 Op.28-4
  composer: 프레데리크 쇼팽
  died: 1849
  year: 1839
  mutopia: Chopin Prelude Op 28 No 4
  themes: [상실, 가라앉음, 떠난 사람, 장례, 숨]
  story: |
    1839년 출판된 스물네 개 전주곡 중 네 번째. 오른손은 거의 한 음을 되풀이하고 왼손 화음이 반음씩 가라앉는다. 두 페이지가 채 안 된다.
    쇼팽의 유언에 따라 1849년 파리 마들렌 성당에서 열린 그의 장례식에서 연주됐다.
    숨이 조금씩 빠져나가는 음악. 가장 짧고 가장 무거운 곡.

- id: tristesse
  name: 이별의 곡
  composer: 프레데리크 쇼팽
  died: 1849
  year: 1833
  mutopia: Chopin Etude Op 10 No 3
  themes: [이별, 고향, 첫사랑, 되돌릴 수 없는 것]
  story: |
    1832년 파리에서 쓴 연습곡 Op.10의 세 번째 곡. 제자 구트만의 기록에 따르면 쇼팽은 이 곡을 연주하다 "아, 나의 조국"이라고 외쳤다고 한다.
    쇼팽 자신도 "이보다 아름다운 선율은 다시 쓰지 못할 것"이라고 말했다고 전해진다. 20세기에 가사가 붙어 「이별의 곡」으로 불렸다.
    두고 온 것들의 음악. 첫사랑과 고향은 같은 자리에 있다.

- id: waltz_op64_2
  name: 왈츠 Op.64-2
  composer: 프레데리크 쇼팽
  died: 1849
  year: 1847
  mutopia: Chopin Waltz Op 64 No 2
  themes: [회전, 지난 사랑, 가을, 끝나 가는 것, 우아함]
  story: |
    1847년 쇼팽이 죽기 두 해 전에 쓴 왈츠. 그해 9년을 함께한 조르주 상드와 헤어졌고 건강은 급격히 나빠졌다.
    느린 주제와 빠르게 도는 부분이 번갈아 나온다. 춤곡이지만 춤추기 위한 곡은 아니다.
    끝나 가는 것을 알면서 한 번 더 도는 사람의 음악.

- id: fantaisie_impromptu
  name: 즉흥 환상곡
  composer: 프레데리크 쇼팽
  died: 1849
  year: 1834
  mutopia: Chopin Fantaisie Impromptu
  themes: [숨겨 둔 것, 무지개 너머, 꿈, 서랍 속 편지]
  story: |
    1834년 쇼팽이 스물네 살에 쓴 곡. 생전에 출판하지 않았고 태워 달라고 유언했지만 친구 폰타나가 1855년에 출판했다. 중간의 느린 선율은 1917년 미국 노래 「I'm Always Chasing Rainbows」가 되었다.
    왜 숨겼는지는 아무도 모른다. 베토벤의 월광 3악장과 닮아서라는 설이 있다.
    서랍에 넣어 두고 아무에게도 보이지 않은 것. 그런데 가장 많이 사랑받은 것.

- id: mazurka_op17_4
  name: 마주르카 Op.17-4
  composer: 프레데리크 쇼팽
  died: 1849
  year: 1834
  mutopia: Chopin Mazurka Op 17 No 4
  themes: [고향 마을, 시골 춤, 잃어버린 것, 어릴 때 살던 동네]
  story: |
    1833년 출판. 쇼팽은 폴란드 시골 춤곡인 마주르카를 평생 쉰 곡 넘게 썼다. 파리에서 살면서도 고향 마을의 리듬을 놓지 않았다.
    이 곡은 어둡고 느리며 끝이 시작으로 돌아간다. 쇼팽이 젊을 때 친구들이 "작은 유대인"이라 부르던 선율이라는 기록이 있다.
    어릴 때 살던 동네의 음악. 돌아가면 아무것도 그대로 있지 않은 곳.

- id: traumerei
  name: 트로이메라이
  composer: 로베르트 슈만
  died: 1856
  year: 1838
  mutopia: Schumann Träumerei
  themes: [어린 시절, 꿈, 돌아보는 어른, 부모가 된 사람]
  story: |
    1838년 「어린이 정경」 열세 곡 중 일곱 번째. 슈만은 약혼녀 클라라에게 "당신이 나를 가끔 어린애 같다고 해서 어린 시절을 돌아보며 서른 곡을 썼다"고 편지했다. 아이를 위한 곡이 아니라 어른이 어린 날을 돌아보는 곡이다.
    클라라의 아버지는 결혼을 반대해 재판까지 갔고, 두 사람은 1840년에야 결혼했다. 호로비츠는 60년 만에 모스크바로 돌아간 연주회의 앙코르로 이 곡을 쳤다.
    돌아갈 수 없는 시절을 꿈처럼 바라보는 음악.

- id: widmung
  name: 헌정
  composer: 로베르트 슈만
  died: 1856
  year: 1840
  mutopia: Schumann Widmung
  themes: [고백, 결혼, 당신 덕분에, 감사, 사랑]
  story: |
    1840년 슈만이 클라라와의 결혼식 전날 선물한 가곡집 「미르테의 꽃」의 첫 곡. 가사는 뤼케르트의 시로 "당신은 나의 영혼, 나의 심장, 당신은 나의 더 나은 나"라고 노래한다.
    4년의 반대와 소송 끝에 얻은 결혼이었다. 슈만은 그해에만 가곡을 백 곡 넘게 썼다.
    리스트가 피아노곡으로 편곡해 더 유명해졌다. 누군가 덕분에 더 나은 사람이 된 이의 노래.

- id: clara_romance
  name: 클라라 슈만 로망스 Op.11-1
  composer: 클라라 슈만
  died: 1896
  year: 1839
  mutopia: Clara Schumann Romance
  themes: [기다림, 떨어져 있는 연인, 편지, 여성, 밤]
  story: |
    1839년 스무 살의 클라라 비크가 파리에서 쓴 곡. 아버지의 반대로 약혼자 로베르트 슈만과 떨어져 혼자 연주 여행을 다니던 때였다. 로베르트에게 헌정했고, 그는 "우리 둘이 아니면 아무도 이 곡을 모를 것"이라고 답했다.
    클라라는 결혼 뒤 여덟 아이를 낳고 남편이 정신병원에 들어간 뒤 40년을 연주로 가족을 먹여 살렸다. 작곡은 거의 그만두었다.
    떨어져 있는 사람에게 밤에 쓴 편지 같은 음악.

- id: liebestraum
  name: 사랑의 꿈
  composer: 프란츠 리스트
  died: 1886
  year: 1850
  mutopia: Liszt Liebestraum 3
  themes: [사랑할 수 있을 때, 부모님, 후회하기 전에, 무덤가, 지금]
  story: |
    1850년 출판된 세 곡의 「사랑의 꿈」 중 세 번째. 원래는 프라일리그라트의 시에 붙인 노래였다. 시는 "오 사랑하라, 사랑할 수 있는 한. 무덤가에 서서 울게 될 때가 온다"로 시작한다.
    연인에게 하는 말이 아니라, 곁에 있는 사람에게 지금 다정하라는 시다. 리스트는 이 무렵 바이마르에 정착해 연주 생활을 접고 작곡에 몰두했다.
    아직 곁에 있을 때 사랑하라는 음악.

- id: consolation3
  name: 위안 3번
  composer: 프란츠 리스트
  died: 1886
  year: 1850
  mutopia: Liszt Consolation 3
  themes: [위로, 조용한 밤, 괜찮아, 쓰다듬음]
  story: |
    1850년 출판된 여섯 곡의 「위안」 중 세 번째. 제목은 생트뵈브의 시집 「위안」에서 가져왔다. 쇼팽이 죽은 이듬해였고, 쇼팽의 녹턴과 같은 조성으로 썼다.
    화려한 리스트가 아니라 가장 조용한 리스트다. 왼손이 느리게 흔들리고 오른손이 한 음씩 놓인다.
    말없이 등을 쓰다듬는 음악.

- id: brahms_lullaby
  name: 브람스 자장가
  composer: 요하네스 브람스
  died: 1897
  year: 1868
  hand: brahms_lullaby
  mutopia: Brahms Wiegenlied
  themes: [엄마, 아기, 어린 시절, 재워 주던 사람, 오래된 마음, 밤]
  story: |
    1868년 브람스가 쓴 「자장가」 Op.49-4. 함부르크 시절 합창단원이던 베르타 포루프스키가 둘째 아들을 낳자 선물로 보냈다. 젊은 날 브람스는 베르타를 좋아했고, 그때 베르타가 그에게 불러 주던 빈의 옛 노래 선율을 이 곡의 반주 속에 숨겨 두었다.
    브람스는 "베르타가 아기에게 이 노래를 부르는 동안, 누군가 그녀에게 사랑 노래를 부르고 있는 셈"이라고 편지에 썼다. 그는 평생 결혼하지 않았다.
    나를 재워 주던 사람에게, 이제 내가 부르는 노래.

- id: intermezzo_118_2
  name: 인터메초 Op.118-2
  composer: 요하네스 브람스
  died: 1897
  year: 1893
  mutopia: Brahms Intermezzo Op 118 No 2
  themes: [늙음, 평생의 사랑, 말하지 않은 것, 가을, 오래된 친구]
  story: |
    1893년 예순 살의 브람스가 쓴 마지막 피아노 소품들 중 하나. 클라라 슈만에게 헌정했다. 두 사람은 40년 넘게 편지를 주고받았고 서로에게 어떤 사이였는지 끝내 말하지 않았다.
    브람스는 이 곡들을 "내 고통의 자장가"라고 불렀다. 클라라는 3년 뒤 죽었고 브람스는 장례식에 늦게 도착해 이듬해 뒤따랐다.
    평생 말하지 않은 것을 음으로만 남긴 사람의 음악.

- id: brahms_waltz15
  name: 왈츠 Op.39-15
  composer: 요하네스 브람스
  died: 1897
  year: 1865
  mutopia: Brahms Waltz Op 39 No 15
  themes: [다정함, 함께 추는 춤, 오후, 소박한 행복, 빈]
  story: |
    1865년 빈에 정착한 브람스가 네 손을 위해 쓴 열여섯 개 왈츠 중 열다섯 번째. 평론가 한슬리크에게 헌정했는데, 한슬리크는 "진지한 브람스가 왈츠를 쓰다니"라고 놀랐다.
    두 사람이 한 피아노에 나란히 앉아 치는 곡이다. 짧고 단순하다.
    누군가와 나란히 앉아 보내는 오후의 음악.

- id: swan
  name: 백조
  composer: 카미유 생상스
  died: 1921
  year: 1886
  mutopia: Saint-Saëns The Swan
  themes: [우아함, 고요한 물, 떠나보냄, 마지막 춤, 품위]
  story: |
    1886년 「동물의 사육제」 열네 곡 중 열세 번째. 생상스는 이 곡집을 친구들끼리 웃자고 쓴 농담으로 여겨 생전에 출판을 금지했다. 「백조」만 예외로 허락했다.
    1905년 안무가 포킨이 안나 파블로바를 위해 「빈사의 백조」를 만들었고, 파블로바는 평생 4천 번 이 춤을 추었다. 죽기 전 마지막 말은 "내 백조 의상을 준비해 줘"였다고 전해진다.
    물 위에서는 고요하고 물 아래서는 쉬지 않는 발. 품위를 지키며 떠나는 사람의 음악.

- id: habanera
  name: 하바네라
  composer: 조르주 비제
  died: 1875
  year: 1875
  mutopia: Bizet Habanera Carmen
  themes: [자유로운 사랑, 붙잡히지 않는 사람, 도발, 여름밤]
  story: |
    1875년 오페라 「카르멘」에서 카르멘이 처음 부르는 노래. 가사는 "사랑은 길들지 않는 새"로 시작한다. 비제는 스페인 작곡가 이라디에르의 노래를 민요인 줄 알고 가져다 썼고, 나중에 알고 출처를 적어 넣었다.
    초연은 혹평을 받았고 비제는 석 달 뒤 서른여섯 살에 죽었다. 「카르멘」이 세계에서 가장 많이 공연되는 오페라가 된 것을 보지 못했다.
    붙잡으려 하면 달아나는 사람의 노래.

- id: gounod_ave_maria
  name: 구노 아베 마리아
  composer: 샤를 구노
  died: 1893
  year: 1853
  mutopia: Gounod Ave Maria
  themes: [기도, 엄마, 결혼식, 보호, 두 사람이 만든 것]
  story: |
    1853년 구노가 바흐의 전주곡 C장조 위에 즉흥으로 선율을 얹은 곡. 처음에는 가사 없이 「바흐의 전주곡에 붙인 명상곡」으로 출판했고, 1859년 성모송 가사를 붙였다.
    130년 차이 나는 두 사람이 함께 쓴 셈이다. 바흐는 바탕을, 구노는 노래를 냈다.
    결혼식과 장례식에서 가장 많이 불리는 아베 마리아. 누군가의 바탕 위에 올린 기도.

- id: barcarolle
  name: 호프만의 뱃노래
  composer: 자크 오펜바흐
  died: 1880
  year: 1880
  mutopia: Offenbach Barcarolle
  themes: [밤의 물결, 베네치아, 흔들림, 아름다운 밤, 사랑의 밤]
  story: |
    오페라 「호프만 이야기」의 베네치아 장면에서 두 여성이 부르는 이중창. 가사는 "아름다운 밤, 사랑의 밤이여"다. 오펜바흐는 1880년 이 오페라를 완성하지 못하고 죽었고, 초연은 이듬해 열렸다.
    평생 가벼운 희가극 백 편으로 파리를 웃기던 사람이 마지막에 남긴 진지한 작품이다. 선율은 그가 16년 전에 쓴 오페라에서 가져왔다.
    물 위에서 흔들리는 밤의 음악. 영화 「인생은 아름다워」에서 수용소의 확성기로 아내에게 들려준 곡.

- id: meditation
  name: 타이스의 명상곡
  composer: 쥘 마스네
  died: 1912
  year: 1894
  mutopia: Massenet Meditation Thais
  themes: [돌아섬, 마음이 바뀌는 밤, 후회, 새 삶, 고요]
  story: |
    1894년 오페라 「타이스」의 막간음악. 화려하게 살던 타이스가 밤새 생각한 끝에 삶을 바꾸기로 하는 사이에 바이올린이 혼자 연주한다. 무대 위에는 아무도 없다.
    마스네는 이 곡을 가수 시빌 샌더슨을 위해 썼고, 그녀와의 관계는 파리에서 소문이 났다.
    마음이 바뀌는 밤의 음악. 말없이 돌아서는 사람.

- id: flower_duet
  name: 꽃의 이중창
  composer: 레오 들리브
  died: 1891
  year: 1883
  mutopia: Delibes Flower Duet Lakmé
  themes: [두 사람, 강가, 꽃, 친구, 함께 걷기]
  story: |
    1883년 오페라 「라크메」에서 라크메와 하녀 말리카가 강가에서 꽃을 따며 부르는 이중창. 두 목소리가 3도 간격으로 나란히 간다.
    1989년 영국항공 광고에 쓰이면서 세계에서 가장 많이 들린 오페라 선율이 되었다.
    둘이 나란히 가는 음악. 같은 길을 같은 걸음으로.

- id: pavane_faure
  name: 포레 파반
  composer: 가브리엘 포레
  died: 1924
  year: 1887
  mutopia: Fauré Pavane
  themes: [우아한 거리, 가을 정원, 지나간 사랑, 느린 춤]
  story: |
    1887년 포레가 쓴 느린 춤곡. 후원자 그레퓔 백작부인에게 헌정했고, 그녀의 요청으로 합창 가사를 붙였는데 가사는 서로 밀고 당기는 연인들의 가벼운 대화다.
    포레는 이 곡을 "우아하지만 특별할 것은 없다"고 했다. 플루트가 먼저 노래하고 현이 받는다.
    가을 정원에서 느리게 걷는 사람의 음악.

- id: apres_un_reve
  name: 꿈꾸고 난 뒤에
  composer: 가브리엘 포레
  died: 1924
  year: 1878
  mutopia: Fauré Après un rêve
  themes: [꿈에서 본 사람, 깨어난 아침, 그리움, 돌아와 달라는 말]
  story: |
    1878년 포레가 서른세 살에 쓴 가곡. 가사는 꿈속에서 떠난 사람을 만나 함께 빛을 향해 떠났는데, 깨어 보니 혼자라는 내용이다. "돌아와 줘, 빛나는 밤이여"로 끝난다.
    이 무렵 포레는 약혼이 깨진 직후였다.
    첼로곡으로 더 자주 연주된다. 꿈에서 본 사람을 아침에 그리워하는 음악.

- id: clair_de_lune
  name: 달빛
  composer: 클로드 드뷔시
  died: 1918
  year: 1905
  mutopia: Debussy Clair de lune
  themes: [달밤, 조용한 기쁨과 슬픔, 혼자 걷는 밤, 아름다움]
  story: |
    1890년 스물여덟 살에 쓰기 시작해 1905년 출판한 「베르가마스크 모음곡」의 세 번째 곡. 제목은 베를렌의 시에서 가져왔다. 시는 가면을 쓰고 춤추는 사람들이 "슬픈 달빛 아래서 자신들의 행복을 믿지 못하는 듯 단조로 노래한다"고 쓴다.
    드뷔시는 15년을 묵혀 두고 고친 뒤에야 내놓았다.
    기쁜지 슬픈지 모를 밤의 음악. 혼자 걷는 달밤.

- id: reverie
  name: 꿈
  composer: 클로드 드뷔시
  died: 1918
  year: 1890
  mutopia: Debussy Rêverie
  themes: [몽상, 오후의 졸음, 어린 시절, 떠다니는 생각]
  story: |
    1890년 드뷔시가 돈이 필요해 급히 써서 판 곡. 뒤에 출판사가 다시 내려 하자 "서둘러 쓴 보잘것없는 곡"이라며 말렸지만 가장 사랑받는 곡이 되었다.
    선율이 어디로 가는지 모른 채 떠다닌다. 1938년 미국에서 가사가 붙어 유행가가 되었다.
    오후에 창가에서 멍하니 있는 시간의 음악.

- id: arabesque1
  name: 아라베스크 1번
  composer: 클로드 드뷔시
  died: 1918
  year: 1891
  mutopia: Debussy Arabesque 1
  themes: [흐르는 물, 가벼움, 봄비, 산책, 시작]
  story: |
    1891년 출판된 두 곡의 아라베스크 중 첫 곡. 아라베스크는 덩굴무늬라는 뜻으로, 셋잇단음표와 여덟분음표가 엇갈리며 무늬를 그린다.
    드뷔시가 아직 유명해지기 전, 파리의 작은 방에서 쓴 곡이다.
    물이 돌 사이를 돌아 흐르듯 가벼운 음악. 봄비 오는 길.

- id: girl_flaxen_hair
  name: 아마빛 머리의 소녀
  composer: 클로드 드뷔시
  died: 1918
  year: 1910
  mutopia: Debussy La fille aux cheveux de lin
  themes: [첫사랑, 여름 아침, 소박함, 멀리서 본 사람]
  story: |
    1910년 전주곡집 1권의 여덟 번째 곡. 제목은 르콩트 드 릴의 시에서 왔다. 시는 여름 아침 자주개자리 꽃밭에 앉아 노래하는 소녀를 멀리서 바라본다.
    드뷔시는 제목을 곡 끝에 괄호로 작게 적었다. 먼저 듣고 나중에 알라는 뜻이었다. 두 페이지, 2분 반.
    여름 아침에 멀리서 본 사람의 음악.

- id: gymnopedie
  name: 짐노페디 1번
  composer: 에릭 사티
  died: 1925
  year: 1888
  hand: gymnopedie
  mutopia: Satie Gymnopédie 1
  themes: [혼자 사는 방, 외로움, 비 오는 날, 일요일, 멈춘 시간, 청춘]
  story: |
    1888년 스물두 살의 사티가 몽마르트르에서 쓴 곡. 당시 그는 카바레 '검은 고양이'에서 피아노를 치며 옷장만 한 방에서 살았다. 악보에는 "느리고 고통스럽게"라고 적혀 있다.
    사티는 평생 혼자 살았고 죽은 뒤 방에서 한 번도 보내지 않은 편지들과 똑같은 회색 양복 여러 벌이 나왔다.
    외로움을 울지 않고 견디는 사람의 음악. 비 오는 오후, 혼자 있는 방.

- id: gnossienne1
  name: 그노시엔 1번
  composer: 에릭 사티
  died: 1925
  year: 1890
  mutopia: Satie Gnossienne 1
  themes: [새벽, 낯선 거리, 혼잣말, 이상한 밤, 걷기]
  story: |
    1890년 사티가 만든 말인 "그노시엔"이라는 제목의 곡. 마디선 없이 썼고 악보에는 "혀끝으로", "스스로에게 물어보듯" 같은 지시가 적혀 있다.
    1889년 파리 만국박람회에서 들은 루마니아 민속 음악의 영향이 있다고 한다. 왼손은 같은 화음을 되풀이하고 오른손은 꾸밈음을 흘린다.
    새벽에 혼자 중얼거리며 걷는 사람의 음악.

- id: je_te_veux
  name: 주 트 뵈
  composer: 에릭 사티
  died: 1925
  year: 1902
  mutopia: Satie Je te veux
  themes: [고백, 왈츠, 카페, 설렘, 가벼운 사랑]
  story: |
    1902년 카바레 가수 폴레트 다르티를 위해 쓴 왈츠 노래. 제목은 "당신을 원해요"라는 뜻이고 가사는 그대로 뜨거운 고백이다.
    돈이 없던 사티는 밤마다 카페에서 이런 유행가를 쓰고 쳤다. 그는 이 곡들을 자기 작품 목록에 넣지 않았다.
    파리의 카페에서 부르던 가벼운 고백의 음악.

- id: pavane_ravel
  name: 죽은 왕녀를 위한 파반
  composer: 모리스 라벨
  died: 1937
  year: 1899
  mutopia: Ravel Pavane pour une infante défunte
  themes: [오래된 그림, 지나간 시대, 그리움, 품위, 어린 공주]
  story: |
    1899년 스물네 살의 라벨이 쓴 곡. 제목은 특정한 누구의 죽음이 아니라 "옛날 스페인 궁정에서 어린 공주가 추었을 법한 춤"이라는 뜻으로, 라벨은 단어의 소리가 좋아서 골랐다고 했다.
    폴리냑 공주에게 헌정했다. 라벨은 뒤에 이 곡을 "너무 쉽고 샤브리에 영향이 짙다"며 멀리했지만 가장 많이 연주되는 곡이 되었다.
    오래된 그림 속 사람을 바라보는 음악.

- id: bolero
  name: 볼레로
  composer: 모리스 라벨
  died: 1937
  year: 1928
  mutopia: Ravel Bolero
  themes: [반복, 쌓이는 것, 집요함, 끝까지, 축제]
  story: |
    1928년 무용가 이다 루빈스타인을 위해 쓴 곡. 같은 선율 두 개와 같은 리듬이 17분 동안 한 번도 바뀌지 않고 악기만 늘어난다. 라벨은 "선율도 화성도 없는 관현악 실험"이라고 했다.
    초연 때 한 여성이 "미친 사람"이라고 소리쳤고 라벨은 "저 사람은 이해했다"고 답했다. 그는 몇 해 뒤 뇌 질환으로 글도 음표도 쓰지 못하게 되었다.
    같은 일을 끝까지 되풀이하는 사람의 음악. 작게 시작해서 모든 것이 된다.

- id: swan_lake
  name: 백조의 호수
  composer: 표트르 차이콥스키
  died: 1893
  year: 1876
  mutopia: Tchaikovsky Swan Lake
  themes: [저주, 밤의 호수, 이룰 수 없는 사랑, 운명, 진짜와 가짜]
  story: |
    1876년 차이콥스키가 쓴 첫 발레. 낮에는 백조, 밤에만 사람이 되는 공주 오데트의 이야기다. 오보에가 부르는 주제는 밤의 호수에서 처음 들린다.
    초연은 실패했고 차이콥스키는 죽을 때까지 이 발레가 성공하는 것을 보지 못했다. 그가 죽은 뒤 1895년 재공연으로 살아났다.
    차이콥스키는 1877년 자신의 성 정체성을 감추려 결혼했다가 몇 주 만에 도망쳤다. 밤에만 자기 자신이 되는 사람의 음악.

- id: none_but
  name: 그리움을 아는 이만이
  composer: 표트르 차이콥스키
  died: 1893
  year: 1869
  mutopia: Tchaikovsky None but the lonely heart
  themes: [그리움, 아무도 모르는 마음, 혼자, 멀리 있는 사람]
  story: |
    1869년 스물아홉 살의 차이콥스키가 괴테의 시에 붙인 노래. 시는 "그리움을 아는 사람만이 내가 무엇을 겪는지 안다"로 시작한다.
    그해 차이콥스키는 벨기에 가수 데지레 아르토와 약혼했다가 파혼당했다. 그는 평생 결혼다운 결혼을 하지 못했다.
    설명할 수 없는 마음을 품은 사람의 노래.

- id: june_barcarolle
  name: 사계 6월 뱃노래
  composer: 표트르 차이콥스키
  died: 1893
  year: 1876
  mutopia: Tchaikovsky June Barcarolle
  themes: [여름밤, 강가, 흔들리는 마음, 6월, 산책]
  story: |
    1876년 음악 잡지가 매달 한 곡씩 실으려고 의뢰한 「사계」 열두 곡 중 6월. 잡지에는 "강가로 나가자, 물결이 우리 발에 입 맞추리라"는 시 구절이 함께 실렸다.
    차이콥스키는 하인에게 매달 마감일을 알려 달라고 해 두고 그날 앉은자리에서 한 곡씩 썼다고 한다.
    여름밤 강가를 걷는 사람의 음악.

- id: andante_cantabile
  name: 안단테 칸타빌레
  composer: 표트르 차이콥스키
  died: 1893
  year: 1871
  mutopia: Tchaikovsky Andante cantabile
  themes: [민요, 일하는 사람, 어릴 때 들은 노래, 눈물, 톨스토이]
  story: |
    1871년 현악 사중주 1번의 느린 악장. 선율은 차이콥스키가 누이 집에 머물 때 창밖에서 미장이가 부르던 우크라이나 민요에서 가져왔다. 가사는 "바냐가 소파에 앉아 술잔을 채우네"였다.
    1876년 이 곡을 들은 톨스토이가 차이콥스키 옆에서 눈물을 흘렸고, 차이콥스키는 "내 작곡가 인생에서 가장 자랑스러운 순간"이라고 일기에 썼다.
    창밖에서 일하던 사람이 부르던 노래. 누군가의 노동요가 누군가의 눈물이 된다.

- id: vocalise
  name: 보칼리제
  composer: 세르게이 라흐마니노프
  died: 1943
  year: 1915
  mutopia: Rachmaninoff Vocalise
  themes: [말이 필요 없는 슬픔, 떠나기 전, 고향, 긴 숨]
  story: |
    1915년 라흐마니노프가 가사 없이 모음 하나로만 부르는 노래로 썼다. 소프라노 네즈다노바에게 헌정했고, 가사가 없어 아쉽다는 그녀에게 "당신의 목소리로 말보다 많은 것을 전할 수 있다"고 답했다.
    2년 뒤 러시아 혁명이 일어났고 라흐마니노프는 가족과 함께 썰매를 타고 고국을 떠나 다시 돌아가지 못했다.
    말로 하면 모자라는 마음의 음악. 긴 숨 하나로 부르는 노래.

- id: rach2_adagio
  name: 피아노 협주곡 2번 2악장
  composer: 세르게이 라흐마니노프
  died: 1943
  year: 1901
  mutopia: Rachmaninoff Piano Concerto 2 Adagio
  themes: [다시 일어섬, 치유, 침묵 뒤의 첫마디, 밤에서 아침으로]
  story: |
    1901년 완성. 라흐마니노프는 1897년 교향곡 1번이 참담하게 실패한 뒤 3년 동안 아무것도 쓰지 못했다. 최면 치료사 달 박사가 매일 "당신은 협주곡을 쓸 것이고 그것은 훌륭할 것"이라고 말해 주었고, 완성된 이 곡을 달 박사에게 헌정했다.
    느린 악장은 피아노가 조용히 화음을 놓으면 플루트와 클라리넷이 먼저 노래하고, 피아노가 뒤를 잇는다.
    오래 말을 잃었던 사람이 다시 입을 여는 음악. 영화 「밀회」의 음악.

- id: rach_prelude_cs
  name: 전주곡 C#단조
  composer: 세르게이 라흐마니노프
  died: 1943
  year: 1892
  mutopia: Rachmaninoff Prelude C sharp minor
  themes: [종소리, 운명, 피할 수 없는 것, 열아홉, 무게]
  story: |
    1892년 열아홉 살의 라흐마니노프가 모스크바 음악원을 갓 졸업하고 쓴 곡. 첫 세 음은 종소리다. 40루블에 팔았고 저작권도 없이 세계에 퍼져 평생 한 푼도 더 받지 못했다.
    가는 곳마다 청중이 이 곡을 앙코르로 요구해서 그는 이 곡을 "그것"이라고 부르며 지겨워했다.
    피할 수 없는 것이 종처럼 울리는 음악. 열아홉에 평생을 따라다닐 것을 만든 사람.

- id: new_world
  name: 신세계 교향곡 라르고
  composer: 안토닌 드보르자크
  died: 1904
  year: 1893
  hand: new_world
  mutopia: Dvořák New World Largo
  themes: [고향, 집으로, 타향, 부모님, 하루의 끝, 떠나보냄, 졸업]
  story: |
    1893년 드보르자크가 뉴욕 국립음악원 원장으로 있을 때 쓴 교향곡 9번 2악장. 그는 보헤미아의 고향을 몹시 그리워했고, 흑인 영가와 롱펠로의 시 「하이어워사」에서 받은 인상을 이 느린 악장에 담았다.
    제자 해리 벌리가 불러 준 영가를 들으며 썼고, 여름에는 체코 이민자 마을인 아이오와 스필빌에 가서 가족과 함께 지냈다. 1922년 제자 윌리엄 암스 피셔가 이 선율에 「고잉 홈」이라는 가사를 붙였다.
    먼 곳에서 고향과 가족을 떠올리는 사람의 음악.

- id: songs_mother
  name: 어머니가 가르쳐 주신 노래
  composer: 안토닌 드보르자크
  died: 1904
  year: 1880
  mutopia: Dvořák Songs my mother taught me
  themes: [엄마, 물려받은 노래, 부모가 된 나, 눈물, 세대]
  story: |
    1880년 「집시의 노래」 일곱 곡 중 네 번째. 가사는 "어머니가 내게 노래를 가르쳐 주실 때 눈물을 흘리셨다. 이제 내가 아이들에게 가르치니 내 뺨에도 눈물이 흐른다"이다.
    드보르자크는 1870년대에 어린 세 아이를 잇달아 잃었다. 이 노래는 그 뒤 다시 태어난 아이들을 키우며 쓴 곡이다. 반주는 6/8, 노래는 2/4로 서로 어긋나며 흔들린다.
    엄마에게 받은 것을 아이에게 건네는 사람의 노래.

- id: humoresque
  name: 유모레스크 7번
  composer: 안토닌 드보르자크
  died: 1904
  year: 1894
  mutopia: Dvořák Humoresque 7
  themes: [웃음과 눈물, 기차, 여행, 가벼운 발걸음, 추억]
  story: |
    1894년 미국에서 돌아온 여름, 보헤미아의 시골집에서 쓴 여덟 곡의 「유모레스크」 중 일곱 번째. 미국에서 적어 둔 스케치북의 선율들로 만들었다.
    통통 튀는 첫 부분과 느리고 슬픈 중간 부분이 번갈아 나온다. 드보르자크는 기차와 배를 좋아해 뉴욕에서도 매일 항구와 역에 나가 구경했다.
    웃다가 울다가 다시 웃는 음악. 여행에서 돌아온 사람의 발걸음.

- id: song_to_moon
  name: 달에게 부치는 노래
  composer: 안토닌 드보르자크
  died: 1904
  year: 1901
  mutopia: Dvořák Song to the Moon Rusalka
  themes: [달, 멀리 있는 사람에게 전해 달라는 말, 짝사랑, 물, 밤]
  story: |
    1901년 오페라 「루살카」에서 물의 요정 루살카가 달에게 부르는 노래. 가사는 "달아, 잠시 멈춰서 내 사랑이 어디 있는지 말해 줘. 그에게 내가 기다린다고 전해 줘"다.
    루살카는 사람을 사랑해 목소리를 내주고 사람이 되지만 끝내 버림받는다. 드보르자크가 예순 살에 쓴 마지막 성공작이다.
    직접 말하지 못해 달에게 대신 부탁하는 사람의 노래.

- id: vltava
  name: 몰다우
  composer: 베드르지흐 스메타나
  died: 1884
  year: 1874
  mutopia: Smetana Vltava Moldau
  themes: [강, 고향, 흘러가는 것, 작은 시작, 바다로]
  story: |
    1874년 스메타나가 조국 보헤미아를 그린 연작 「나의 조국」의 두 번째 곡. 작은 샘 두 줄기에서 시작한 강이 숲과 마을의 결혼식, 달밤을 지나 프라하를 통과해 큰 강이 된다.
    스메타나는 이 곡을 쓰던 해 갑자기 귀가 완전히 먹었다. 이 곡의 초연을 듣지 못했다.
    선율은 옛 민요에서 왔고 뒤에 이스라엘 국가 「하티크바」가 되었다. 작게 시작해 바다로 가는 사람의 음악.

- id: morning_mood
  name: 아침의 기분
  composer: 에드바르 그리그
  died: 1907
  year: 1875
  mutopia: Grieg Morning Mood Peer Gynt
  themes: [아침, 해 뜨는 시간, 새 출발, 월요일, 눈을 뜨는 순간]
  story: |
    1875년 입센의 희곡 「페르 귄트」 극음악의 한 곡. 무대에서는 노르웨이가 아니라 모로코 사막에서 해가 뜨는 장면이다. 플루트가 먼저, 오보에가 받고, 해가 완전히 뜨면 오케스트라 전체가 울린다.
    그리그는 이 일을 "지독하게 다루기 어려운 주제"라고 투덜대며 썼지만 가장 유명한 곡이 되었다.
    눈을 뜨고 하루가 시작되는 음악.

- id: solveig
  name: 솔베이지의 노래
  composer: 에드바르 그리그
  died: 1907
  year: 1875
  mutopia: Grieg Solveig's Song
  themes: [기다림, 평생, 돌아올 사람, 늙음, 변하지 않는 마음]
  story: |
    「페르 귄트」에서 솔베이지가 부르는 노래. 페르는 젊은 날 솔베이지를 두고 세상을 떠돌고, 솔베이지는 산속 오두막에서 평생 그를 기다린다. 가사는 "겨울이 가고 봄이 가도 나는 기다린다"이다.
    늙어 빈손으로 돌아온 페르는 눈먼 솔베이지의 무릎에 안겨 죽고, 그녀는 자장가를 부른다. 그리그는 아내 니나가 부를 것을 생각하며 썼다.
    한 사람을 평생 기다린 이의 노래.

- id: arietta
  name: 아리에타
  composer: 에드바르 그리그
  died: 1907
  year: 1867
  mutopia: Grieg Arietta Lyric Pieces
  themes: [처음과 끝, 짧은 생각, 소박함, 일기, 스물넷]
  story: |
    1867년 스물네 살의 그리그가 쓴 「서정 소곡집」 1권의 첫 곡. 그리그는 평생 34년 동안 이 소곡집을 열 권, 예순여섯 곡 썼고, 마지막 곡 「추억」은 이 첫 곡의 선율을 왈츠로 바꿔 끝맺었다.
    한 페이지짜리 곡이다. 왼손이 분산화음으로 흐르고 오른손이 짧게 노래한다.
    일기장의 첫 페이지와 마지막 페이지가 같은 말인 음악.

- id: nimrod
  name: 니므롯
  composer: 에드워드 엘가
  died: 1934
  year: 1899
  mutopia: Elgar Nimrod Enigma
  themes: [친구, 고마움, 힘들 때 곁에 있어 준 사람, 추모, 버팀]
  story: |
    1899년 「수수께끼 변주곡」의 아홉 번째 곡. 열네 명의 친구를 한 곡씩 그린 작품에서 이 곡은 출판사 직원이자 친구 아우구스트 예거다. 예거는 엘가가 작곡을 그만두려 할 때 밤늦게 찾아와 베토벤도 고통 속에서 더 좋은 곡을 썼다고 설득했다.
    엘가는 그 밤의 대화를 이 곡에 담았다고 했다. 느린 악장이 베토벤의 비창 2악장을 닮은 이유다.
    영국에서는 전몰자 추모일에 연주된다. 포기하려던 밤에 곁에 있어 준 사람에게 바치는 음악.

- id: salut_damour
  name: 사랑의 인사
  composer: 에드워드 엘가
  died: 1934
  year: 1888
  mutopia: Elgar Salut d'Amour
  themes: [약혼, 선물, 수줍은 고백, 처음 사랑, 정원]
  story: |
    1888년 엘가가 피아노 제자였던 앨리스 로버츠에게 약혼 선물로 쓴 곡. 앨리스는 여덟 살 연상이었고 집안은 가난한 음악 선생과의 결혼을 반대했다. 앨리스는 답례로 시를 선물했다.
    엘가는 이 곡을 2기니에 팔아 넘겼고, 세계적으로 팔릴 때 아무 수입도 없었다. 결혼 뒤 앨리스는 그가 작곡에만 몰두하도록 모든 것을 맡았다.
    수줍은 사람이 건네는 첫 선물의 음악.

- id: jupiter
  name: 목성
  composer: 구스타브 홀스트
  died: 1934
  year: 1916
  mutopia: Holst Jupiter Planets
  themes: [맹세, 나라, 함께 부르는 노래, 넓음, 다짐]
  story: |
    1916년 관현악 모음곡 「행성」의 네 번째 곡 「목성, 기쁨을 가져오는 자」의 가운데 선율. 1차 대전 중에 썼고, 1921년 홀스트는 이 선율에 "내 조국이여, 그대에게 맹세하노라"라는 시를 붙여 찬송가로 만들었다.
    영국 장례식과 추모식에서 가장 많이 불리는 노래가 되었고 다이애나 비의 결혼식과 장례식에서 모두 불렸다.
    넓고 느리게 함께 부르는 맹세의 음악.

- id: adagietto
  name: 교향곡 5번 아다지에토
  composer: 구스타프 말러
  died: 1911
  year: 1902
  mutopia: Mahler Adagietto
  themes: [연애편지, 말없는 고백, 느린 사랑, 아내, 깊은 밤]
  story: |
    1902년 말러가 교향곡 5번의 네 번째 악장으로 쓴 곡. 현악기와 하프만 쓴다. 지휘자 멩엘베르크의 메모에 따르면 이 악장은 말러가 열아홉 살 연하의 알마에게 보낸 연애편지였고, 알마는 악보를 받고 "오라"고 답했다. 두 사람은 그해 결혼했다.
    1971년 영화 「베니스에서의 죽음」에 쓰인 뒤 장례 음악처럼 느리게 연주되는 일이 많아졌지만, 원래는 사랑 노래였다.
    말 대신 악보로 보낸 고백의 음악.

- id: o_mio_babbino
  name: 오 나의 사랑하는 아버지
  composer: 자코모 푸치니
  died: 1924
  year: 1918
  mutopia: Puccini O mio babbino caro
  themes: [아빠, 딸, 부탁, 사랑하는 사람과 결혼하게 해 달라는 말, 피렌체]
  story: |
    1918년 희가극 「잔니 스키키」에서 딸 라우레타가 아버지에게 부르는 아리아. 가사는 "오 나의 사랑하는 아버지, 나는 그 사람이 좋아요. 허락해 주지 않으면 다리에서 뛰어내릴 거예요"다. 응석 섞인 협박인데 선율은 더없이 진지하다.
    푸치니는 이 곡을 뉴욕 초연에서 처음 올렸고 유럽은 전쟁이 끝난 직후였다.
    아버지에게 처음으로 자기 사랑을 말하는 딸의 노래. 영화 「전망 좋은 방」의 음악.

- id: nessun_dorma
  name: 네순 도르마
  composer: 자코모 푸치니
  died: 1924
  year: 1926
  mutopia: Puccini Nessun dorma
  themes: [새벽, 이길 것이다, 잠 못 드는 밤, 다짐, 승리]
  story: |
    오페라 「투란도트」에서 왕자 칼라프가 부르는 아리아. 아무도 잠들지 말라는 공주의 명령이 내려진 밤에 그는 "새벽이 오면 나는 이기리라"고 노래한다. 푸치니는 이 오페라를 끝내지 못하고 1924년 죽었고, 1926년 초연에서 지휘자 토스카니니는 푸치니가 쓴 마지막 마디에서 지휘봉을 내려놓았다.
    1990년 월드컵 주제가로 쓰이며 세상에서 가장 유명한 아리아가 되었다.
    밤을 새우며 아침을 기다리는 사람의 노래.

- id: humming_chorus
  name: 허밍 코러스
  composer: 자코모 푸치니
  died: 1924
  year: 1904
  mutopia: Puccini Humming Chorus Butterfly
  themes: [밤새 기다림, 가사 없는 노래, 창가, 돌아오지 않는 사람, 아이와 함께]
  story: |
    1904년 오페라 「나비 부인」 2막 끝. 3년 만에 돌아온 핑커턴의 배를 보고 나비 부인은 아이와 하녀와 함께 창가에 앉아 밤새 그를 기다린다. 무대 뒤 합창단이 입을 다문 채 허밍으로만 노래한다.
    아침이 와도 그는 오지 않고, 왔을 때는 미국인 아내와 함께였다. 초연은 야유 속에 실패했고 푸치니는 고쳐 써서 석 달 뒤 성공시켰다.
    말없이 밤새 기다리는 사람의 음악.

- id: intermezzo_cavalleria
  name: 카발레리아 루스티카나 간주곡
  composer: 피에트로 마스카니
  died: 1945
  year: 1890
  mutopia: Mascagni Intermezzo Cavalleria
  themes: [부활절 아침, 폭풍 전의 고요, 마을, 용서, 돌이킬 수 없는 것]
  story: |
    1890년 스물여섯 살의 마스카니가 작곡 공모에 내서 1등을 한 단막 오페라의 간주곡. 시칠리아 마을의 부활절 아침, 배신과 결투가 벌어지기 직전 텅 빈 광장에서 오케스트라만 연주한다.
    마스카니는 평생 이 첫 작품을 넘지 못했고, "나는 스물여섯에 왕관을 썼다"고 말했다.
    영화 「대부 3」의 마지막과 「분노의 주먹」의 처음에 흘렀다. 무슨 일이 벌어지기 전, 가장 고요한 아침의 음악.

- id: va_pensiero
  name: 히브리 노예들의 합창
  composer: 주세페 베르디
  died: 1901
  year: 1842
  mutopia: Verdi Va pensiero
  themes: [고향, 잃어버린 땅, 함께 부르는 노래, 그리움, 나라]
  story: |
    1842년 오페라 「나부코」에서 바빌론에 끌려간 히브리 노예들이 부르는 합창. 가사는 "날아가라, 생각이여, 금빛 날개를 타고"로 시작한다.
    베르디는 그 전 2년 사이에 두 아이와 아내를 모두 잃고 작곡을 그만두려 했다. 대본을 던져 두었는데 펼쳐진 페이지가 바로 이 합창의 가사였다고 그는 회고했다.
    이탈리아 사람들이 제2의 국가로 부른다. 베르디의 장례식에서 거리의 군중이 이 노래를 불렀다. 잃은 것을 함께 부르는 음악.

- id: la_donna
  name: 여자의 마음
  composer: 주세페 베르디
  died: 1901
  year: 1851
  mutopia: Verdi La donna è mobile
  themes: [바람 같은 사람, 가벼움, 술자리, 믿지 못할 말]
  story: |
    1851년 오페라 「리골레토」에서 바람둥이 공작이 부르는 노래. 가사는 "여자의 마음은 바람에 날리는 깃털 같다"지만 정작 변덕스러운 쪽은 노래하는 공작 자신이다.
    베르디는 초연 직전까지 이 선율을 테너에게만 알려 주고 입단속을 시켰다. 거리에 퍼지면 초연의 놀라움이 사라질 것을 알았기 때문이다. 다음 날 베네치아의 곤돌라 사공들이 모두 이 노래를 불렀다.
    믿지 못할 말을 가장 유쾌하게 부르는 노래.

- id: libiamo
  name: 축배의 노래
  composer: 주세페 베르디
  died: 1901
  year: 1853
  mutopia: Verdi Libiamo Brindisi
  themes: [건배, 파티, 오늘 밤, 첫 만남, 들뜸]
  story: |
    1853년 오페라 「라 트라비아타」 첫 장면에서 알프레도와 비올레타가 처음 만나 함께 부르는 건배의 노래. "마시자, 기쁨의 잔으로"로 시작한다. 뒤에 올 이별과 죽음을 아직 아무도 모른다.
    초연은 실패했다. 폐병으로 죽는 역의 소프라노가 너무 건강해 보인다고 관객이 웃었다. 베르디는 "시간이 말해 줄 것"이라고 편지에 썼다.
    처음 만난 밤, 아무것도 모른 채 잔을 드는 노래.

- id: humoresque_dance
  name: 보케리니 미뉴에트
  composer: 루이지 보케리니
  died: 1805
  year: 1771
  mutopia: Boccherini Minuet
  themes: [우아한 오후, 정원 파티, 가벼운 춤, 옛날 영화]
  story: |
    1771년 마드리드 궁정에서 일하던 보케리니가 쓴 현악 오중주의 한 악장. 첼로 주자였던 그는 스페인 왕자의 궁정에서 평생 일했지만 가난하게 죽었다.
    짧고 가볍고 우아하다. 옛날 영화에서 귀족들이 춤추는 장면마다 나온다.
    햇빛 좋은 오후, 걱정 없이 가볍게 걷는 음악.

- id: dance_blessed
  name: 정령들의 춤
  composer: 크리스토프 빌리발트 글루크
  died: 1787
  year: 1762
  mutopia: Gluck Dance of the Blessed Spirits
  themes: [저승, 찾아가는 사람, 잃은 사람, 평화로운 들판, 플루트]
  story: |
    1762년 오페라 「오르페오와 에우리디체」에서 죽은 아내를 찾아 저승에 내려간 오르페오가 복된 영혼들의 들판에 들어설 때 흐르는 플루트 곡. 슬픔이 아니라 고요다.
    오르페오는 아내를 데리고 나오다 돌아보지 말라는 약속을 어기고 다시 잃는다. 글루크는 이 곡으로 화려하기만 하던 오페라를 단순한 감정의 음악으로 바꾸었다.
    잃은 사람을 만나러 가는 길의 음악.

- id: dido_lament
  name: 디도의 탄식
  composer: 헨리 퍼셀
  died: 1695
  year: 1689
  mutopia: Purcell Dido's Lament
  themes: [작별, 나를 기억해 줘, 떠나는 사람, 마지막 부탁]
  story: |
    1689년 오페라 「디도와 아이네아스」의 마지막 아리아. 사랑하는 사람이 떠난 뒤 카르타고의 여왕 디도가 "내가 땅에 묻히거든, 나를 기억해 줘. 하지만 내 운명은 잊어 줘"라고 노래한다.
    여학교 공연을 위해 쓴 곡이라고 전해진다. 같은 베이스 선율이 열한 번 반복되며 가라앉는다. 퍼셀은 6년 뒤 서른여섯 살에 죽었다.
    영국에서는 매년 전몰자 추모식에서 연주된다. 떠나는 사람의 마지막 부탁.

- id: flow_my_tears
  name: 흘러라 내 눈물
  composer: 존 다울런드
  died: 1626
  year: 1600
  mutopia: Dowland Flow my tears
  themes: [눈물, 어둠 속의 위안, 밤, 우울, 혼자]
  story: |
    1600년 류트 가수 다울런드가 출판한 노래. 가사는 "흘러라 내 눈물, 네 샘에서. 영원히 추방되어 나를 슬퍼하게 하라"로 시작한다. 그는 영국 궁정에 자리를 얻지 못해 덴마크 왕실에서 일하며 이 노래를 썼다.
    "언제나 슬픈 다울런드"라는 말장난을 자기 이름처럼 썼다. 400년 뒤 스팅이 이 노래들을 다시 불렀다.
    슬픔을 숨기지 않기로 한 사람의 노래. 어둠 속에 사는 이들은 빛을 경멸한다고 노래한다.

- id: entertainer
  name: 엔터테이너
  composer: 스콧 조플린
  died: 1917
  year: 1902
  mutopia: Joplin The Entertainer
  themes: [경쾌함, 거리의 피아노, 웃음, 주말, 사기꾼의 미소]
  story: |
    1902년 흑인 작곡가 스콧 조플린이 쓴 래그타임. 조플린은 래그타임을 "진지한 음악"으로 인정받으려 평생 애썼고 오페라까지 썼지만 실패하고 가난하게 죽었다.
    1973년 영화 「스팅」에 쓰이면서 죽은 지 56년 만에 세계적으로 유명해졌다. 이듬해 그는 퓰리처상 특별상을 받았다.
    살아서 못 받은 박수를 죽어서 받은 사람의 가장 신나는 음악.

- id: beautiful_dreamer
  name: 뷰티풀 드리머
  composer: 스티븐 포스터
  died: 1864
  year: 1864
  mutopia: Foster Beautiful Dreamer
  themes: [잠든 사람에게, 세레나데, 마지막 노래, 가난, 꿈]
  story: |
    미국 최초의 직업 작곡가 포스터가 죽기 직전에 쓴 노래. 1864년 뉴욕의 싸구려 호텔에서 서른일곱 살에 가진 돈 38센트와 "친애하는 친구들과 다정한 마음들"이라고 적힌 쪽지를 남기고 죽었다.
    가사는 "아름다운 꿈꾸는 이여, 내게 깨어나라"로 시작하는 세레나데다. 「오 수재너」 「스와니 강」을 쓴 사람의 마지막 노래다.
    잠든 사람 곁에서 조용히 부르는 노래.

- id: greensleeves
  name: 그린슬리브스
  composer: 영국 민요
  died: 1600
  year: 1580
  hand: greensleeves
  mutopia: Greensleeves
  themes: [이별, 짝사랑, 다 주었던 사랑, 그리움, 가을, 겨울]
  story: |
    16세기 말 영국의 노래. 1580년에 「레이디 그린슬리브스」라는 제목으로 등록된 기록이 있다. 헨리 8세가 앤 불린을 위해 썼다는 이야기는 전설일 뿐 사실이 아니다.
    가사는 사랑하는 여인에게 모든 것을 주었지만 버림받은 남자의 노래다. 원래 가사에는 그녀에게 사 준 옷과 보석 목록이 길게 이어진다.
    400년 넘게 사람들이 가사를 바꿔 가며 불렀고, 19세기에는 성탄 찬송이 되었다. 떠난 사람을 탓하지 않고 그리워하는 노래.

- id: scarborough_fair
  name: 스카버러 페어
  composer: 영국 민요
  died: 1700
  year: 1670
  mutopia: Scarborough Fair
  themes: [불가능한 부탁, 옛 연인, 장터, 허브, 전해 달라는 말]
  story: |
    영국 요크셔의 오래된 발라드. 장터에 가는 사람에게 "거기 사는 옛 연인에게 전해 주오"라며 바늘땀 없는 셔츠를 지어 달라는 식의 불가능한 부탁을 늘어놓는다. 후렴의 "파슬리, 세이지, 로즈메리, 타임"은 약초 이름이다.
    1960년대 사이먼 앤 가펑클이 영국 가수 마틴 카시에게 배워 세계에 퍼뜨렸다.
    할 수 없는 걸 알면서 부탁하는, 아직 못 잊은 사람의 노래.

- id: danny_boy
  name: 대니 보이
  composer: 아일랜드 민요
  died: 1855
  year: 1855
  mutopia: Londonderry Air
  themes: [떠나는 아들, 부모, 기다림, 돌아오면 나는 없을지도, 배웅]
  story: |
    선율은 1855년 아일랜드 런던데리에서 채보된 「런던데리의 노래」다. 1913년 영국 변호사 프레더릭 웨덜리가 가사를 붙였다. 가사는 떠나는 대니를 배웅하며 "네가 돌아올 때 나는 죽어 있을지 모르지만, 와서 내 무덤에 인사해 다오"라고 말한다.
    부모가 전쟁이나 이민으로 떠나는 아들에게 부르는 노래로 읽힌다. 아일랜드 이민자들의 장례식에서 가장 많이 불린다.
    떠나는 아이를 배웅하는 부모의 노래.

- id: amazing_grace
  name: 어메이징 그레이스
  composer: 존 뉴턴·전통 선율
  died: 1807
  year: 1779
  hand: amazing_grace
  mutopia: Amazing Grace
  themes: [용서, 다시 시작, 후회, 떠난 사람, 추모, 두 번째 기회]
  story: |
    가사는 1772년 영국의 존 뉴턴이 썼다. 그는 노예 무역선 선장이었다가 1748년 폭풍 속에서 배가 거의 가라앉을 때 처음 기도했고, 뒤에 목사가 되어 노예제 폐지 운동에 섰다.
    "나 같은 죄인 살리신"으로 시작하는 가사는 자신이 한 일을 알고도 다시 살게 된 사람의 고백이다. 지금의 선율 「뉴 브리튼」은 1835년 미국에서 붙었다.
    잃었다가 다시 찾은 사람, 한 번 더 기회를 얻은 사람의 노래.

- id: auld_lang_syne
  name: 올드 랭 사인
  composer: 스코틀랜드 민요
  died: 1796
  year: 1788
  mutopia: Auld Lang Syne
  themes: [옛 친구, 한 해의 끝, 작별, 다시 만남, 송년]
  story: |
    1788년 스코틀랜드 시인 로버트 번스가 "한 노인이 부르는 것을 받아 적었다"며 남긴 가사에 옛 민요 선율을 붙였다. 제목은 "오래전 옛날"이라는 뜻이고, 가사는 "옛 친구를 잊어야 하는가"로 시작한다.
    한국에서는 1948년까지 애국가의 선율로 불렸고, 「석별의 정」으로 졸업식에서 부른다. 세계에서 한 해의 마지막 밤에 가장 많이 부르는 노래다.
    헤어지는 자리에서 옛날을 위해 한 잔 드는 노래.

- id: arirang
  name: 아리랑
  composer: 한국 민요
  died: 1900
  year: 1896
  mutopia: Arirang
  themes: [고개, 떠나는 사람, 한, 고향, 함께 부르는 노래, 한국]
  story: |
    경기 아리랑. 1896년 미국인 선교사 헐버트가 서양 악보로 처음 채보했고, 1926년 나운규의 영화 「아리랑」 주제가로 전국에 퍼졌다. 가사는 지역과 사람마다 다르지만 "나를 버리고 가시는 님은 십 리도 못 가서 발병 난다"가 가장 널리 불린다.
    떠나는 사람을 원망하면서도 끝내 붙잡지 못하는 노래다. 남북 단일팀의 국가 대신 불렸고, 2012년 유네스코 인류무형문화유산이 되었다.
    한국 사람이면 누구나 끝까지 부를 수 있는 한 곡.

- id: doraji
  name: 도라지타령
  composer: 한국 민요
  died: 1900
  year: 1900
  mutopia: Doraji
  themes: [일하는 노래, 산, 봄나물, 흥, 시골]
  story: |
    경기 지방의 민요. 깊은 산에 도라지를 캐러 가는 가사로, 한두 뿌리만 캐도 바구니가 찬다며 흥을 낸다. 20세기 초 서울의 소리꾼들이 부르면서 전국으로 퍼졌다.
    세 박자의 세마치장단이고 후렴 "에헤요 에헤요"를 여럿이 받아 부른다.
    일하면서 부르던 노래. 흥이 나는 봄날 산길.

- id: kojo_no_tsuki
  name: 황성의 달
  composer: 다키 렌타로
  died: 1903
  year: 1901
  mutopia: Kojo no Tsuki
  themes: [폐허, 달, 지나간 영광, 옛날, 스물셋에 죽은 사람]
  story: |
    1901년 스물한 살의 다키 렌타로가 중학교 음악 교과서용으로 쓴 노래. 가사는 무너진 성터에 뜬 달을 보며 옛 영화를 떠올리는 내용이다. 그는 2년 뒤 결핵으로 스물셋에 죽었다.
    일본 최초의 서양식 가곡으로 꼽히고, 한국에서도 「황성 옛터」와 함께 폐허의 노래로 불렸다. 재즈 피아니스트 델로니어스 몽크가 연주했다.
    무너진 자리에 뜬 달을 보는 사람의 노래.

- id: mo_li_hua
  name: 모리화
  composer: 중국 민요
  died: 1800
  year: 1804
  mutopia: Mo Li Hua Jasmine
  themes: [꽃, 수줍음, 주고 싶은 마음, 여름, 동양]
  story: |
    18세기 중국 강남 지방의 민요. 재스민 꽃을 꺾어 누군가에게 주고 싶은데 꽃을 지키는 사람이 혼낼까 봐 망설이는 가사다. 1804년 영국인 배로가 서양에 처음 소개했고, 푸치니가 「투란도트」에 이 선율을 썼다.
    2008년 베이징 올림픽 시상식 음악으로 쓰였다.
    꺾어서 주고 싶은데 망설이는 사람의 노래.
