title: 뜨거웠어
hook: 뜨거웠어 우리
theme: 사랑
story: 조용해져서 어른 소리를 듣는 사람들이, 식은 줄 알았던 지나간 뜨거움을 처음으로 인정하는 밤에 부른다.
created: 2026-11-09 11:28
request: {}
lang: ko
instrumental: false
sound_plan: 단조 바탕에 후렴에서 쌉쌀한 장조로 열리는 2000년대 한국 얼터너티브 락, 132bpm 안팎. 드럼은 한 방에서 친 라이브 킷으로 킥은 단단하고 스네어는 두껍게, 절은 닫힌 하이햇, 후렴은 오픈 크래시. 베이스는 피크로 리프와 같은 음을 8분음으로 밀고, 브릿지에서는 하프타임으로 혼자 남아 리듬을 지킨다. 화성은 디스토션 리듬 기타 두 대를 좌우로, 절은 팜뮤트, 후렴은 기타 벽. 리프 하나가 곡의 얼굴이고 2절부터 리드 기타가 보컬 뒤를 받는 모티프를 친다. 멜로디는 절에서 낮고 좁게 말하듯, 프리코러스에서 같은 음을 반복하며 올라가 후렴 첫 음절에서 도약하고 '우리'의 끝 모음을 길게 버틴다. 보컬은 약간 거친 결의 남성 바리톤, 절은 박자 뒤로 담담하게, 후렴은 흉성으로 더블링, 마지막 후렴에 옥타브 아래 백킹. 두 번째 후렴 뒤 8마디 멜로디 기타 솔로, 브릿지는 하프타임으로 베이스와 거의 말하는 목소리만, 마지막 후렴에서 전부 돌아와 가장 크게, 아웃트로는 리프 한 번 뒤 급정지.
style: 'Korean rock, 2000s alternative, driving 132 bpm, minor key with a bittersweet major lift in the chorus. Slightly raspy male baritone, plain and mature, talky verses behind the beat, sung in Korean, korean lyrics. Intro: main distorted guitar riff, drums crash in. Verse 1: palm-muted guitar, picked bass locked to the riff, closed hi-hat, narrow conversational melody. Pre-chorus: tom build, rising repeated note. Chorus: wall of guitars left and right, open crash, upward leap on the hook, long held last note, doubled vocal. Verse 2 adds a lead guitar motif answering the voice. 8-bar melodic guitar solo. Bridge: half-time, bass and near-spoken voice. Final chorus biggest, low octave backing vocals. Outro: riff once more, hard stop. Live room drums, vocal upfront. Raw, proud, bittersweet.'
exclude: autotune, synth pads, orchestral strings
photo_query: bonfire night friends silhouette
image_prompt: Two people in worn denim jackets seen from behind, sitting close to a dying bonfire on a dark beach at night, an old guitar case lying beside them. Orange embers against deep navy blue, warm and bittersweet.
short_scenes:
- The same two people standing by the bonfire as it flares up, sparks rising into the navy night sky, their silhouettes lit orange, heads tilted back.
- Close-up of two hands resting near glowing embers in the sand, one denim sleeve, the warm orange light fading at the edges.
- Early blue dawn on the same beach, only grey ash and the old guitar case left in the sand where the fire was.
title_kind: 후렴 문장
tempo: 빠름
arc: '화법: 우리. 기(1절): 조용해진 걸 어른이라 부르는 지금, 덜 아픈 쪽만 골라 온 우리. 승(프리코러스→후렴): 다 잊었다던 우리도 이 밤엔 말한다, 뜨거웠어 우리, 데일 걸 알면서도 또 할 거라고. 전(2절→브릿지): 2절은 어른이 된 너에게 그 열기를 어디 뒀냐고 묻고 둘 다 숨기고 산다고 인정한다. 브릿지에서 처음으로 식은 게 아니라 다 태운 거라고 말한다. 결(마지막 후렴): 둘째 줄 ''데일 걸 알면서''가 ''끝난 지금도''로 바뀌어, 같은 훅이 미련이 아니라 다 써 버린 사람의 자부심으로 들린다. 아웃트로는 리프 한 번과 급정지.'
line_plan: '1(절1-1, 선언): 조용해지는 걸 어른이라 부르는 세상. 2(절1-2, 모순+질문): 칭찬인데 아프다. 3(절1-3, 새 뜻, 명사로 끊음): 덜 아픈 쪽만. 4(절1-4, 정확한 말): 그렇게 살아온 우리. 5(프리-1, 전환, 명사 끊김): 다 잊었다던 우리. 6(프리-2, 전환, 열린 끝 -면): 이 밤이 오면. 7(후렴-1, 고백, 훅): 우리는 뜨거웠다. 8(후렴-2, 모순): 다칠 걸 알면서. 9(후렴-3, 고백): 다시 해도 또 한다. 10(후렴-4, 선언, 훅). 11(절2-1, 시점 전환, 명사 끊김): 어른이 된 너. 12(절2-2, 질문): 그 열기는 어디에. 13(절2-3, 정확한 말): 숨기고 산다는 것. 14(절2-4, 새 뜻): 우리 둘 다 같다. 15~16 프리 반복. 17~20 후렴 반복(훅 17, 20). 21(브릿지-1, 정확한 말): 식은 게 아니다. 22(브릿지-2, 인정, 곡의 진심): 다 써 버린 것. 23(마지막 후렴-1, 훅). 24(마지막 후렴-2, 뒤집기): 끝난 지금도. 25(고백): 또 한다. 26(훅). 훅 줄 번호: 7, 10, 17, 20, 23, 26 = 6번.'
why: '''뜨거웠어 우리''는 사랑이든 청춘이든 꿈이든, 한때 무언가에 다 걸어 본 사람이면 누구나 자기 일로 받는 말이라 가장 넓다. 직전 곡이 해요체였고 직전 두 화법이 너에게·혼잣말이라 이번은 반말의 ''우리'' 화법으로, 장르는 아직 쓰지 않은 락으로 템포를 올렸다. 자우림 「미안해 널 미워해」처럼 모순(칭찬인데 아프다, 데일 걸 알면서)을 설명 없이 나란히 두었고, 극동아시아타이거즈처럼 마지막 후렴에서 한 줄만 바꿔 같은 훅이 그리움에서 자부심으로 들리게 했다. 진심 한 줄 ''식은 게 아니라 / 다 태운 거지''는 브릿지에 한 번만 두어 앞뒤를 가볍게 했다. 제목은 훅의 앞말 그대로인 반말 문장이라 외치기 쉽고 끝 모음으로 길게 뻗는다.'
