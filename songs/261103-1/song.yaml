polish:
- '변경 없음: 첫 두 줄은 고백과 뒤집기로 열린다. 후렴은 훅 ''같이 늙자''가 첫 줄에 두 번 나오고 제목과 같다. 생활 소품, 장소, 시각, 동작 나열이 없어 마음만 남는다. 브릿지에 처음 나오는 진심(''처음보다 지금이 좋아'')이 있다. 마지막 후렴은 끝줄 하나만 바뀌어 다른 뜻으로 들린다. 줄 수는 26줄로 범위 안이다. 짧은 부정, 어색한 구어체, 양보형, 유행어가 없다. 줄 끝은 해체, 연결어미, 명사, 청유, -네가 고르게 섞여 있어 고칠 줄이 없다.'
- '''서로 닮아 가는 걸음'' 반복: 두 절을 잇는 리프레인 한 줄이라 그대로 둔다.'
- '''그런데 그게 좋아'': ''근데''가 아닌 표준형이고 1절 첫 줄을 뒤집는 역할이 있어 그대로 둔다.'
