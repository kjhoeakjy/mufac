polish:
- '윈터 올 거면 말하고 와 → 겨울 올 거면 말하고 와: 우리말 입말 사이에 낀 영어 낱말이 번역투처럼 들린다. 외칠 때 ''겨울''이 더 바로 꽂힌다. 제목 winter는 사용자 요청대로 그대로 둔다.'
- '윈터 올 거면 너도 오지 → 겨울 올 거면 너도 오지: 후렴과 같은 이유로 바꿨다. 후렴 낱말을 맞춰야 마지막 비틀기가 산다.'
- '그 밖의 줄은 그대로 둠: 후렴이 ''말하고 와'' 한 마디를 되풀이하고, 사물은 장갑 하나로 이어지며, 웃기는 줄도 ''백 번'' 하나뿐이다. ''너''가 겨울과 사람을 함께 가리키고 감정도 한 번 바로 말한다. 점검표에 걸리는 줄이 없다.'
