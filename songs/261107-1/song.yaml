title: 살아지네
hook: 너 없이 살아지네
theme: 아픔
story: 헤어지고 애쓴 적도 없는데 하루하루가 살아지는 게 다행이면서 슬픈 사람이 혼자 중얼거리는 느린 노래.
created: 2026-11-07 11:37
request: {}
lang: ko
instrumental: false
sound_plan: 단조의 절에서 후렴은 씁쓸한 장조로 열리는 록발라드다. 빠르기는 70bpm 안팎이고 12/8로 흔들리듯 간다. 인트로는 그랜드 피아노 혼자 연다. 1절은 피아노와 속삭이듯 가까운 남성 테너만으로, 좁은 음역에서 말하듯 부른다. 프리코러스에서 둥근 핑거 베이스와 림샷이 들어오고, 같은 음을 되풀이하다 끝에서 올라간다. 첫 후렴부터 묵직하고 느린 라이브 드럼과 디스토션 기타 벽이 들어온다. 훅 첫 음은 옥타브로 도약하고 '살아지네'의 끝음을 길게 버틴다. 2절은 클린 기타 아르페지오와 현악 패드가 더해지고, 두 번째 후렴에서 보컬을 더블링한다. 두 번째 후렴 뒤에는 12마디 기타 솔로가 감정을 대신 말한다. 브릿지는 피아노와 목소리만 남기고 거의 말하듯 부른다. 마지막 후렴은 전조로 올라가 가장 크고 넓어지며, 스택 하모니와 애드리브를 한 번 넣는다. 아웃트로는 피아노 혼자 남아 마지막 코드를 길게 울린다. 큰 홀 공간에 기타를 넓게 펼치고, 보컬은 앞에 가깝게 둔다.
style: 'Korean rock ballad, 2000s, slow 70 bpm in 12/8, minor verses turning to a bittersweet major chorus. Male tenor, slightly raspy, whispered close verses behind the beat, open belted final chorus, mature and sincere, sung in Korean, korean lyrics. Intro: grand piano alone. Verse 1: piano and voice, narrow conversational melody. Pre-chorus: round fingered bass and rimshot, rising repeated note. Chorus: big slow live drums, wall of distorted guitars, octave leap on the first word, long held last note, doubled vocal. Verse 2: clean guitar arpeggios, string pad. Emotional 12-bar guitar solo after chorus two. Bridge strips to piano and voice. Key change into the final chorus, biggest, stacked harmonies, one ad-lib. Outro: piano alone, last chord held. Large hall, wide guitars, intimate lead vocal. Aching, heartfelt, accepting.'
exclude: autotune, synth beat, trap hi-hats
photo_query: man alone spring dusk
image_prompt: A man in a gray coat, seen from behind, stands on a quiet riverside path at spring dusk, holding his coat closed with one hand. Pale cherry petals drift past a single street lamp. Soft blue and blush tones, wistful and calm.
short_scenes:
- The same man in the gray coat lifts his face toward falling cherry petals at dusk, the street lamp glowing behind him, blue and blush sky wide open.
- Close-up of his hand opening slowly, a few pale petals resting in the palm under the warm lamp light.
- The empty riverside path after he has gone, petals settled under the lamp, the sky fading to deep blue.
title_kind: 단어 하나
tempo: 느림
arc: '화법: 혼잣말. 기: 보고 싶은 마음과 배고픈 몸이 함께 진심인 밤, 마음은 너에게 남고 몸은 혼자 내일로 간다. 승: 잊으려 애쓴 적도 없이 여기까지 와 버렸고, 너 없이 살아지는 게 다행인데 슬프다. 전: 2절에서 시간이 흘러 목소리는 흐려지고 웃음 뒤에 미안함이 남는다. 브릿지에서 처음으로 숨긴 진심을 말한다. 다 나으면 너를 잃을까 봐 일부러 조금 아팠다고. 결: 마지막 후렴의 ''다행인데 슬퍼''가 ''슬픈데 다행이야''로 뒤집히고, ''봄은 미안한 줄 모르고''가 ''이 봄이 반갑기도 하고''로 바뀌어 같은 훅이 체념이 아니라 받아들임으로 들린다.'
line_plan: '[Verse 1] 1 모순(임팩트): 그리움과 허기가 동시에 있다는 것. 2 선언(임팩트): 둘 다 거짓이 아니라는 자조. 3 정확한 말: 마음은 너에게 머문다. 4 전환: 몸은 혼자 내일로 간다. [Pre-Chorus] 5 정확한 말: 잊으려 애쓴 적도 없이. 6 열어 두기: 어느새 여기까지 와서 훅으로 떨어짐. [Chorus] 7 훅·선언: 너 없이 살아지네. 8 모순: 다행인데 슬프다. 9 뒤집기: 계절은 미안한 줄 모르고 온다. 10 훅·고백: 너 없이 살아지네. [Verse 2] 11 새 뜻: 목소리부터 흐려진다. 12 정확한 말: 웃던 얼굴만 남는다. 13 전환: 크게 웃다 멈추는 순간. 14 질문: 누구에게 미안했던 걸까. [Pre-Chorus] 15~16 1절과 같음. [Chorus] 17~20 첫 후렴과 같음(훅 17, 20). [Bridge] 21 고백: 다 나으면 너를 잃을까 봐 두려웠다는 진심을 처음 말함. 22 고백: 그래서 일부러 아팠다는 인정. [Final Chorus] 23 훅. 24 뒤집기: 슬픈데 다행이다로 어순을 바꿔 받아들임. 25 전환: 계절을 반기는 마음. 26 훅. 훅 줄 번호: 7, 10, 17, 20, 23, 26 (총 6번).'
why: 헤어진 뒤 생각보다 잘 살아지는 순간의 다행과 서운함은 이별을 겪은 거의 모든 사람이 아는 기분이라 가장 넓습니다. '살아지네'가 '사라지네'로도 들려서, 설명 없이 살아남는 것과 지워지는 것이 한 낱말에 겹칩니다. 조사 노트의 '내릴 곳 지났네'는 지하철·철교 같은 장면에 기대야 뜻이 서기 때문에 추상 원칙에 맞지 않아 뺐습니다. 자우림처럼 반대 감정을 한 줄에 붙이고 풀지 않았고('다행인데 슬퍼'), 한로로처럼 마지막 후렴에서 어순만 뒤집어 결론을 냈습니다('슬픈데 다행이야'). 잔나비처럼 첫 줄의 큰 감정 옆에 몸의 말('배가 고파')을 붙여 신파를 덜어냈습니다. 제목은 부르는 순간 각자의 이별이 떠오르는 낱말 하나로 두었습니다.
share_line: 다 나으면 너를 잃을까 봐
