lyrics: |
  [Intro: Rhodes and bass]

  [Verse 1: intimate, Rhodes and bass]
  라디오에 그 동네 날씨가 나와
  기사님이 소리를 한 칸 올려
  나는 모르는 척 창밖을 봐
  서울 온 지 벌써 몇 년째야
  이사는 네 번이나 했는데
  아직 여기 사는 것 같지 않아

  [Pre-Chorus: soft build]
  너는 꼭 이맘때 전화를 해
  "너 언제 내려와"
  나는 또 웃고 말을 돌려

  [Chorus: groove opens, full band]
  이번 주말엔 내려갈까
  이번 주말엔 내려갈까
  아무 말 없이 기차 타고
  이번 주말엔 내려갈까
  (내려갈까)

  [Verse 2: funk guitar chops]
  금요일마다 표를 끊어
  일요일 밤엔 그걸 취소해
  일은 핑계고 나도 모르겠어
  베란다에 둔 화분이 또 죽었어
  거기선 뭐든 잘 자랐는데
  여긴 나만 겨우 버텨

  [Pre-Chorus: soft build]
  너는 요새 문자만 보내
  "올 거면 말해"
  나는 읽고 한참 그냥 둬

  [Chorus: full band, strings enter]
  이번 주말엔 내려갈까
  이번 주말엔 내려갈까
  아무 말 없이 기차 타고
  이번 주말엔 내려갈까
  (내려갈까)

  [Instrumental: Rhodes solo, bass groove]

  [Bridge: drums drop out, voice and Rhodes]
  막상 내려가면 이틀째부터
  여기 내 방이 생각나
  거기도 이제 내 집은 아닌데
  그걸 보는 게 무서웠나 봐
  그래도 너는 보고 싶다

  [Final Chorus: widest, strings and doubled vocal]
  이번 주말엔 내려갈까
  이번 주말엔 내려갈까
  역 앞에서 너 기다려 줘
  이번 주말엔 내려갈게
  (내려갈게)

  [Outro: Rhodes and bass fade]
  길은 아직 막히네
  라디오는 벌써 다음 곡이야

  [End]
