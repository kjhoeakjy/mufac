lyrics: |
  [Intro]

  [Verse 1: heavy riff, sparse drums]
  하늘에 그어진 줄 하나
  퇴근길 횡단보도에서
  다들 땅만 보는 사이
  나만 봤어 너 오는 거
  신호가 바뀌어도
  그 자리에 서 있었지
  기다린 건 아니고

  [Pre-Chorus: second guitar, toms build]
  무서울 줄 알았는데
  고개 들고 웃는 나
  어차피 오는 거라면

  [Chorus: full band, gang vocals]
  이왕 올 거면 와
  느려도 괜찮으니까
  (올 거면 와)
  이왕 올 거면 와
  오늘 밤 이 동네로

  [Verse 2: riff returns, handclaps]
  다음 날 하늘은 멀쩡하고
  출근 버스 줄 맨 뒤에서
  어젯밤은 농담이 되고
  위를 보는 건 나 하나
  너 지금 어디쯤이야
  창문 하나 열어 둔 밤
  기다린 건 아니고

  [Pre-Chorus: second guitar, toms build]
  무서울 줄 알았는데
  고개 들고 웃는 나
  어차피 오는 거라면

  [Chorus: full band, gang vocals]
  이왕 올 거면 와
  느려도 괜찮으니까
  (올 거면 와)
  이왕 올 거면 와
  오늘 밤 이 동네로

  [Instrumental: slow bluesy guitar solo]

  [Bridge: quiet, bass, clean guitar and voice]
  사실은 기다렸어
  뭐라도 와 주기를
  아무 일 없는 내일
  그게 제일 무서웠어

  [Final Chorus: biggest, crowd gang vocals]
  이왕 올 거면 와
  느려도 괜찮으니까
  (올 거면 와)
  이왕 올 거면 와
  못 오면 내가 갈게
  이왕 올 거면 와

  [Outro: one last ringing chord]
  그럼 내일 봐

  [End]
