title: 소행성
hook: 이왕 올 거면 와
theme: 어른
story: 피할 수 없는 일 앞에서 큰소리치지만, 사실은 아무 일 없는 내일이 더 무서웠던 직장인의 노래.
created: 2026-10-30 16:30
request:
  id: mvung39p
  idea: 운석
  genre: 락
  style: 느린데 신나는 락
style: Korean rock, slow heavy half-time stomp around 80 bpm, 70s hard rock swagger, fun and swinging. Male tenor, gritty chest voice with a little rasp, plain and unforced, sung slightly behind the beat, wry and sincere, sung in Korean, korean lyrics. Crunchy overdriven guitar riff and fat bass carry verse 1 over a big dry kick and snare, handclaps on the backbeat from verse 2. A second distorted guitar doubles the riff at the pre-chorus, drums build on toms. Chorus hits with full band, open power chords, gang vocals on the hook. Slow bluesy guitar solo before the bridge. Bridge drops to bass, one clean guitar and voice. Final chorus biggest and widest, crowd gang vocals, ends on one ringing chord. Live band in a room, natural reverb, warm tape. Cocky, tender, loose.
exclude: autotune, trap hi-hats, piano ballad
photo_query: man looking up evening sky crosswalk
image_prompt: A man in a loosened office shirt with a bag on his shoulder stands at a city crosswalk at dusk, seen from behind, looking up at a bright streak across the violet sky. Commuters around him look down. Glowing green crossing signal, warm streetlights, orange and purple tones, quietly amused mood.
title_kind: 후렴 문장
tempo: 느림
arc: '화법: 너에게 말하기. 너는 하늘에서 오는 운석이고, 듣는 사람에게는 자기한테 닥칠 무엇이든 된다. 기: 퇴근길 횡단보도에서 하늘에 그어진 줄을 혼자 보고 서 있다. 안 기다렸다고 우긴다. 승: 무서울 줄 알았는데 웃음이 나서 결국 이왕 올 거면 와라고 큰소리친다. 전: 다음 날이 되자 하늘은 멀쩡하고 어젯밤 일은 농담이 되고 월요일이 다시 온다. 그래도 창문을 열어 둔다. 브릿지에서 처음으로 진심을 말한다. 사실은 기다렸고, 정말 무서운 건 아무 일 없는 내일이었다. 결: 같은 후렴이 이제는 지루함에 지친 사람의 부탁으로 들린다. 다섯째 줄 오늘 밤 이 동네로가 못 오면 내가 갈게로 바뀌면서 기다리던 사람이 먼저 나서는 사람이 된다. 아웃트로 그럼 내일 봐로 김을 뺀다.'
line_plan: 'V1 1 사실: 하늘의 줄 하나(구체로 열기) / 2 사실: 퇴근길 횡단보도 / 3 관찰: 다들 땅만 봄 / 4 전환: 나만 봤어 / 5 사실: 신호가 바뀜 / 6 관찰: 그 자리에 서 있음 / 7 전환(리프레인): 기다린 건 아니라는 허세. Pre 8 전환: 무서울 줄 알았는데 / 9 관찰: 고개 들고 웃는 나 / 10 전환(열림): 어차피 오는 거라면. Chorus 11 훅 / 12 받침: 느려도 괜찮아 / 13 메아리 / 14 훅 / 15 받침: 오늘 밤 이 동네로(여백). V2 16 사실: 다음 날 멀쩡한 하늘(시간 바뀜) / 17 사실: 출근 버스 줄 맨 뒤 / 18 관찰: 큰일이 농담이 됨 / 19 관찰: 월요일은 또 월요일 / 20 전환: 너에게 직접 물음 / 21 관찰: 창문 열어 둔 밤 / 22 리프레인. Pre 23~25 반복. Chorus 26~30 반복(훅 26, 29). Instrumental. Bridge 31 전환: 사실은 기다렸어(처음 인정) / 32 사실: 뭐라도 와 주기를 / 33 관찰: 아무 일 없는 내일 / 34 감정 직접: 그게 제일 무서웠어. Final Chorus 35 훅 / 36 받침 / 37 메아리 / 38 훅 / 39 전환: 못 오면 내가 갈게(바뀐 줄) / 40 훅. Outro 41 생활 말: 그럼 내일 봐. 훅 전체 줄: 11, 14, 26, 29, 35, 38, 40 (7번) + 메아리 13, 28, 37.'
why: 이왕 올 거면 와는 일곱 음절이고 열린 모음으로 끝나서 떼창으로 늘여 부르기 좋다. 운석뿐 아니라 월요일, 통보, 이별처럼 누구에게나 닥치는 일에 그대로 꽂힌다. 크라잉넛의 원리대로 제목을 외칠 수 있는 한 덩이 말로 잡고, 절 끝마다 기다린 건 아니고라는 허세를 리프레인으로 박았다. 이 허세를 브릿지에서 사실은 기다렸어로 처음 뒤집는다. 마지막 후렴은 터치드처럼 한 줄만 바꿔 못 오면 내가 갈게로 화자의 변화를 보여 주고, 잔나비처럼 정점 뒤에는 그럼 내일 봐라는 생활 말로 내려온다. 제목은 훅의 앞부분을 그대로 가져온 반말 문장이라 부르는 순간 후렴이 떠오른다.
share_line: 아무 일 없는 내일
