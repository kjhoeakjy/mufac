title: 보호자 칸에 내 이름을 써요
hook: 보호자 칸에 내 이름을 써요
theme: 어른
story: 아빠 입원 수속 날, 접수대에서 처음으로 보호자 칸에 자기 이름을 쓰는 삼사십 대 자식이 부르는 노래.
