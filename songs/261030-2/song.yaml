title: 하얀
hook: 하얀 우산 아래
theme: 사랑
story: 좋아하는 사람 쪽으로 우산을 기울이는 사람이 자기 한쪽 어깨가 젖는 줄 알면서도 우산을 하나만 들고 다니는 이야기다.
created: 2026-10-30 16:38
request:
  id: mvunor0c
  title: 하얀
  idea: 우산
  genre: 팝
  style: 느낌있고 감각적인
style: Korean pop, sensual minimal R&B-pop, 2020s, around 96 bpm, smooth and laid-back. Female mezzo vocal, breathy and close, warm low register, slightly behind the beat, mature and sincere, sung in Korean, korean lyrics. Muted electric guitar plucks and a deep round sub bass carry verse 1 over soft rim clicks and finger snaps, lots of space. A warm synth pad and a light vocal double enter at the pre-chorus. Chorus opens into a full laid-back beat with soft stacked backing vocals on the hook. Bridge drops to guitar, pad and voice. Final chorus fullest and warmest, extra harmonies, short outro. Intimate, light plate reverb, cool, tender, unhurried.
exclude: autotune, trap hi-hats, brass
photo_query: white umbrella couple rain
image_prompt: A young woman seen from behind holds a white umbrella tilted toward a man beside her at a subway exit in evening rain. Her left shoulder is wet and her coat is beige. Soft blue-gray dusk light with warm streetlamp glow and wet pavement reflections create a quiet, tender, intimate mood.
title_kind: 지정
tempo: 중간
arc: '화법: 혼잣말(아무에게도 말하지 않고 중얼거리고, 너는 3인칭처럼 등장한다). 기: 우산은 하나만 들고 다닌다는 핑계와 비 오는 출구에서 우산을 펴는 순간을 보여 주고, 아직 감정은 말하지 않는다. 승: 같이 가자는 말 대신 손잡이를 기울이면 ''하얀 우산 아래, 젖는 건 내 왼쪽 어깨''라는 후렴이 온다. 전: 2절에서는 시간이 맑은 날로 바뀌어 비를 기다리는 사람이 된다. 브릿지에서 처음으로 ''현관에 우산 하나 더 있어''라는 거짓말을 인정하고 ''좋았어, 네 옆이''라고 직접 말한다. 결: 마지막 후렴에서 ''한 뼘 남은 자리''가 ''한 뼘도 없는 자리''로, ''젖는 건 내 왼쪽 어깨''가 ''반씩 젖는 두 어깨''로 바뀌어 상대가 다가왔음을 설명 없이 보여 준다. 아웃트로는 ''내일도 비 온대''로 끝난다.'
line_plan: '[Verse 1] 1 사실: 우산은 하나만 / 2 사실(핑계): 가방 크기 / 3 관찰: 비 소식에 웃는 사람 / 4 전환(자조): 그게 나 / 5 관찰: 비 오는 출구 앞에 멈춘 사람들 / 6 사실: 하늘 보는 네 옆얼굴 / 7·8 사실(동작 하나): 아무렇지 않게 우산을 편다. [Pre-Chorus] 9 사실: 같이 가자는 말 / 10 전환: 삼킨다 / 11 전환(열림, -면): 대신 손잡이만 기울이면. [Chorus] 12 훅 / 13 관찰: 한 뼘 남은 자리 / 14 관찰(공유 줄): 젖는 건 내 왼쪽 어깨 / 15 훅. [Verse 2] 16·17 새 사실: 맑은 날에도 가방 속 우산 / 18·19 질문과 대답 한 번: 비 오냐는 말에 혹시 몰라서라고 답함 / 20·21 관찰: 창이 흐려지면 떠오르는 얼굴 / 22·23 관찰: 오지 않는 비를 기다리는 저녁. [Pre-Chorus] 24~26은 9~11과 같다. [Chorus] 27 훅 / 28 / 29 / 30 훅. [Bridge] 31·32 전환(인정): 현관에 우산이 하나 더 있다 / 33·34 관찰: 비 그친 줄 알면서 접지 않고 걷던 길 / 35·36 진심(감정어 한 번): 젖어도 좋았어, 네 옆이. [Final Chorus] 37 훅 / 38 변화: 한 뼘도 없는 자리 / 39 변화: 반씩 젖는 두 어깨 / 40 훅. [Outro] 41 훅 / 42 생활 말: 내일도 비 온대. 훅은 12, 15, 27, 30, 37, 40, 41번 줄에 들어가 모두 7회다.'
why: 우산을 상대 쪽으로 기울이다 내 어깨만 젖는 경험은 거의 모든 사람이 한 번쯤 겪었습니다. 그래서 사건이 아니라 짝사랑의 태도로 넓게 받아들여질 후보로 0번을 골랐습니다. 제목이 단어 하나 '하얀'으로 정해져 있으므로, 이 낱말을 훅 첫머리에 두어 후렴이 시작될 때마다 제목이 들리게 했습니다. 감정의 이유는 '우산이 하나만 들어가서'처럼 사소하게 두었습니다(자우림). 감정어는 브릿지의 '좋았어' 한 번만 직접 말했습니다. 마지막 후렴은 두 줄만 바꿔 결론을 냈습니다. 한쪽 어깨만 젖던 장면이 반씩 젖는 두 어깨로 바뀌는데, 이는 한로로의 '한 글자 바꿔 결론 내기'에서 가져왔습니다. 끝은 '내일도 비 온대'라는 생활 말로 내려왔습니다(잔나비). 참고로 조사 노트의 정류장·버스 가사는 한 장면을 따라가는 상황극이라 쓰지 않았습니다. 대신 여러 날의 비와 맑은 날을 스쳐 가게 했습니다.
share_line: 젖는 건 내 왼쪽 어깨
