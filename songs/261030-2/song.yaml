why: 하늘 사진을 보내 본 적 없는 사람은 거의 없고, 그 사진이 무슨 뜻인지 다들 알기 때문에 가장 넓게 따라 부를 수 있는 기분이다. 1절은 잔나비식으로 고백 전에 자기를 낮추는 한 줄(나 원래 이런 사람 아냐)로 열고, 마지막 후렴은 한로로처럼 한 줄만 바꿔 '딴 뜻은 없어 진짜'를 '이번엔 뜻이 있어'로 뒤집어 결말을 설명하지 않고 낸다. 제목은 말달리자처럼 외칠 수 있는 한 덩이 말이 강해서 후렴 첫 문장을 그대로 썼다. 「목성」은 '기쁨을 가져오는 자'의 선율이자 맹세의 찬송가였는데, 그 크고 넓은 맹세의 멜로디에 하늘 사진 한 장이라는 아주 작은 고백을 얹어, 같은 하늘을 올려다보는 몸짓을 능청과 진심으로 잇는다.
