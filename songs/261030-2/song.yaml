lyrics: |
  [Intro]

  [Verse 1]
  가정통신문 맨 아래 칸
  아빠 글씨는 늘 칸을 넘었죠
  뒷장까지 꾹 배어 있었죠

  [Pre-Chorus]
  접수대 앞에 서서
  펜을 몇 번 쥐었다 놔요

  [Chorus]
  보호자 칸에 내 이름을 써요
  아빠랑 나 자리가 바뀌었어요
  괜찮다는 말은 이제 내가 할게요
  아빠는 그냥 누워 있어요

  [Verse 2]
  환자복 소매 한 뼘 남아
  두 번을 접어서 올려 드렸죠
  누워서도 내 출근을 묻죠

  [Pre-Chorus]
  아빤 괜찮다 그 말
  이번엔 안 속을 거예요

  [Chorus]
  보호자 칸에 내 이름을 써요
  아빠랑 나 자리가 바뀌었어요
  괜찮다는 말은 이제 내가 할게요
  아빠는 그냥 누워 있어요
  (내가 여기 있을게요)

  [Bridge]
  내 글씨는 자꾸 작아져요
  칸이 이렇게 넓었었나요
  그래서 꾹꾹 눌러 써요
  뒷장까지 남도록요

  [Final Chorus]
  보호자 칸에 내 이름을 써요
  아빠랑 나 자리가 바뀌었어요
  퇴원하는 날 그 종이에도
  내 이름 쓰고 같이 가요
  (같이 집에 가요)

  [Outro]
  보호자 칸에 내 이름을 써요
  아빠 이름 바로 밑에요
