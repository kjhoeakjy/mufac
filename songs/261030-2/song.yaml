    내일 또 오긴 와도 오늘은 퇴근이다

    (어허 퇴근이다)


    원곡 이야기

    「터키 행진곡」은 모차르트가 1783년 무렵 쓴 피아노 소나타 11번의 3악장으로, 원래 이름은 ''론도 알라 투르카''입니다. 당시 빈에서는 오스만 군악대의 북과 심벌즈 소리가 유행이었고, 모차르트는 그 쿵짝거리는 걸음을 피아노 하나로 흉내 냈습니다. 피아노 학원과 휴대전화 벨소리로 수없이 울려 온 이 선율의 또박또박 걷는 박자를, 이 노래는 일을 마치고 문을 나서는 퇴근길 발걸음으로 다시 읽었습니다.

    원곡 터키 행진곡 · 볼프강 아마데우스 모차르트 (1783), 저작권이 소멸된 곡입니다.


