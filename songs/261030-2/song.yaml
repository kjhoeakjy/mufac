image_prompt: A young woman in a beige coat seen from the side, sitting by a bus window at night, holding her phone with the screen dimmed, a folded wet umbrella at her feet. Rain streaks on the glass, blurred warm city lights outside. Soft blue and amber tones, quiet and wistful 80s city pop mood.
title_kind: 지정
tempo: 느림
arc: '화법: 너에게 속으로 하는 말(실제로 전하지 않는 말). 기: 네 사진이 바뀐 걸 먼저 알아채고, 네 동네에 비가 오면 네 우산부터 걱정한다. 감정은 아직 말하지 않는다. 승: 묻지도 못하면서 대답은 듣고 싶어서 ''거짓말이라도 해줘, 속는 건 내가 할게''라고 부탁한다. 전: 2절에서는 내가 친구들에게 잘 지낸다는 거짓말을 하는 쪽이 된다. 브릿지에서 처음으로 ''보고 싶다''를 말하고, 이 말은 하얗지 않아서 너에게는 못 한다고 인정한다. 결: 마지막 후렴의 셋째 줄과 다섯째 줄이 ''하얀 거짓말은 나도 할게 / 나는 잘 지낸다고''로 바뀌어, 부탁하던 사람이 거짓말을 해 주는 사람이 된다. 아웃트로는 ''잘 지내'' 한마디로 끝난다.'
line_plan: 'V1-1 관찰: 사진 바뀐 걸 제일 먼저 앎 / V1-2 관찰: 확대했다가 얼른 내림 / V1-3 새 사실: 옆에 선 사람 / V1-4 전환: 안 궁금한 걸로 함 / V1-5 관찰: 네 동네 비 소식 / V1-6 관찰: 네 우산 걱정 / V1-7 전환: 정작 내 우산은 두고 나감(자조 한 번) / Pre-1 사실: 어떻게 지내냐는 말 / Pre-2 전환: 묻지도 못함 / Pre-3 관찰: 대답은 듣고 싶은 밤 / Ch: 하얀 거짓말이라도 해줘 + 너도 내 생각 했다고 + 속는 건 내가 할게 / V2-1 새 사실: 친구들이 네 이름을 꺼냄 / V2-2 관찰: 먼저 웃으며 잔을 듦 / V2-3~4 전환: 잘 지낸다는 말이 쉽게 나옴(이번엔 내가 거짓말함) / V2-5~6 관찰: 그런 날은 집에 가는 길이 길어짐 / V2-7 관찰: 지운 번호를 손이 기억함 / Br-1 전환: 아무에게도 안 한 말 / Br-2 인정: 잘 지낸다던 말은 거짓말 / Br-3 진심: 보고 싶다 / Br-4~5 전환: 이 말은 하얗지 않아서 너한테는 못 함 / FC: 3·5줄을 ''하얀 거짓말은 나도 할게 / 나는 잘 지낸다고''로 바꿈 / Outro: 잘 지내'
why: 연락은 안 하면서도 상대가 내 생각을 했는지 궁금한 마음은 이별을 겪은 거의 모든 사람이 안다. 그래서 0번을 골랐다. 시티팝은 느린 호흡에서 담담하게 부탁하는 말이 가장 잘 산다. 제목이 '하얀'으로 정해져 있어 단어 하나 형태를 그대로 두었고, 이 단어는 후렴의 '하얀 거짓말'과 브릿지의 '하얗지가 않아서'에서 두 번 다른 뜻으로 불린다. 자우림의 '반대 감정을 한 줄에 붙이고 설명하지 않는다'는 원리에서 '속는 건 내가 할게'를 가져왔다. 한로로의 '마지막 후렴은 조금만 바꿔 결론을 낸다'는 원리로, 처음에 거짓말을 해 달라던 사람이 마지막에는 스스로 '잘 지낸다'는 거짓말을 하게 했다.
share_line: 속는 건 내가 할게
