  description: '일은 남아도 몸은 이미 퇴근한 모든 직장인에게 바치는 트로트 「퇴근」.

    모차르트 「터키 행진곡」 선율 위에서 다 같이 외쳐 보세요, 퇴근이다 퇴근이야.


    퇴근


