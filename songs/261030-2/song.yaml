classic:
  id: rondo_alla_turca
  name: 터키 행진곡
  composer: 볼프강 아마데우스 모차르트
  year: 1783
  en: Mozart's Turkish March (Rondo alla Turca)
  reason: 트로트 「퇴근」의 태도는 일을 마치고 가방을 챙겨 나서는 순간의 신나는 해방감이라, 슬픈 사연을 끌어올 필요 없이 밝고 힘 있는 원곡이 맞다. 모차르트 소나타 11번(1783년)의 3악장 「터키 행진곡」은 당시 빈에서 유행하던 터키 군악대풍 리듬을 피아노로 흉내 낸 곡이다. 군악대처럼 박자를 또박또박 밟는 느낌이 퇴근길 종종걸음과 이어지고, 트로트의 뽕짝 박자와도 결이 잘 맞는다. 피아노 학원과 휴대전화 벨소리에 셀 수 없이 쓰여서 첫 소절만 들려도 많은 사람이 바로 알아듣고, 후렴을 그대로 따라 부를 수 있다. 앞서 쓴 「환희의 송가」는 베토벤의 합창곡이고 이 곡은 모차르트의 경쾌한 행진곡이라 원곡이 겹치지 않으며, 줄 3개짜리 후렴이 트로트의 꺾는 호흡에도 알맞다.
  note: 「터키 행진곡」은 모차르트가 1783년 무렵 쓴 피아노 소나타 11번의 3악장으로, 원래 이름은 '론도 알라 투르카'입니다. 당시 빈에서는 오스만 군악대의 북과 심벌즈 소리가 유행이었고, 모차르트는 그 쿵짝거리는 걸음을 피아노 하나로 흉내 냈습니다. 피아노 학원과 휴대전화 벨소리로 수없이 울려 온 이 선율의 또박또박 걷는 박자를, 이 노래는 일을 마치고 문을 나서는 퇴근길 발걸음으로 다시 읽었습니다.
  instrument: piano
