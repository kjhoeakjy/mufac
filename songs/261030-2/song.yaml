polish:
- '삼켜 버리고 → 끝내 못 하고 (두 Pre-Chorus 모두): ''말을 삼키다''는 닳은 문어적 표현이라 소리 내어 할 법한 말로 바꿈'
- '창밖이 흐려지면 → 하늘만 흐려져도: 날씨만 있는 줄이라, 다음 줄과 이어져 ''흐리기만 해도 네 생각부터 한다''는 사람의 반응을 담도록 바꿈'
- '먼저 떠오르는 얼굴 → 네 퇴근 시간부터: ''떠오르는 얼굴''은 닳은 감성 표현이라 ''흐리면 네 퇴근 시간부터 챙긴다''는 구체적인 관찰로 바꿈. 조사로 끊어 명사형 줄 끝도 늘림'
- '나머지 줄은 유지: 후렴 훅(하얀 우산 아래)이 첫 줄과 끝 줄에 있고 제목을 담음. 브릿지에서 ''우산 하나 더 있어''라는 처음 하는 고백으로 곡이 뒤집히고, 마지막 후렴은 두 줄이 바뀌어 다른 뜻으로 들리므로 구조는 손대지 않음'
