why: 「퇴근」이라는 정해진 제목을 후렴 첫머리에서 두 번 겹쳐 외치게 했다. 크라잉넛처럼 외칠 수 있는 한 덩이 말과 4·4 율격을 쓰고, 술탄 오브 더 디스코처럼 허세(아무도 날 못 잡아) 바로 뒤에 초라한 사실(내일 또 오긴 와도)을 놓아 웃음을 만들었다. 터키 행진곡은 빈 사람들이 군악대 북소리를 흉내 내며 즐기던 경쾌한 곡이라, 박자를 또박또박 밟는 선율이 퇴근길 종종걸음과 트로트 2박에 그대로 얹힌다. 후렴은 줄마다 14음절에 맞추고 긴 음은 아·야·오로 끝내 꺾기와 떼창이 쉽게 했다. 제목은 지정어 그대로인 단어 하나라서 듣는 사람마다 자기 회사, 자기 시계를 떠올릴 수 있다.
