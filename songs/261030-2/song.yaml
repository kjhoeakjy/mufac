style: Korean city pop, slow late-80s groove, around 78 bpm, laid-back and steady. Female mezzo vocal, warm and clean with a little breath, sung slightly behind the beat, mature and sincere, sung in Korean, korean lyrics. Rhodes electric piano carries verse 1 with round fretless bass, soft live drums with rim clicks enter at the pre-chorus, clean chorused guitar adds muted funk licks from the first chorus, analog synth pads and light strings join at the second chorus, short clean guitar solo before the bridge. Drops to voice and Rhodes at the bridge, fullest and warmest at the final chorus, short quiet outro. Live band in a room, natural reverb, tender, unhurried, late night.
exclude: brass section, autotune, trap hi-hats
