lyrics: |
  [Intro]

  [Verse 1: sparse, Rhodes and bass]
  네 사진이 바뀐 걸 제일 먼저 알고
  크게 눌러 봤다가 얼른 내렸지
  옆에 선 사람이 누군지는
  안 궁금한 걸로 하기로 했다
  날씨 앱엔 아직 네 동네가 있고
  비 온다는 날엔 우산 챙겼을까 하다가
  내 우산은 두고 나오네

  [Pre-Chorus: drums enter softly]
  어떻게 지내냐고
  묻지도 못할 거면서
  대답은 듣고 싶은 밤

  [Chorus: full band, laid-back]
  하얀 거짓말이라도 해줘
  너도 가끔 내 생각 했다고
  하얀 거짓말이라도 해줘
  (거짓말이라도)
  속는 건 내가 할게

  [Verse 2: groove settles in]
  친구들이 네 이름을 꺼내면
  나는 먼저 웃으면서 잔을 들고
  잘 지낸다는 말은
  생각보다 쉽게 나오더라
  그 말을 하고 온 밤에는
  한 정거장 먼저 내려서 걷고
  지운 번호를 끝자리까지 누르다 마네

  [Pre-Chorus: drums enter softly]
  어떻게 지내냐고
  묻지도 못할 거면서
  대답은 듣고 싶은 밤

  [Chorus: full band, strings join]
  하얀 거짓말이라도 해줘
  너도 가끔 내 생각 했다고
  하얀 거짓말이라도 해줘
  (거짓말이라도)
  속는 건 내가 할게

  [Instrumental: clean guitar solo]

  [Bridge: quiet, voice and Rhodes]
  아무한테도 안 한 말인데
  잘 지낸단 말은 다 거짓말이었고
  보고 싶다
  이 말은 하얗지가 않아서
  너한테는 못 하겠다

  [Final Chorus: warmest, full band]
  하얀 거짓말이라도 해줘
  너도 가끔 내 생각 했다고
  하얀 거짓말은 나도 할게
  (거짓말이라도)
  나는 잘 지낸다고

  [Outro: Rhodes only]
  잘 지내

  [End]
