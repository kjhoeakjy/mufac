lyrics: |
  [Intro]

  [Verse 1: light groove, Rhodes and bass]
  구름이 오늘따라 높다
  몇 주 내내 낮게 깔리더니
  우산은 현관에 두고 나와도
  아무도 뭐라 안 하는 날
  젖은 운동화가 다 마른 것도
  오늘에서야 알았네

  [Pre-Chorus: build, funk guitar enters]
  누가 네 얘길 꺼내도
  웃으면서 넘어가는 걸 보니

  [Chorus: full groove, handclaps]
  보송보송 요즘은 보송보송
  비 온 게 언제였나
  (언제였나)
  보송보송 요즘은 보송보송
  구름만 천천히 가네

  [Verse 2: groove, synth strings softly]
  네 동네에도 해가 났을까
  거기도 비가 오래 왔다던데
  너도 우산 없이 나갔으면
  그건 좀 좋겠다 싶었다
  연락할 일은 없겠지만
  그 정도는 바라도 되잖아

  [Pre-Chorus: build, funk guitar]
  누가 네 얘길 꺼내도
  웃으면서 넘어가는 걸 보니

  [Chorus: full groove, handclaps]
  보송보송 요즘은 보송보송
  비 온 게 언제였나
  (언제였나)
  보송보송 요즘은 보송보송
  구름만 천천히 가네

  [Bridge: quiet, Rhodes and voice]
  사실 밤에는 가끔 또 와
  네 생각 나는 날엔 베개가 좀 젖고
  보고 싶다 한 번 말하고 나면
  아침엔 또 말라 있더라
  몇 번은 더 젖고 마르겠지

  [Final Chorus: widest, full band and strings]
  보송보송 요즘은 보송보송
  비 와도 금방 마르네
  (금방 마르네)
  보송보송 요즘은 보송보송
  구름만 천천히 가네

  [Outro: Rhodes, fade]
  우산은 오늘도 현관에 두고

  [End]
