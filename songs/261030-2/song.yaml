classic:
  id: jupiter
  name: 목성
  composer: 구스타브 홀스트
  year: 1916
  reason: '''하늘''이라는 열쇠말에 가장 곧게 닿는 원곡은 하늘의 행성을 주제로 한 홀스트의 「행성」입니다. 그 가운데 「목성, 기쁨을 가져오는 자」의 가운데 선율은 넓고 느리게 솟아올라, 고개를 들어 하늘을 올려다보는 몸짓 그대로의 음악입니다. 홀스트는 1차 대전이 한창이던 1916년에 이 곡을 썼고, 1921년에는 같은 선율에 "내 조국이여, 그대에게 맹세하노라"라는 시를 붙여 찬송가로 만들었습니다. 그래서 어두운 시대에도 함께 올려다보며 다짐하는 노래라는 성격이 처음부터 이 선율 안에 들어 있습니다. 다이애나 비의 결혼식과 장례식에서 모두 불렸고, 영국에서는 누구나 따라 부르는 곡이라 첫 소절만 들어도 알아듣는 힘이 큽니다. 앞서 만든 곡이 하늘 너머의 엄마에게 건네는 조용한 안부였으니, 이번에는 같은 하늘 아래 함께 서서 앞을 보는 밝고 넓은 다짐의 노래로 방향을 바꾸기에 알맞습니다.'
  note: 이 노래의 후렴은 구스타브 홀스트가 1차 대전 무렵 쓴 관현악 모음곡 「행성」 중 「목성, 기쁨을 가져오는 자」의 가운데 선율입니다. 홀스트는 1921년 이 선율에 시를 붙여 찬송가로 만들었고, 그 선율에는 그가 오래 살던 마을 이름 「Thaxted」가 붙었습니다. 영국에서는 결혼식과 추모식에서 두루 불리며 함께 올려다보고 다짐하는 노래가 되었습니다. 그 넓은 맹세의 선율 위에, 이번에는 하늘 사진 한 장을 보내는 작은 마음을 얹었습니다.
