lyrics: |
  [Intro: Rhodes chords and finger snaps]

  [Verse 1: half beat, bass on long notes]
  I'm all fire and you're all rain,
  And everybody swore it'd end the same,
  Said you'd put me out or I'd burn you down,
  Guess they left too soon to see us now.

  [Pre-Chorus: 16th hi-hats enter, falling line]
  Now I can't tell where I stop and you start,
  And I don't wanna know

  [Chorus: full beat, stacked harmonies]
  You're my blue, I'm your red, and we make purple,
  Something neither one of us could make alone,
  And I don't wanna be just red again,
  Baby, we make purple.

  [Verse 2: muted guitar answers the voice]
  Don't get me wrong, we still collide,
  Some days you go cold and I go wild,
  And love leaves a bruise sometimes, I know,
  But even the bruise is a color we own.

  [Pre-Chorus: 16th hi-hats, falling line]
  Now I can't tell where I stop and you start,
  And I don't wanna know

  [Chorus: full beat, stacked harmonies]
  You're my blue, I'm your red, and we make purple,
  Something neither one of us could make alone,
  And I don't wanna be just red again,
  Baby, we make purple.

  [Instrumental: Rhodes solo over the groove]

  [Bridge: beat drops, Rhodes and voice, falsetto]
  I thought I'd only ever be the color I was born,
  'Til you poured your soul in mine and made me something more.

  [Final Chorus: female harmony joins, ad-libs, widest]
  You're my blue, I'm your red, and we make purple,
  Something neither one of us could make alone,
  And we ain't ever going back to red and blue,
  Baby, we make purple.

  [Outro: Rhodes loop fading]

  [End]
