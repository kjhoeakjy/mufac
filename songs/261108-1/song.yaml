title: 지난 일
hook: 다 지난 일이에요
theme: 아픔
story: 누가 그 사람 얘기를 꺼내면 웃으며 지난 일이라고 말하지만, 혼자 남으면 보고 싶은 사람이 부르는 혼잣말.
created: 2026-11-08 11:07
request: {}
lang: ko
instrumental: false
sound_plan: 따뜻한 장조에 maj7과 9 코드를 쓰는 보사노바 재즈 팝이고, 빠르기는 88bpm 안팎으로 느긋하게 둡니다. 프리코러스에서 단조 쪽으로 한 번 쓸쓸하게 꺾습니다. 리듬은 림 클릭과 셰이커로 가볍게 시작합니다. 후렴부터 브러시 드럼이 들어오고, 킥은 거의 들리지 않게 둡니다. 업라이트 베이스는 투필로 뿌리음을 지키다가 브릿지에서 목소리와 단둘이 남습니다. 화성은 나일론 기타 컴핑이 끌고, 피아노는 프리코러스부터 코드를 두텁게 받칩니다. 멜로디는 절에서 좁은 음역으로 말하듯 가고, 프리코러스에서는 같은 음을 반복하며 올라갑니다. 후렴 첫 음 '다'에서 위로 도약하고, '-에요'의 끝 모음을 길게 끕니다. 마지막 후렴은 같은 멜로디에 낮은 하모니만 더합니다. 보컬은 낮고 허스키한 여성 알토로, 마이크에 가깝게 붙어 박자 뒤로 느긋하게 끌며 꾸밈없이 웃음 섞인 톤으로 부릅니다. 2절에서는 뮤트 트럼펫이 보컬 줄 끝에 대답하고, 두 번째 후렴 뒤에 피아노 솔로 8마디를 둡니다. 마지막 후렴에서는 트럼펫이 대선율을 붙여 가장 따뜻해집니다. 공간은 작은 재즈 클럽으로, 테이프 질감을 살리고 보컬은 거의 드라이하게 둡니다. 끝은 피아노 혼자 루바토로 늦추다가 해결되지 않은 텐션 코드에서 멈춥니다.
style: 'Korean jazz pop, bossa nova, 2000s, relaxed 88 bpm, warm maj7 chords, bittersweet minor turn in the pre-chorus. Warm husky female alto, low, close to the mic, laid back behind the beat, sung in Korean, korean lyrics. Intro: nylon guitar and piano. Verse 1: nylon guitar, upright bass in two, rim click and shaker, narrow conversational melody. Pre-chorus: piano thickens, rising repeated note. Chorus: brushed drums enter, upward leap on the first word, long held last note. Verse 2 adds muted trumpet answering the voice. Piano solo after chorus two. Bridge: voice and upright bass alone. Final chorus warmest, trumpet countermelody, low harmony. Outro: rubato piano, ends on a tension chord. Small jazz club, tape warmth. Wistful, tender, quietly smiling.'
exclude: synth pads, autotune, belting
photo_query: woman jazz bar night
image_prompt: A woman in her thirties in a beige cardigan sits sideways at a small jazz bar counter, half-smiling as a friend beside her talks, a glass of water in her hand. Warm amber lamplight, a rain-blurred window behind, muted brown and navy tones, wistful and quiet.
short_scenes:
- The same woman in the beige cardigan laughs softly at the jazz bar counter with her head tilted, amber lights glowing and her friend's shoulder blurred beside her.
- Close-up of her hand loosely holding the water glass on the wooden counter, a fingertip tracing the rim, warm amber light and navy shadows.
- Her half-finished glass and an empty stool on the counter after she has left, the door closing behind a beige sleeve, amber light dimming.
title_kind: 짧은 명사구
tempo: 중간
arc: '화법: 혼잣말(전곡 해요체, 상대는 ''그 사람''으로 떠올림). 기: 잊었냐고 물으면 대답 대신 웃는 지금. 지난 이름은 부를수록 가벼워진다고 스스로 믿는다. 승: 입버릇처럼 꺼내는 한 문장 ''다 지난 일이에요''. 보고 싶은 건 비밀로 두고, 지난 일이 왜 돌아오는지 묻는다. 전: 2절은 상대 쪽으로 시점이 넘어간다. 그 사람도 같은 대답을 하며, 닮은 거짓말로 서로를 놓아준다. 브릿지에서 처음으로 비밀을 말한다. ''보고 싶어요'', 그리고 그 말마저 지나가게 둔다. 결: 같은 후렴이지만 고백 뒤라서 ''보고 싶은 건 비밀이죠''가 쓴웃음으로 들린다. 마지막 줄 ''지난 일은 왜 돌아와요''가 ''돌아와도 웃어 줄게요''로 바뀐다. 1절의 회피하던 웃음이 받아들이는 웃음이 된다. 아웃트로는 가사 없이 피아노가 텐션 코드로 멈춘다.'
line_plan: '[Verse 1] 1 질문(던져진 물음): 사람들이 잊었냐고 묻는 자리 / 2 선언(정확한 말): 대답보다 웃는 게 쉽다 / 3 새 뜻: 지나간 계절의 이름이라는 화제를 연다 / 4 새 뜻: 부를수록 가벼워진다고 믿는다. [Pre-Chorus] 5 새 뜻: 입에 익은 대답 / 6 전환: 오늘 밤에도 그 대답을 꺼낸다(열린 끝 -는데). [Chorus] 7 선언, 훅 / 8 고백·뒤집기: 보고 싶은 건 비밀 / 9 선언, 훅 / 10 질문: 지난 일이 왜 돌아오나(제목 낱말 포함). [Verse 2] 11 전환: 시점이 그 사람에게로 / 12 정확한 말: 그 사람도 같은 대답을 하리라는 것 / 13 새 뜻: 둘이 닮은 거짓말 / 14 정확한 말: 그 거짓말로 서로를 놓아준다. [Pre-Chorus] 15·16은 5·6과 같음. [Chorus] 17·19 훅, 18·20은 8·10과 같음. [Bridge] 21 고백: 비밀이던 ''보고 싶어요''를 처음 직접 말함 / 22 받아들임: 이 말마저 지나가게 둔다. [Final Chorus] 23·25 훅, 24는 같은 글자이나 고백 뒤라 다르게 들림 / 26 뒤집기: 돌아와도 웃어 주겠다. 훅이 들어가는 줄은 7, 9, 17, 19, 23, 25로 모두 6회이고, 제목 낱말 ''지난 일''은 10, 20에 더 나와 총 8회.'
why: '''다 지난 일이에요''는 누구나 한 번쯤 웃으며 해 본 말이고, 그 말이 거짓이라는 것도 모두 압니다. 그래서 가장 많은 사람이 자기 얘기로 받을 훅이라 골랐습니다. 자우림이 ''미안해 널 미워해''에서 그랬듯 모순을 나란히 두고 설명하지 않았고, 어두운 마음은 공손한 해요체와 가벼운 보사노바로 감쌌습니다. 극동아시아타이거즈처럼 슬픔을 부정하는 말로 드러냈고, 한로로처럼 마지막 후렴은 한 줄만 바꿔 결론을 냈습니다. 후렴에서 감춰 둔 ''보고 싶은 건 비밀''을 브릿지에서 처음 직접 말하도록 짰습니다. ''-에요''로 끝나는 제목은 쓰지 않는다는 규칙이 있어서, 제목은 훅 안의 명사구 ''지난 일''로 정했습니다.'
share_line: 보고 싶은 건 비밀이죠
