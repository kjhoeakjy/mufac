polish:
- '얼음 같은 그 말투도 → 그 꽁한 말투도: ''~같은'' 비유를 지움. 1절의 ''꽁꽁''과 이어지는 입말로 바꿨고, ''줄줄''과 붙어 능청이 산다.'
- '나머지 줄은 그대로 둠: 이미 짧은 입말이고 자조(망했어, 쥐뿔도), 엉뚱한 딴소리(호빵), 비틀린 끝맺음(그때 보자)이 있어 점검표에 걸리지 않음. 제목도 설명문이 아니라서 유지.'
