  [Pre-Chorus - drums build]
  아는 건 쥐뿔도 없는데
  이거 하나는 알아

  [Chorus - wide, airy harmony, singalong]
  봄 오면 다 녹아 다 녹아
  눈사람도 원래 물이야
  (워어 워어)
  봄 오면 다 녹아 다 녹아

