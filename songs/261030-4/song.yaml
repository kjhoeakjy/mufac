request:
  id: mvul0ybl
  idea: 퇴근
  genre: 트로트
style: Korean trot, mid-tempo 2000s trot with a steady two-beat bounce, around 100 bpm, warm and unhurried. Male baritone, plain and warm, slightly husky, classic trot kkeokgi bends only on long phrase ends, mature and sincere, sung in Korean, korean lyrics. Accordion and clean twangy electric guitar carry verse 1 over walking bass and light live drums. A soft alto sax answers the vocal from the pre-chorus. Chorus opens with strings and the full two-beat groove, easy to hum along. Short sax solo before the bridge, then the bridge drops to accordion and voice. Final chorus is the fullest, strings wide, held last note, short accordion outro. Live band in a room, natural reverb, homey, wry, tender.
exclude: autotune, electronic dance beat, gang vocals
photo_query: office worker walking home dusk
image_prompt: An office worker in a loose shirt and jacket, seen from behind, walks out of a glass office building at dusk, ID badge lanyard tucked half into a pocket, bag on one shoulder. Warm streetlights, orange and blue evening tones, quiet relief.
title_kind: 후렴 문장
tempo: 중간
arc: '기: 화법은 혼잣말. 작게 인사하고 회사 문을 나서 사원증을 감추는 순간, 아직 감정은 말하지 않는다. 승: 못다 한 일을 두고 발이 먼저 길을 알 때 ''집으로 가네''가 터진다. 전: 2절은 신입 시절과 그만두고 바닷가로 간 동기 너로 시간과 상대가 바뀌고, 브릿지에서 처음으로 나도 사표를 써 서랍에 넣어 뒀고 네가 부럽다고 털어놓는다. 결: 마지막 후렴의 ''꺼진 불은 등 뒤에 두고''가 ''서랍 속 사표 그대로 두고''로, ''하루 중에 제일 좋은 길''이 ''내일 아침 거꾸로 올 길''로 바뀐다. 아웃트로는 현관 번호를 누르는 손 하나로 도착만 보여 준다.'
line_plan: '[Verse 1] 1 사실: 먼저 간다는 인사 / 2 관찰: 들릴 듯 말 듯 작게 / 3 전환: 회전문 밖으로 / 4 관찰: 사원증부터 감춤 / 5 관찰: 숨이 길어짐 / 6 리프레인: 아침엔 못 본 길. [Pre-Chorus] 7 사실: 못다 한 일은 두고 / 8 사실: 전화기는 가방 밑에 / 9 전환(열림): 발이 먼저 아는데. [Chorus] 10 훅×2 / 11 관찰: 불러도 못 들은 척 / 12 사실: 꺼진 불을 등 뒤에 / 13 감정 직접: 제일 좋은 길 / 14 훅. [Verse 2] 15 사실: 처음 일 배우던 해 / 16 사실: 불 끄는 건 나였지 / 17 사실(상대 바뀜): 같이 남던 동기 너 / 18 새 사실: 바닷가에 가게 냄 / 19 관찰: 축하 한 줄 썼다 지움 / 20 리프레인. [Pre-Chorus] 21~23 반복. [Chorus] 24 훅×2, 25~27, 28 훅. [Bridge] 29 진심: 나도 사표를 씀 / 30 사실: 서랍 깊숙이 / 31 관찰: 믿고 버티는 건지 / 32 전환(반대 대구): 못 내서 버티는 건지 / 33 감정 직접: 부럽더라. [Final Chorus] 34 훅×2 / 35 유지 / 36 변경: 사표 그대로 두고 / 37 변경: 내일 거꾸로 올 길 / 38 훅 / 39 훅×2. [Outro] 40~41 관찰: 현관 번호 누르는 손이 제일 빠름. 훅 줄: 10,14,24,28,34,38,39 → 총 11회.'
why: '''집으로 가네''는 다섯 음절에 끝이 모음으로 열려 있어 트로트 꺾기로 늘여 부르기 좋고, 설명 없이 모든 직장인이 자기 얘기로 받는다. 이전 곡 ''여섯 시다''가 같은 퇴근을 우리의 구호로 외쳤으니, 이번에는 혼잣말 화법과 담담한 ''-네'' 평서로 거리를 뒀다. 잔나비의 반대말 대구와 크라잉넛의 우기는 위로를 브릿지(''믿고 버티는 건지 / 못 내서 버티는 건지'')에 가져왔고, 한로로식으로 마지막 후렴에서는 두 줄만 바꿔 ''제일 좋은 길''이 ''내일 아침 거꾸로 올 길''로 들리게 했다. 제목은 후렴 문장 그대로다. 극동아시아타이거즈의 ''-네'' 제목처럼, 부르는 순간 곧 제목이 되게 했다.'
share_line: 잘됐다 한 줄 쓰다 지웠지
