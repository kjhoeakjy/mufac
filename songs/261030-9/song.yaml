title: 사랑이!
hook: 사랑이! 뭐라고
theme: 사랑
story: 별거 아니라고 우기다가 결국 혼자 소리를 지르고 마는, 막 좋아지기 시작한 사람의 혼잣말
created: 2026-10-30 18:00
request:
  id: mvuqnhl6
  title: 사랑이!
  genre: 락
  style: 조용한 부분이랑 시끄러운 부분 차이 명확. 귀여운 목소리
sound_plan: 밝은 장조에 프리코러스에서 살짝 단조로 기우는 화성, 114bpm 안팎의 90년대 얼터너티브 락이다. 핵심은 조용함과 시끄러움의 대비다. 1절은 클린 일렉 기타 아르페지오 하나, 근음만 짚는 둥근 베이스, 림샷만으로 거의 속삭이듯 가고, 줄 사이에 여백을 둔다. 프리코러스에서 퍼즈 걸린 두 번째 기타가 부풀어 오르고 탐 롤이 같은 음을 반복하며 밀어 올린다. 후렴은 좌우 디스토션 기타 두 대의 벽, 열린 크래시와 두꺼운 스네어, 리프에 붙은 피크 베이스로 한꺼번에 터진다. 보컬은 귀엽고 가벼운 여성 소프라노로, '사랑이!'에서 위로 도약해 짧게 끊고 '뭐라고'는 작게 떨어뜨린 뒤 마지막 낱말을 길게 끈다. 후렴만 더블링한다. 2절은 다시 조용해지고 글로켄슈필이 기타를 겹치며 리드 기타 모티프가 보컬에 답한다. 두 번째 후렴 뒤 짧고 지저분한 기타 굉음이 터졌다가 갑자기 멈추고, 브릿지는 클린 기타 하나와 말하듯 가까운 목소리만 남는다. 마지막 후렴은 옥타브 위 화음까지 더해 가장 크게 가고, 딱 끊은 뒤 마지막 한 줄을 목소리 혼자 작게 부르고 끝낸다. 작은 방에서 밴드가 함께 친 소리, 룸 마이크, 테이프 질감.
style: 'Korean rock, 90s alternative quiet-loud dynamics, around 114 bpm, bright major key with a bittersweet minor turn in the pre-chorus. Female soprano lead, cute and girlish, light and bright, a little breathy in verses, clear and unforced, sung in Korean, korean lyrics. Verse 1 near-whisper: one clean electric guitar arpeggio, soft round bass on roots, rimshot clicks, close dry voice, lots of space, narrow talky melody. Pre-chorus: second guitar swells in with fuzz, tom roll on a rising repeated note. Chorus slams in: two distorted guitars left and right, open crash, fat snare, picked bass locked to the riff, upward leap on the first word, short clipped hook, long held last word, doubled vocal. Verse 2 drops back to quiet, glockenspiel doubles the guitar, lead guitar motif answers the vocal. Short noisy guitar break, then sudden silence. Bridge strips to one clean guitar and an almost spoken voice. Final chorus loudest, octave-up harmony, hard stop, last line sung alone.'
exclude: autotune, gang vocals, synth pop beat
photo_query: girl bed phone night
image_prompt: A young woman in an oversized hoodie sits up in bed at night, seen from the side, hugging her knees and hiding a smile behind her sleeve. A phone lies face down on the rumpled blanket beside her, an electric guitar leans against the wall. Warm small lamp light, deep blue room, playful and restless mood.
title_kind: 지정
tempo: 중간
arc: '화법: 혼잣말. 기(1절): 뒤집어 놓은 휴대폰과 진동 한 번에 일어나는 몸. 감정은 말하지 않고 ''별거 아니야''로 닫는다. 승(프리코러스→후렴): 참아도 새어 나오는 말이 ''사랑이! 뭐라고 이 난리야''로 터진다. 전(2절→브릿지): 2절은 남의 연애에 쉽게 말하던 낮의 나로 시점이 바뀌고 같은 리프레인으로 닫는다. 브릿지에서 처음으로 ''별거 맞아'', ''보고 싶어''를 인정한다. 결(마지막 후렴→아웃트로): ''뭐라고 이 밤에''가 ''뭐라도 해 볼래''로 바뀌어 투정이 결심이 되고, 아웃트로는 ''별거 맞아'' 한 줄만 남긴다.'
line_plan: '[Verse 1] 1 사실: 뒤집어 놓은 휴대폰 / 2 사실: 진동 한 번 / 3 관찰: 벌떡 일어나는 몸 / 4 사실: 별말 없는 한 줄 / 5 관찰: 외울 때까지 봄 / 6 관찰: 혼자인데 숨기는 웃음 / 7 전환(리프레인): 별거 아니야. [Pre-Chorus] 8 전환: 꾹 참아도 / 9 사실: 새어 나옴 / 10 전환(열림): 목까지 차오르면. [Chorus] 11 훅 사랑이! / 12 받침: 뭐라고 이 난리야 / 13 훅 사랑이! / 14 받침: 뭐라고 이 밤에 / 15 훅 메아리. [Verse 2] 16 사실(시점 전환-낮, 남 얘기): 쉬운 말 / 17 사실: 다 그런 거라던 / 18 관찰(자조): 잘도 떠들던 나 / 19 전환: 막상 내 차례 / 20 사실: 인사 한마디 / 21 관찰: 귀까지 빨개진 얼굴 / 22 리프레인: 별거 아니야. [Pre-Chorus] 23~25 반복. [Chorus] 26 훅 / 27 / 28 훅 / 29 / 30 훅 메아리. [Bridge] 31 전환: 사실은 / 32 전환(리프레인 뒤집기): 별거 맞아 / 33 사실: 네 이름 하나 / 34 관찰: 하루가 다 감 / 35 감정 직접: 보고 싶어. [Final Chorus] 36 훅 / 37 같음 / 38 훅 / 39 바뀜: 뭐라도 해 볼래 / 40 훅 메아리. [Outro] 41 훅 / 42 결: 별거 맞아. 훅 줄 번호: 11,13,15,26,28,30,36,38,40,41 = 10번.'
why: '''사랑이 뭐라고''는 거의 모든 사람이 한 번쯤 입 밖에 낸 말이라 가장 넓게 자기 얘기가 됩니다. 제목 ''사랑이!''를 외침으로 터뜨리고 ''뭐라고''를 작게 떨어뜨리면 요청한 조용함과 시끄러움의 차이가 후렴 한 줄 안에서도 생깁니다. 조사 노트의 반려견 설정은 사물 목록과 한 장면 상황극이 되어 버려 버리고, 아무렇지 않은 척하는 태도 하나로 바꿨습니다. 한로로에게서 마지막 후렴의 한 글자 바꾸기(뭐라고→뭐라도)를, 극동아시아타이거즈에게서 2절을 1절과 같은 틀로 시점만 바꾸는 법을, 자우림에게서 ''별거 아니야''와 ''별거 맞아''처럼 반대되는 말을 설명 없이 두는 법을 가져왔습니다. 크라잉넛 원리대로 자조는 ''잘도 떠들던 나'' 한 번만 넣었습니다. 제목은 지정된 그대로 썼습니다.'
share_line: 네 이름 하나에
