title: hero
hook: hero는 지지 않아
theme: 어른
story: 어릴 적 '지지 않는' 영웅을 믿고 자란 사람이 어른이 되어 처음 크게 넘어진 날, 그 말을 다시 꺼내 부른다.
created: 2026-11-01 12:00
request:
  id: mvx8ok67
  title: hero
  idea: 영웅
  content: 어린 시절 동경하던 영웅에게 바치는 곡
  genre: 락
  style: 가사 내용 많이 넣지 말기.
instrumental: false
sound_plan: 밝은 장조에 프리코러스에서만 잠깐 단조로 꺾이는 2000년대 하드록, 124bpm 안팎으로 힘 있게 밀고 간다. 인트로는 펜타토닉 기타 리프 하나가 혼자 네 마디를 열고, 곧 룸 마이크를 쓴 라이브 드럼과 리프에 같은 음으로 붙는 피크 베이스가 한꺼번에 들어온다. 1절은 팜뮤트 리프와 닫힌 하이햇 위에서 좁은 음역으로 말하듯 부르고, 프리코러스는 둘째 기타와 탐이 더해지며 같은 음을 반복해 올라간다. 후렴은 좌우 디스토션 기타 두 대가 벽처럼 열리고 크래시가 터지며 'hero' 첫 음에서 위로 도약, 마지막 낱말을 길게 버틴다. 보컬은 따뜻한 흉성에 약간 거친 결이 있는 남성 테너로, 외치지 않고 진심으로 부르며 후렴은 더블링과 옥타브 아래 백킹을 깐다. 2절부터 리드 기타가 보컬에 대답하는 모티프를 넣고, 두 번째 후렴 뒤 여덟 마디 선율적인 기타 솔로로 가사 없이 공간을 채운다. 브릿지는 하프타임으로 내려앉아 베이스와 클린 기타 한 대, 거의 말하는 목소리만 남긴다. 마지막 후렴은 옥타브 위 하모니를 더해 가장 크게 열리고, 아웃트로는 리프를 한 번 더 돌린 뒤 마지막 낱말에서 딱 끊는다. 공간은 밴드가 한 방에서 연주하는 라이브 룸, 아날로그 온기.
style: 'Korean rock, anthemic 2000s hard rock, driving 124 bpm, bright major key, minor turn in the pre-chorus. Male tenor, warm chest voice, slight rasp, plain and sincere, korean lyrics with an english hook. Sparse lyrics, long instrumental spaces. Intro: one pentatonic guitar riff alone, then live drums and picked bass slam in. Verse 1: palm-muted riff, closed hi-hat, narrow talky melody. Pre-chorus: second guitar and toms, rising repeated note. Chorus: two distorted guitars left and right, open crash, upward leap on hero, long held last note, doubled vocal with low octave backing. Verse 2 adds a lead guitar answering the voice. 8-bar melodic guitar solo. Bridge drops to half-time, bass and one clean guitar, near-spoken voice. Final chorus biggest, octave-up harmony, hard stop. Live room drums, analog warmth. Nostalgic, defiant, grateful.'
exclude: autotune, synth pads, gang vocals
photo_query: man rooftop red towel dusk
image_prompt: Back view of a tired young office worker sitting on an apartment rooftop at dusk, loosened tie, a faded red towel draped over his shoulders like a cape. An old electric guitar leans on the railing beside him. Warm orange sky fading into blue, nostalgic and quietly defiant mood.
short_scenes:
- The same young man stands up on the rooftop at dusk, faded red towel lifting like a cape in the wind, city lights coming on below, orange and blue sky.
- Close-up of his hand with scraped knuckles gripping the faded red towel against the rooftop railing, warm dusk light.
- Night on the same rooftop, the faded red towel tied to the railing and fluttering, the old electric guitar leaning beside it under a deep blue sky.
title_kind: 지정
tempo: 빠름
arc: '화법: 혼잣말(영웅은 ''그 사람'', ''hero''로 부르고 브릿지 끝에서 한 번 직접 고마움을 말함). 기: ''누굴 따라 뛰었더라''로 각자의 영웅을 떠올리게 하고, 보자기 망토와 날 수 있을 줄 알았던 꼬마로 그때에 선다. 승: 다시 일어서는 장면까지 숨을 참던 기억이 후렴 ''hero는 지지 않아 / 그 말 믿고 컸어''로 터진다. 전: 2절은 키를 넘어선 어른, 깨지고 돌아온 밤으로 시점이 바뀌고, 브릿지에서 처음으로 ''그 사람도 그때 지금 내 나이쯤, 넘어진 날은 빼고 보여 줬지''를 인정하고 ''고마웠어''를 직접 말한다. 결: 마지막 후렴은 ''그 말 믿고 컸어''가 ''넘어진 날 알았어''로, ''지금도 믿고 싶어''가 ''나도 지지 않아''로 바뀌어 영웅의 말이 내 말이 되고, 아웃트로는 첫 줄의 물음에 ''그 등 따라 여기까지''로 답한다.'
line_plan: '[Verse 1] 1 질문(임팩트): 각자의 영웅을 떠올리게 하는 물음 / 2 선언(임팩트): 이름보다 등이 기억난다는 관찰 / 3 사실: 목에 묶은 보자기(유일한 사물) / 4 사실: 날 수 있을 줄 알았던 기대 / 5 관찰: 무릎이 까진 날 / 6 관찰: 입술을 깨물던 꼬마(2절 6과 짝). [Pre-Chorus] 7 사실: 주먹 쥐고 숨 참던 시청 / 8 전환: 다시 일어서는 / 9 열어 둠: 그 장면까지 → 후렴. [Chorus] 10 선언(훅1) / 11 고백: 그 말 믿고 컸어 / 12 선언(훅2) / 13 고백: 지금도 믿고 싶어(감정 직접) / 14 메아리. [Verse 2] 15 질문: 언제 그 키를 넘었나(1과 같은 자리) / 16 전환(자조): 보자기는 행주가 됨 / 17 사실: 깨지고 돌아온 밤 / 18 관찰: 불도 켜지 않고 앉아 / 19 전환: 그 등이 떠오름 / 20 관찰: 입술을 깨무는 어른(6을 뒤집음). [Pre-Chorus] 21~23 반복. [Chorus] 24 훅3 / 25 / 26 훅4 / 27 / 28 메아리. [Bridge] 29 새 사실: 그 사람도 그때 / 30 관찰: 지금 내 나이쯤 / 31 전환: 넘어진 날은 빼고 / 32 인정: 일어선 장면만 보여 줬지 / 33 고백: 고마웠어(곡에서 한 번뿐인 직접 고마움). [Final Chorus] 34 선언(훅5) / 35 모순(바뀐 줄): 넘어진 날 알았어 / 36 선언(훅6) / 37 뒤집기(바뀐 줄): 나도 지지 않아 / 38 선언(훅7, 대문자 강조). [Outro] 39 질문: 첫 줄 되돌림 / 40 답: 그 등 따라 여기까지. 훅 줄 번호: 10, 12, 24, 26, 34, 36, 38(7회) + 메아리 14, 28.'
why: 누구에게나 '지지 않는다'고 믿었던 사람이 있었고, 누구나 결국 한 번은 진다는 것이 이 주제에서 가장 넓게 공감되는 지점이라 0번을 골랐다. 훅 '지지 않아'는 첫 후렴에서는 꼬마의 믿음, 마지막 후렴에서는 '넘어진 날 알았어'와 '나도 지지 않아'로 바뀌어 같은 말이 다른 뜻으로 들리게 했다(극동아시아타이거즈의 마지막 후렴 한 줄 뒤집기). 1절의 '날 수 있을 줄 알았지'로 과거의 기대를 세우고(자우림), 2절에서 보자기가 행주가 되는 초라한 생활 사물 하나로 자조를 한 번만 넣었다(크라잉넛). 제목이 지정된 영어 단어 하나라서 title_kind는 단어 하나로 두고, 가사는 적게, 줄은 짧게 써서 리프와 솔로가 숨 쉴 자리를 남겼다.
