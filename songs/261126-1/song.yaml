- '늘 묻는 쪽이 되죠 → 안부만 묻게 되네요: 빈도어 ''늘''을 지우고, 2절의 ''-죠'' 줄 끝 겹침(없겠죠·되죠)을 ''-네요''로 흩뜨림. 동시에 ''안부''를 미리 깔아 두어 브릿지의 뒤집기(묻던 안부가 내게 하던 말)가 더 세게 닿게 함'
- '나머지 줄은 그대로 둠: 첫 두 줄이 모순과 선언으로 열리고, 후렴은 훅 ''잘 지내죠''가 첫 줄과 셋째 줄에 두 번 나오며 제목과 같음. 브릿지는 처음 하는 고백이고, 마지막 후렴은 두 줄이 바뀌어 작별로 들림. 생활 소품과 어색한 구어체가 없고 해요체가 곡 전체에 고르게 쓰여 고칠 이유가 없음'
