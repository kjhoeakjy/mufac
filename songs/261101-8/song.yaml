    sound_plan: 따뜻한 장조에 96bpm 안팎의 미드템포, 브릿지에서만 잠깐 단조로 돈다. 리듬은 튀는 2박이 아니라 곧게 흐르는 8분음 그루브로, 작은 방에서 친 라이브 드럼에 킥은 단단하고 스네어는 또렷하되 세게 때리지 않는다. 곡의 주인공은 베이스다. 피크로 친 일렉 베이스가 멜로디가 있는 리프로 곡을 혼자 열고, 절에서는 그 리프가 보컬 줄 사이마다 돌아오며, 2절에서는 베이스 필이 목소리에 대답하고, 프리코러스에서는 베이스가 한 음씩 걸어 올라간다. 2절 후렴 뒤 간주는 기타 솔로 대신 베이스 리프 브레이크다. 화성은 깨끗한 크런치 리듬 기타 한 대가 받치고, 리드 기타는 후렴에서만 가볍게 얹는다. 신스 패드와 전조는 뺀다. 멜로디는 절에서 좁고 말하듯, 프리코러스는 같은 음을 되풀이하며 밀고, 후렴 첫 음 '나는'에서 위로 뛰어 '연주야'를 길게 끈다. 보컬은 여자 메조로 꾸밈없고 맑은 담백한 톤, 비브라토 적게, 절은 가깝고 건조하게, 후렴은 더블링, 2절 후렴부터 3도 하모니. 브릿지는 하프타임으로 떨어져 베이스와 목소리만 남는다. 마지막 후렴은 같은 키에서 밴드가 다 들어오고 베이스 리프가 가장 크게 들리며, 떼창 없이 목소리 둘로 끝낸다. 아웃트로는 베이스 리프 두 번 뒤 딱 끊는다.
    arc: '화법: 우리. 기: 처음 만난 밤, 낯설지 않다는 모순과 이름이면 충분하다는 말로 연다. 승: 서툰 첫인사 끝에 이름과 좋아하는 것 둘(소주, 베이스)을 꾸밈없이 밝히고 ''나랑 술 먹고 합주할래''라고 묻는다(후렴 ''나는 연주야''). 전: 2절은 상대의 이름으로 시선이 옮겨 가고, 브릿지에서 처음으로 ''낯선 사람으로 헤어지기 싫어''라는 진심을 말한다. 결: 마지막 후렴의 끝줄 ''나는 연주야''가 ''이제 이름 불러 줘''로 바뀌어 소개가 부탁이 되고, 아웃트로에서 ''만나서 반가워''로 인사를 닫은 뒤 베이스 리프 두 번으로 끊는다.'
    share_line: 나랑 술 먹고 합주할래
