title: 나는 연주야
hook: 나는 연주야
theme: 사랑
story: 처음 만난 자리에서 이름을 말하고, 소주 한잔으로 낯선 사이를 넘어 보자고 밝게 청하는 노래
created: 2026-11-01 19:56
request:
  id: mvxpp4xh
  title: 나는 연주야
  content: 내 소개곡이야. 밝은 분위기. 가사가 많지 않고 반복적이었으면 좋겠어. 만나서 반갑다는 내용. 술 한번 먹자 나 소주 좋아해 이걸 후렴구로 넣어.
  genre: 밴드
  style: 여자보컬. 담백한 목소리
instrumental: false
sound_plan: 밝은 장조에 126bpm 안팎, 브릿지에서만 잠깐 단조로 돈다. 드럼은 라이브홀에서 친 탄탄한 소리로 킥은 단단하고 스네어는 또렷하며, 절은 하이햇 8분음, 프리코러스는 탐으로 밀어 올리고 후렴은 크래시로 연다. 베이스는 피크로 8분음을 달리며 후렴에서 옥타브로 뛴다. 화성은 크런치 리듬 기타 두 대가 좌우로 넓게 깔리고, 리드 기타가 후렴 훅 멜로디를 그대로 따라 부르며, 2절부터 얇은 신스 패드가 뒤를 받친다. 멜로디는 절에서 짧고 말하듯 좁게, 프리코러스는 같은 음을 되풀이하며 올라가고, 후렴 첫 음 '나는'에서 위로 도약해 '연주야' 끝 모음을 길게 끈다. 보컬은 여자 메조로 꾸밈없고 맑은 담백한 톤, 비브라토 적게, 절은 가깝고 건조하게, 후렴은 더블링, 2절 후렴부터 3도 하모니. 인트로는 밝은 기타 리프 뒤 드럼 필로 밴드가 들어오고, 1절은 기타 한 대와 베이스, 하이햇만, 첫 후렴에서 다 들어온다. 2절 후렴 뒤 짧은 기타 솔로, 브릿지는 하프타임으로 떨어져 아르페지오 기타와 목소리만 남는다. 마지막 후렴은 한 키 올라가 가장 크고 넓게, 마지막 줄에만 밴드 떼창을 얹고, 아웃트로는 리프 두 번 뒤 딱 끊어 끝낸다.
style: 'Korean band pop rock, bright 2010s, upbeat 126 bpm, major key, short minor turn at the bridge. Female mezzo, plain clear voice, light natural tone, little vibrato, close dry verses, sincere, sung in Korean, korean lyrics. Intro: bright guitar riff, drum fill brings the band in. Verse 1: one crunchy guitar, driving picked bass, eighth-note hi-hat, short talky melody. Pre-chorus: tom build, rising repeated note. Chorus: full band, wide crunchy guitars, crash, upward leap on the first word, long held last word, lead guitar doubles the hook, doubled vocal. Verse 2 adds synth pad and guitar answers. Guitar solo after chorus two. Bridge: half-time, arpeggio guitar and voice. Final chorus: key change, third harmony, gang vocal on the last line. Outro: riff twice, hard stop. Live hall, bright. Friendly, cheerful.'
exclude: autotune, synth pop beat, trap hi-hats
photo_query: friends toasting soju night
image_prompt: A young woman in a denim jacket, seen from the side, raising a small glass of soju toward friends across a crowded table in a warm-lit Korean pub at night. Green bottles, orange light, laughter in the blur. Cheerful, friendly, first-meeting mood.
short_scenes:
- The same young woman in a denim jacket stands up laughing, glass raised high, friends around the warm-lit pub table cheering with her, orange light and green bottles.
- Close-up of two hands clinking small soju glasses over the table, warm orange light, a green bottle soft in the background.
- After the night, the young woman walks out of the pub into the blue late-night street, side profile, jacket over her shoulder, a small smile.
title_kind: 지정
tempo: 빠름
arc: '화법: 우리. 기: 처음 만난 밤, 낯설지 않다는 모순과 이름이면 충분하다는 말로 연다. 승: 서툰 첫인사 끝에 이름과 소주 한잔을 밝게 내민다(후렴 ''나는 연주야''). 전: 2절은 상대의 이름으로 시선이 옮겨 가고, 브릿지에서 처음으로 ''낯선 사람으로 헤어지기 싫어''라는 진심을 말한다. 결: 마지막 후렴의 마지막 줄 ''만나서 반가워''가 ''이제 이름 불러 줘''로 바뀌어 인사가 부탁이 되고, 리프 두 번으로 꽉 끝낸다.'
line_plan: '[Verse 1] 1: 모순(임팩트) — 처음인데 낯설지 않다. 2: 부탁(임팩트) — 설명은 미루자. 3: 새 뜻(명사구) — 이 밤의 우리. 4: 정확한 말(리프레인) — 사람 사이엔 이름이면 된다. [Pre-Chorus] 5: 정확한 말 — 첫인사는 늘 서툴다. 6: 전환(열어 둠) — 이것만은 분명히 말하겠다며 후렴으로 떨어짐. [Chorus] 7: 선언(훅) — 내 이름. 8: 부탁+고백 — 술 한잔과 소주 취향(사용자 지정). 9: 선언(훅 반복). 10: 고백 — 반가움을 바로 말함. [Verse 2] 11: 고백 — 상대 이름이 궁금하다(시점이 상대로). 12: 새 뜻 — 기억하겠다는 다짐. 13: 새 뜻(명사구) — 모르는 사람들끼리. 14: 리프레인 — 1절 끝과 같은 줄. [Pre-Chorus] 15~16: 1절과 같음. [Chorus] 17~20: 같음(훅 17, 19). [Bridge] 21~22: 고백 — 낯선 사람으로 헤어지기 싫다는 곡의 진심, 훅 없음. [Final Chorus] 23: 훅. 24: 부탁. 25: 훅. 26: 뒤집기 — 인사가 이름을 불러 달라는 부탁으로 바뀜. 훅 줄 번호: 7, 9, 17, 19, 23, 25 (총 6회).'
why: 제목이 '나는 연주야'로 정해져 있으니 훅은 제목 그대로여야 하고, 소개곡은 이름이 가장 많이 들려야 남는다. 크라잉넛 '말달리자'처럼 입으로 외칠 수 있는 한 덩이 말을 후렴 첫 줄과 셋째 줄에 세우고, 사용자가 정한 '술 한번 먹자 나 소주 좋아해'를 그 사이에 넣어 이름-부탁-이름-인사로 닫았다. 주어 대명사로 시작하는 줄 제한은 지정 제목 때문에 후렴에서만 예외로 두고, 절은 주어 없이 짧은 뜻으로만 썼다. 마지막 후렴은 한로로처럼 한 줄만 바꿔 '만나서 반가워'를 '이제 이름 불러 줘'로 돌려, 브릿지의 '낯선 사람으로 헤어지기 싫어'를 지나온 뒤 같은 훅이 부탁으로 들리게 했다. 화법은 직전 두 곡(너에게, 혼잣말)을 피해 처음 만난 '우리'의 말로 잡았다.
share_line: 이름이면 충분해
