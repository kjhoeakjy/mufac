- After the night, the young woman walks out of the pub into the blue late-night street, side profile, jacket over her shoulder, a small smile.
title_kind: 지정
tempo: 빠름
arc: '화법: 우리. 기: 첫 줄부터 ''안녕! 나는 연주야, 나랑 합주할래''로 인사와 이름, 부탁을 한꺼번에 던지고, 낯설지 않다는 모순과 이름이면 충분하다는 말을 덧붙인다. 승: 서툰 첫인사를 ''다시 크게 말할게''로 밀어 올리고, 후렴에서 이름, 술 한번 먹자는 말, 좋아하는 것 둘(소주, 베이스)을 짧게 박아 외친다(후렴 ''나는 연주야''). 전: 2절에서는 1절의 ''이름이면 충분해''를 뒤집어, 이름은 잘 외우지 못해도 얼굴은 기억해 보겠다고 하고, 소주에 다 잊어도 재미있으면 됐다며 웃어넘긴다. 브릿지에서 처음으로 ''낯선 사람으로 헤어지기 싫어''라는 진심을 말한다. 결: 마지막 후렴의 끝줄 ''나는 연주야''가 ''이제 이름 불러 줘''로 바뀌어 소개가 부탁이 되고, 아웃트로에서 ''만나서 반가워''로 인사를 닫은 뒤 베이스 리프 두 번으로 끊는다.'
line_plan: '[Verse 1] 1: 모순(임팩트) — 처음인데 낯설지 않다. 2: 부탁(임팩트) — 설명은 미루자. 3: 새 뜻(명사구) — 이 밤의 우리. 4: 정확한 말(리프레인) — 사람 사이엔 이름이면 된다. [Pre-Chorus] 5: 정확한 말 — 첫인사는 늘 서툴다. 6: 전환(열어 둠) — 이것만은 분명히 말하겠다며 후렴으로 떨어짐. [Chorus] 7: 선언(훅) — 내 이름. 8: 부탁+고백 — 술 한잔과 소주 취향(사용자 지정). 9: 선언(훅 반복). 10: 고백 — 반가움을 바로 말함. [Verse 2] 11: 고백 — 상대 이름이 궁금하다(시점이 상대로). 12: 새 뜻 — 기억하겠다는 다짐. 13: 새 뜻(명사구) — 모르는 사람들끼리. 14: 리프레인 — 1절 끝과 같은 줄. [Pre-Chorus] 15~16: 1절과 같음. [Chorus] 17~20: 같음(훅 17, 19). [Bridge] 21~22: 고백 — 낯선 사람으로 헤어지기 싫다는 곡의 진심, 훅 없음. [Final Chorus] 23: 훅. 24: 부탁. 25: 훅. 26: 뒤집기 — 인사가 이름을 불러 달라는 부탁으로 바뀜. 훅 줄 번호: 7, 9, 17, 19, 23, 25 (총 6회).'
why: 제목이 '나는 연주야'로 정해져 있으니 훅은 제목 그대로여야 하고, 소개곡은 이름이 가장 많이 들려야 남는다. 크라잉넛 '말달리자'처럼 입으로 외칠 수 있는 한 덩이 말을 후렴 첫 줄과 셋째 줄에 세우고, 사용자가 정한 '술 한번 먹자 나 소주 좋아해'를 그 사이에 넣어 이름-부탁-이름-인사로 닫았다. 주어 대명사로 시작하는 줄 제한은 지정 제목 때문에 후렴에서만 예외로 두고, 절은 주어 없이 짧은 뜻으로만 썼다. 마지막 후렴은 한로로처럼 한 줄만 바꿔 '만나서 반가워'를 '이제 이름 불러 줘'로 돌려, 브릿지의 '낯선 사람으로 헤어지기 싫어'를 지나온 뒤 같은 훅이 부탁으로 들리게 했다. 화법은 직전 두 곡(너에게, 혼잣말)을 피해 처음 만난 '우리'의 말로 잡았다.
share_line: 이름은 잘 외우지 못해 / 얼굴은 기억해 볼게
