title: 나는 연주야
hook: 나는 연주야
theme: 사랑
story: 처음 보는 사람들 사이에서 어색하게 자기소개를 하다가, 이름을 크게 말하고 술 한잔과 합주를 청하는 베이시스트가 부르는 노래.
created: 2026-11-01 19:56
request:
  id: mvxpp4xh
  title: 나는 연주야
  content: 내 소개곡이야. 밝은 분위기. 가사가 많지 않고 반복적이었으면 좋겠어. 만나서 반갑다는 내용. 술 한번 먹자 나 소주 좋아해 이걸 후렴구로 넣어.
  genre: 밴드
  style: 여자보컬. 담백한 목소리
instrumental: false
sound_plan: 따뜻한 장조에 96bpm 안팎의 미드템포, 브릿지에서만 잠깐 단조로 돈다. 리듬은 곧게 흐르는 8분음 그루브로, 작은 방에서 친 라이브 드럼에 킥은 단단하고 스네어는 또렷하다. 곡의 주인공은 베이스이고, 처음부터 끝까지 가장 크게 앞에 선다. 피크로 친 일렉 베이스가 굵고 멜로디가 있는 리프로 곡을 혼자 열고, 절에서는 그 리프가 보컬 줄 사이마다 돌아오며, 2절에서는 두툼한 베이스 필이 목소리에 대답하고, 프리코러스에서는 베이스가 한 음씩 걸어 올라간다. 2절 후렴 뒤 간주는 베이스 리프 브레이크다. 화성은 크런치 리듬 기타 한 대가 받치고, 리드 기타는 후렴에서만 얹는다. 신스 패드와 전조는 뺀다. 멜로디는 절에서 좁고 말하듯, 프리코러스는 같은 음을 되풀이하며 밀고, 후렴은 짧은 줄을 세게 끊어 치다가 첫 음 '나는'에서 위로 뛰고 '연주야'를 길게 끈다. 후렴은 크래시 심벌과 함께 밴드가 한꺼번에 터지고 드럼이 더 세게 몰아친다. 보컬은 중저음 여자 알토, 낮고 따뜻한 흉성에 매끈하고 맑은 담백한 톤, 긁는 소리 없이 비브라토 적게, 절은 가깝고 건조하게, 후렴은 힘 있게 더블링, 2절 후렴부터 3도 하모니. 브릿지는 하프타임으로 떨어져 베이스와 목소리만 남는다. 마지막 후렴은 같은 키에서 가장 크고 베이스가 가장 크게 들리며, 떼창 없이 목소리 둘로 끝낸다. 아웃트로는 베이스 리프 두 번 뒤 딱 끊는다.
style: 'Korean band pop rock, 2010s indie band sound, 96 bpm, straight eighth-note groove, warm major key, minor turn at the bridge. Bass-driven, bass loud and upfront. Melodic picked electric bass riff opens alone, returns between vocal lines, fat fills answer the voice, walks up in the pre-chorus, bass riff break after chorus two. Female alto, low warm chest voice, smooth and clean, plain delivery, little vibrato, sung in Korean, korean lyrics. Live drums in a small room, punchy kick, crisp snare. One crunchy rhythm guitar, lead guitar only in choruses. Chorus hits hard: full band, crash cymbals, upward leap on the first word, strong chest voice, doubled vocal, third harmony from chorus two. Bridge: half-time, bass and voice only. Final chorus: biggest. Outro: bass riff twice, hard stop. Warm, bold, honest.'
exclude: trot, autotune, raspy vocal
photo_query: friends toasting soju night
image_prompt: A young woman in a denim jacket, seen from the side, playing an electric bass in a small warm-lit rehearsal room at night, a green soju bottle and two small glasses on top of the amp. A drummer blurred behind her, orange light, relaxed friendly mood.
