    style: 'Korean alternative rock, 90s grunge quiet-loud dynamics, around 112 bpm, minor key. Female alto lead, husky chest voice, plain and close in the verses, raw and strong in the chorus, mature and sincere, sung in Korean, korean lyrics. One temple bell under the intro. Verse 1 nearly bare: clean electric guitar arpeggio, round fingered bass on roots, soft rim clicks, narrow talky melody. Pre-chorus builds on snare and toms with a repeated rising note, then one beat of silence. Chorus explodes: two distorted guitars left and right, crash cymbals, picked bass locked to the riff, upward leap on the first word, doubled vocal with low octave backing, long held last note. Verse 2 drops back to quiet with melodic bass. 8-bar fuzzy guitar solo after chorus 2. Half-time bridge, one clean guitar and near-spoken voice. Final chorus loudest and widest, octave-up harmony, hard stop. Live band in a room, dry verses, big room chorus. Restless, wry, tender.'
    exclude: autotune, strings, gang vocals
    sound_plan: 단조, 112bpm 안팎의 중간 템포 얼터너티브 락이다. 90년대 그런지처럼 조용함과 시끄러움의 대비를 극단으로 둔다. 인트로는 절 종소리 한 번과 클린 기타 하나로 연다. 1절은 거의 비운다. 클린 일렉 기타 아르페지오, 루트를 지키는 둥근 핑거 베이스, 림 클릭만 깔고 멜로디는 좁은 음역에서 말하듯 간다. 프리코러스는 스네어와 탐이 같은 음을 반복하며 밀어 올리고, 후렴 직전에 한 박을 완전히 비운다. 후렴은 좌우 디스토션 기타 두 대의 벽, 크래시, 기타 리프에 붙은 피크 베이스, 단단한 라이브 드럼으로 터진다. 첫 음에서 위로 도약하고 '윤회'의 마지막 모음을 길게 끈다. 리드 보컬은 더블링하고 옥타브 아래 백킹을 받친다. 2절은 다시 조용해지고 베이스가 선율을 조금 움직인다. 2절 후렴 뒤에 퍼즈 기타 솔로 8마디. 브릿지는 하프타임으로 떨어져 클린 기타 하나와 거의 말하는 목소리만 남는다. '보고 싶어' 뒤에는 잠깐 정적. 마지막 후렴이 가장 크고 넓다. 옥타브 위 하모니가 더해지고 훅을 겹쳐 부른 뒤 밴드 전체가 딱 끊긴다. 아웃트로는 클린 코드 하나 위의 한 줄, 그리고 종소리로 닫는다. 보컬은 허스키한 흉성의 여성 알토로, 절에서는 가깝고 담담하게, 후렴에서는 거칠게 연다. 공간은 한 방에서 연주하는 라이브 밴드다. 절은 건조하게, 후렴은 큰 룸 울림으로 간다.
    hook: 또 너야 윤회
    arc: '화법: 혼잣말(속으로 너를 부르는 말). 기: 지운 번호를 손끝이 외우고, 같은 골목에서 모르는 척 기다리는 나. 감정은 아직 말하지 않는다. 승: 끊었다고 돌아서면 또 그 자리라는 한 문장, ''또 너야 윤회''와 ''이번 생도 너야''. 전: 2절은 상대가 바뀐다. 새로 만난 사람의 웃음 끝에서 또 너를 보고, 인연이라는 말이 겁난다. 브릿지에서 처음으로 인정한다. 불을 끄면 끝이라는데 불을 켜 놓고 자는 건 나였고, 바퀴를 돌린 건 너가 아니라 놓지 못한 내 손이었다. 그리고 ''보고 싶어''. 결: 마지막 후렴의 ''이번 생도 너야''가 ''다음 생도 너야''로 바뀌어 체념이 고집이 된다. 아웃트로는 ''불은 내일 끌게'' 한 줄이다.'
