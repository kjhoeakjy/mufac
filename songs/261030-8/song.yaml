    arc: '화법: 혼잣말(거울 속 나에게 중얼거림). 기: 씻고 나온 거울 속에 어제의 얼굴이 있고, 다르게 살겠다던 말은 베개 밑에 둔 채 같은 말에 화내고 같은 데서 넘어진다. 감정은 아직 말하지 않는다. 승: 이번엔 다를 거라며 문을 열면 또 그 자리라는 한 문장, ''또 나야 윤회''와 ''이번 생도 나야''. 전: 2절은 시간과 대상이 바뀐다. 꽃 진 자리에 다른 꽃이 피고 붙잡았던 사람들은 다른 얼굴로 다시 오는데(무상과 인연), 나는 처음인 듯 또 손을 내민다. 브릿지에서 처음으로 인정한다. 불을 끄면 끝이라는데(열반) 불을 켜 놓고 자는 건 나였고, 바퀴를 돌린 건 하늘이 아니라 놓지 못한 내 손이었다. 그리고 ''놓기 싫어''. 결: 마지막 후렴의 ''이번 생도 나야''가 ''손만 펴면 되는데''로 바뀌어 알면서도 쥐고 있는 사람이 된다. 아웃트로는 ''불은 내일 끌게'' 한 줄.'
