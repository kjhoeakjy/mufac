  plan: 번호·골목 같은 연애 장면을 걷어 내고, 같은 얼굴과 같은 실수로 돌아오는 '나'를 윤회로 읽는 불교적 혼잣말로 가사 전체를 다시 쓴다. 훅은 '또 너야 윤회'를 한 글자만 비튼 '또 나야 윤회'로 바꿔 집착하는 자아가 바퀴를 돌린다는 뜻을 담는다. 열반(불을 끔)의 비유와 아웃트로 '불은 내일 끌게'는 살리고, 제목 윤회는 그대로 둔다. 소리는 디스토션 락에서 첼로가 이끄는 느리고 절제된 체임버 발라드로 바꾸되, 조용함과 커짐의 대비는 남긴다.
  changes:
  - 지운 번호, 골목, 새로 만난 사람 같은 연애 장면을 모두 걷어 내고 거울 속 어제의 얼굴, 같은 데서 또 넘어지는 나로 1절을 다시 썼다.
  - 훅을 '또 너야 윤회'에서 '또 나야 윤회'로 한 글자 바꿔, 매번 돌아와 만나는 것이 집착하는 자기 자신이라는 무아·업의 뜻을 담았다.
  - 2절은 꽃 진 자리에 다른 꽃이 피고 붙든 사람들이 다른 얼굴로 다시 오는 무상과 인연으로 바꿨다.
  - 브릿지에서 열반(불을 끔)의 비유를 살리고, 바퀴를 돌린 건 하늘이 아니라 놓지 못한 내 손이라는 인정과 '놓기 싫어' 한마디를 두었다.
  - 마지막 후렴의 바뀌는 줄을 '손만 펴면 되는데'로 해서, 알면서도 쥐고 있는 마음을 남겼다. 아웃트로 '불은 내일 끌게'는 그대로 두었다.
  - 소리를 그런지 락에서 첼로가 이끄는 66bpm의 느린 체임버 발라드로 바꿨다. 디스토션 기타와 기타 솔로를 빼고, 첼로 독주 간주와 피치카토 베이스, 브러시 드럼을 넣었다.
  - 조용함과 커짐의 대비는 남기되 마지막 후렴도 절제해서 우아한 웅장함으로 맞췄다. Exclude는 디스토션 기타, 합창, 오토튠으로 바꿨다.
  - 가사 장면이 바뀌어 이미지를 절 마당의 벚나무와 연등 장면으로 바꿨다.
