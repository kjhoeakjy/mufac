title: 사랑이!
hook: 사랑이!
theme: 사랑
story: 좋아하는 사람 앞에서 아무렇지 않은 척하지만 심장 소리가 들킬까 봐 겁나는 사람이, 차라리 다 들려도 좋다고 혼자 소리치는 웅장한 락.
created: 2026-10-30 17:25
request:
  id: mvupe0iu
  title: 사랑이!
  content: 사랑하면 두근두근하는데 음악이 엄청 웅장해서 이걸 듣는 사람도 두근두근했으면 좋겠어 사운드에 압도돼서
  genre: 락
  style: 오케스트라, 합창 느낌 넣고 웅장하게
sound_plan: 밝은 장조에 프리코러스에서 잠깐 단조로 비트는 화성, 126bpm 안팎으로 심장보다 조금 빠르게 몰아붙인다. 인트로는 4마디로 짧게, 팀파니가 심장 박동처럼 두 번씩 치고 저음 현악 오스티나토가 깔린 뒤 기타 리프가 곡의 얼굴로 들어온다. 1절은 팜뮤트 기타와 리프를 따라가는 피크 베이스, 닫힌 하이햇의 라이브 드럼으로 작고 단단하게, 멜로디는 좁은 음역에서 말하듯. 프리코러스는 같은 음을 반복하며 올라가고 탐과 스네어 롤, 현악이 위로 기어오른다. 후렴은 첫 음절 '사랑이'에서 위로 도약하며 좌우 디스토션 기타 벽, 오케스트라 전체, 브라스, 크래시, 혼성 합창이 한꺼번에 터지고 훅의 마지막 모음을 길게 끈다. 보컬은 맑고 힘 있는 남성 테너, 흉성에 약간의 거친 결, 과장 없이 진심으로, 후렴은 더블링과 합창이 받친다. 2절은 리드 기타 모티프가 보컬에 답하고 첼로가 아래를 받친다. 두 번째 후렴 뒤 현악과 브라스 위에서 8마디 기타 솔로. 브릿지는 하프타임으로 내려앉아 베이스와 부드러운 피아노, 가까운 목소리 하나만 남고 끝에서 팀파니가 다시 몰아친다. 마지막 후렴은 키를 올리고 합창을 옥타브로 쌓아 가장 크고 넓게. 큰 홀의 울림과 넓은 스테레오, 라이브 밴드 질감. 끝은 밴드가 끊기고 현악이 한 화음을 붙든 채 목소리 한 줄로 닫는다.
style: 'Korean rock, cinematic orchestral rock anthem, 2010s, driving 126 bpm, major key. Male tenor, strong clear chest voice, slight rasp, sincere, sung in Korean, korean lyrics. Intro: timpani heartbeat, low strings, then the guitar riff. Verse 1 is tight: palm-muted guitar, picked bass on the riff, closed hi-hat, narrow talky melody. Pre-chorus rises on a repeated note, toms and snare roll, strings climb. Chorus explodes: wall of distorted guitars, full orchestra, brass, crash cymbals, big mixed choir on the hook, upward leap, long held last note. Verse 2 adds a lead guitar motif answering the vocal. Guitar solo over strings after the second chorus. Bridge drops to half-time, bass, soft piano and one close voice, then timpani build. Final chorus biggest and widest, choir in octaves, key lift, ends on one held string chord. Live band in a large hall, wide stereo. Pounding, brave, thrilling.'
exclude: autotune, trap hi-hats, synth pop beat
photo_query: young man rooftop city night
image_prompt: A young man in a dark hoodie seen from the side on a city rooftop at dusk, one hand pressed to his chest, a glowing phone in the other. City lights below, deep blue and orange sky, wind in his hair. Dramatic, nervous, exhilarated mood.
title_kind: 지정
tempo: 빠름
arc: '화법: 혼잣말(아무에게도 말하지 않고 자기 가슴 소리에 대고 중얼거리다 외침). 기: 이름 한 번 불렸을 뿐인데 귀가 뜨겁고, 아무렇지 않은 얼굴 뒤에서 북소리가 난다. 승: 옆에 서면 숨을 참지만 참을수록 커지고, 후렴에서 ''사랑이 쿵 하고 와 버렸어, 온 동네 다 들려도''라고 터진다. 전: 2절은 혼자 남은 밤, 답장 한 줄에 잠이 달아나는 자신을 본다. 브릿지에서 처음으로 ''겁이 나, 닿을까 봐, 아니 못 닿을까 봐''라는 진심을 말하고 한 번은 크게 울려 보겠다고 한다. 결: 마지막 후렴의 넷째 줄이 ''온 동네 다 들려도''(들켜도 좋다)에서 ''너한테 닿을 때까지''(닿게 하겠다)로 바뀌고, 아웃트로는 ''들렸으면 큰일인데''로 다시 소심해진다.'
line_plan: '[Verse 1] 1 관찰: 이름 한 번 불린 것 / 2 관찰: 귀부터 뜨거워짐 / 3 사실: 아무 일 없는 얼굴 / 4 전환: 대답은 잘했는데 / 5 사실: 가슴 안쪽 어딘가 / 6 사실: 누가 북을 침(곡의 유일한 비유) / 7 리프레인: 멈출 줄 모르는 소리. [Pre-Chorus] 8 관찰: 옆에 서면 숨을 참음 / 9 사실: 들킬까 봐 / 10 관찰+열림: 참으면 더 커지는데. [Chorus] 11 훅 사랑이! / 12 받침: 쿵 하고 와 버렸어 / 13 훅 / 14 받침(공유 줄): 온 동네 다 들려도 / 15 훅. [Verse 2] 16 사실(시간 전환, 밤): 답장 한 줄 / 17 관찰: 이불을 걷어참 / 18 사실: 잘 자라는 말 / 19 관찰(반대): 잠이 달아남 / 20 사실: 불 꺼진 방 / 21 관찰(자기를 밖에서 봄): 혼자 웃는 사람 / 22 리프레인. [Pre-Chorus] 23 사실: 베개에 묻은 얼굴 / 24 전환: 소리는 새어 나감 / 25 관찰+열림: 누르면 더 커지는데. [Chorus] 26 훅 / 27 / 28 훅 / 29 / 30 훅. [Bridge] 31 전환(첫 진심): 사실은 겁이 나 / 32 사실: 이 소리가 너한테 / 33 닿을까 봐 / 34 전환(반대말 대구): 아니, 못 닿을까 봐 / 35 전환: 그래도 한 번은 / 36 의지: 크게 울려 볼래. [Final Chorus] 37 훅 / 38 / 39 훅 / 40 변화: 너한테 닿을 때까지 / 41 훅. [Outro] 42 김 빼기: 들렸으면 큰일인데. 훅 줄 번호: 11, 13, 15, 26, 28, 30, 37, 39, 41 → 총 9번.'
why: 제목이 정해져 있으니 제목 그대로 외칠 수 있는 세 음절 훅 '사랑이!'를 후렴 첫 줄과 끝 줄에 세웠고, 뒤에 오는 받침 줄과 이어 붙으면 '사랑이 쿵 하고 와 버렸어'라는 한 문장이 되게 했다. 크라잉넛 '말달리자'처럼 외침 앞에 절과 프리코러스로 참는 말을 쌓아 두어, 숨을 참을수록 커지는 심장이 후렴의 폭발로 떨어지게 했다. 심장 소리가 남에게 들릴까 봐 걱정하는 기분은 누구나 겪어 본 것이라 가장 넓게 공감을 얻고, 그 '소리'가 그대로 팀파니와 합창의 웅장한 편곡이 되어 사용자가 원한 '듣는 사람도 두근거리는' 효과로 이어진다. 한로로식으로 마지막 후렴은 한 줄만 '온 동네 다 들려도'에서 '너한테 닿을 때까지'로 바꿔 브릿지의 고백 이후 방향이 생기게 했고, 터치드식으로 아웃트로에서 '들렸으면 큰일인데'로 김을 빼 사람 냄새를 남겼다. 제목 형태는 지정 제목이 곧 훅 문장이므로 '후렴 문장'으로 적었다.
share_line: 들렸으면 큰일인데
