polish:
- '다섯 시 십 분 → 다섯 시 넘어: 받침 명사 끝 줄(한 점·십 분·볕·끝)이 넷이라 늘여 부르기 어렵다. 분 단위 시각보다 흐르는 시간이 2절의 ''해가 기운다''는 전개와 맞는다.'
- '벽 타고 오른 볕 → 볕은 벽을 타고: 관형형 + 받침 명사 끝을 풀어 문장으로 열었다. 같은 그림이고 다음 줄로 이어진다.'
- '비켜 간 책상 끝 → 책상만 쏙 비켜서: 받침 명사 끝을 없앴다. ''만''과 ''쏙''으로 볕이 일부러 피해 가는 듯한 능청을 한 번 넣었다. 1절 프리코러스 ''책상 끝까지 닿기만 하면''에 대한 답이 된다.'
- '나머지 줄은 그대로 두었다: 브릿지가 처음으로 ''보고 싶어''를 직접 말해 곡을 뒤집는다. 마지막 후렴은 ''갈 거면서''를 ''갈 거야''로 바꿔 인정으로 끝난다. 훅 ''태양점 쳐볼까''(7자)가 후렴 첫 줄에 두 번 나오고 제목과 같다. 1절 ''볕 한 점''은 ''태양점''과 겹치는 말장난이라 받침 끝이어도 남겼다.'
