arc: '화법: 혼잣말(2절에서 ''너''에게 한 줄 건넴). 기: 불 켜 놓고 자는 밤, 시험 꿈, 거울 속 낯선 아저씨처럼 겉은 어른이고 속은 그대로인 나를 감정 없이 사물로만 보여 준다. 승: 어른이 되면 다 알 줄 알았다는 기대가 무너지고, 후렴 ''아직 어린걸''을 아무도 모르게 혼자 읊조린다. 전: 2절에서는 부장, 친구, 너처럼 남들도 똑같다는 것이 보인다. 브릿지에서 처음으로 ''지금도 무서워''라고 직접 말하고, 그래도 문을 열어 두고 나가는 것이 어른이라는 것을 행동으로만 보여 준다. 결: 마지막 후렴의 ''불 하나 켜 두고''가 ''네 불도 켜 둘게''로 바뀌어, 무서워서 켜던 불이 누군가를 위해 켜 두는 불이 된다. 아웃트로 ''내일 또 크자''로 열어 둔 채 끝낸다.'
line_plan: '[Verse 1] 1 사실: 불 켜 놓고 자는 밤 / 2 관찰: 다 큰 몸의 이불 / 3 관찰: 아직 꾸는 시험 꿈 / 4 사실: 빈 답안지 / 5 전환: 아침의 넥타이 / 6 관찰: 거울 속 낯선 아저씨(자조) / 7 리프레인: 키만 컸지 뭐. [Pre-Chorus] 8 사실: 어른이 되면 / 9 전환: 다 알 줄 알았는데(열린 끝). [Chorus] 10 훅 / 11 받침: 아무도 모르게 / 12 훅 / 13 받침: 불 하나 켜 두고 / 14 훅. [Verse 2] 15 사실: 큰소리치던 부장 / 16 관찰: 혼자 타는 엘리베이터 / 17 사실: 장난감 가게 앞 / 18 관찰: 오래 서 있던 친구 / 19 전환: 너도 알잖아 / 20 사실: 전화 받기 전 / 21 관찰: 목소리 고르는 거 / 22 리프레인: 키만 컸지 뭐. [Pre-Chorus] 23 관찰: 다들 아는 얼굴 / 24 전환: 오늘을 넘기는데(열린 끝). [Chorus] 25 훅 / 26 / 27 훅 / 28 / 29 훅. [Bridge] 30 전환: 사실은 나 / 31 진심: 지금도 무서워(감정어 한 번) / 32 사실: 현관 앞의 아침 / 33 전환: 그래도 나가 / 34 사실: 문은 열어 두고. [Final Chorus] 35 훅 / 36 받침 / 37 훅 / 38 바뀐 줄: 네 불도 켜 둘게 / 39 훅 / 40 메아리 훅. [Outro] 41 잘 자 / 42 내일 또 크자. 훅이 들어가는 줄은 10, 12, 14, 25, 27, 29, 35, 37, 39, 40으로 총 10번이다.'
why: '''아직 어린걸''은 다섯 음절이고 ''ㄹ'' 받침으로 끝나서 길게 늘여 부르기 좋다. 무엇보다 어른이라면 거의 누구나 속으로 해 본 말이라 가장 넓게 닿는다. 자우림의 ''~줄 알았어'' 원리로 프리코러스에서 과거의 기대를 세우고, 절은 명사에서 끊어 몽환적인 느린 호흡을 만들었다. 잔나비처럼 고백 직전에 ''키만 컸지 뭐''로 자기를 한 번 낮추고, 한로로처럼 마지막 후렴은 한 줄만 바꿔(''불 하나 켜 두고''를 ''네 불도 켜 둘게''로) 나를 지키던 말을 남을 지키는 말로 돌렸다. 제목은 정해진 ''어린'' 그대로 쓰고, 형태는 단어 하나로 분류했다. 훅 안에 이 낱말이 그대로 들어가 매 후렴마다 제목이 불린다.'
