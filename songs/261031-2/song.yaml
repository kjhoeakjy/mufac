sound_plan: 장조의 따뜻함에 프리코러스에서 단조로 살짝 꺾이는 화성으로 간다. 빠르기는 66bpm 안팎의 느린 6/8 흔들림이다. 드럼은 작은 방에서 친 라이브 드럼으로, 절에서는 브러시와 낮은 플로어탐만 쓰고 후렴에서 라이드로 넘어간다. 베이스는 피크로 친 둥근 소리로, 절에서는 뿌리음을 지키고 후렴에서는 경과음으로 천천히 움직인다. 화성은 코러스 이펙트를 건 깨끗한 일렉 기타 아르페지오가 중심이고, 프리코러스부터 볼륨 스웰 기타와 로즈가 들어온다. 2절에서는 글로켄슈필이 기타 선율을 겹쳐 꿈결 같은 질감을 더한다. 멜로디는 절에서 좁은 음역으로 말하듯 가고, 프리코러스에서 같은 음을 되풀이하며 밀어 올린다. 후렴 첫 음에서 위로 도약하고, 훅 끝 '걸'을 가성으로 길게 끈다. 보컬은 부드럽고 숨이 섞인 남성 테너로, 절은 반쯤 속삭이고 박자보다 조금 늦게 얹는다. 비브라토는 적게 쓰고, 후렴에만 가볍게 더블링한다. 2절이 끝나면 리드 기타가 보컬 선율을 되받는 짧은 간주가 나온다. 브릿지에서는 드럼과 기타가 빠지고 로즈와 거의 말하는 목소리만 남아 템포가 흔들린다. 마지막 후렴은 밴드가 모두 들어오고 3도 위 하모니가 더해져 가장 넓고 따뜻해진다. 아웃트로는 기타 하나와 글로켄슈필이 느려지다가 한 화음에서 끝난다. 공간은 작은 방에 스프링 리버브와 테이프 질감을 더하고, 사람 손으로 친 느슨한 박자를 살린다.
style: Korean indie rock, slow dreamy 2010s indie band sound, gentle 6/8 sway around 66 bpm, warm major key with a bittersweet minor turn. Male tenor, soft and airy, half-whispered verses, light falsetto on the hook, plain and unforced, slightly behind the beat, mature and sincere, sung in Korean, korean lyrics. Clean chorus-tinged electric guitar arpeggios carry verse 1 over round picked bass on roots and brushed live drums. Rhodes and a volume-swell second guitar enter at the pre-chorus on a rising repeated note. Chorus opens with an upward leap, ride cymbal, wide ringing guitars, melodic bass, long held falsetto note on the hook, soft doubled vocal. Glockenspiel doubles the guitar from verse 2. Lead guitar answers the vocal in a short break. Bridge drops to Rhodes and almost spoken voice, rubato. Final chorus warmest and widest, third harmony, drums open up. Outro on one guitar, slowing to a single chord. Small room, spring reverb, tape warmth, loose human feel. Dreamy, tender, wry.
exclude: autotune, synth lead, trap hi-hats
