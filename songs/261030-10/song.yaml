    style: 'Korean jazz pop, hard-swinging bebop small group, medium-up swing around 112 bpm, minor key opening into a bittersweet major chorus. Male baritone, warm, slightly husky, close to the mic, behind the beat, mature and sincere, sung in Korean, korean lyrics. Fat chewy upright bass up front, walking lines with ghost notes, slides, double stops, chromatic fills. Verse 1 whisper-quiet: bass, brushes, voice. Pre-chorus adds sparse piano comping. Chorus explodes: loud ride, punchy piano, sax and muted trumpet stabs answer the vocal, upward leap, long held note on the hook. Verse 2 drops back to quiet, busier bass fills. After chorus two: fast bebop piano solo, sax solo, trading fours, stop-time hits. Bridge near silence, bass and almost spoken voice, rubato. Final chorus loudest, shout horns, octave up. Sudden stop, final piano tension chord. Small jazz club, tape warmth. Wry, tender.'
    sound_plan: 단조로 시작하고, 후렴에서 씁쓸한 장조로 살짝 열리는 미디엄업 스윙이다. 빠르기는 약 112bpm. 업라이트 베이스가 곡의 주인공이다. 굵고 쫀득한 톤으로 고스트 노트, 슬라이드, 더블스톱, 반음 경과음을 섞어 걸으며 믹스 맨 앞에 선다. 드럼은 절에서는 스네어 위 브러시로 아주 작게 치고, 후렴에서는 스틱으로 바꿔 라이드 심벌을 크게 때린다. 피아노는 프리코러스에서 알터드 코드로 드문드문 컴핑하며 들어오고, 후렴에서는 세게 찍는다. 테너 색소폰과 뮤트 트럼펫은 후렴에서 보컬에 짧은 혼 스탭으로 대답한다. 멜로디는 절에서 좁은 음역으로 말하듯 박자 뒤에 늦게 붙고, 프리코러스는 같은 음을 되풀이하며 밀어 올린다. 후렴 첫 음은 위로 도약하고, 훅 끝 '해'는 길게 끈다. 마지막 후렴은 한 옥타브 올린다. 보컬은 따뜻하고 약간 허스키한 남성 바리톤으로, 마이크 가까이에서 거의 드라이하게 부른다. 공간은 작은 재즈 클럽의 라이브 룸에 테이프 질감을 얹는다. 전개는 조용함과 큼의 낙차를 크게 잡는다. 인트로는 베이스 혼자 걷는다. 1절은 베이스·브러시·목소리만으로 속삭이듯 간다. 첫 후렴에서 밴드 전체가 터지고, 2절에서 다시 작아지되 베이스 필이 더 바빠진다. 두 번째 후렴 뒤에는 기교 구간을 둔다. 빠른 비밥 피아노 솔로, 색소폰 솔로, 드럼과 네 마디씩 주고받기, 스톱타임 히트가 이어진다. 브릿지는 거의 정적에 베이스와 말하듯 하는 목소리만 남기고 루바토로 늘인다. 마지막 후렴은 혼 섹션 샤우트와 함께 가장 크고, 베이스와 드럼이 가장 바쁘게 움직인다. 끝은 갑자기 멈춘다. 베이스가 홀로 남고, 마지막 한 줄 뒤에 피아노 텐션 코드 하나로 닫는다.
