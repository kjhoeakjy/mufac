  genre: 재즈
  style: 베이스 쫀득. 재즈 기교 엄청 많음. 조용한 부분이랑 소리 큰 부분 차이 크게 존재.
sound_plan: 단조로 시작해 후렴에서 씁쓸한 장조로 열리는 미디엄업 스윙이다. 빠르기는 약 112bpm이고, 테너 색소폰·뮤트 트럼펫·피아노·업라이트 베이스·드럼으로 된 비밥 퀸텟 편성이다. 코드는 트라이톤 대리와 알터드 텐션으로 리하모니한다. 업라이트 베이스가 곡의 주인공이다. 굵고 쫀득한 톤으로 고스트 노트, 슬라이드, 더블스톱, 반음 경과음을 섞어 걷고, 믹스 맨 앞에 선다. 인트로는 반주 없는 베이스 솔로로 연다. 드럼은 절에서 브러시로 아주 작게 치고, 후렴에서는 스틱으로 바꿔 라이드를 크게 때린다. 피아노는 프리코러스에서 드문드문 컴핑하다가 후렴에서 블록 코드로 세게 찍는다. 혼은 후렴에서 보컬에 짧은 스탭으로 대답한다. 가사는 짧게 두고 연주 구간을 길게 늘린다. 첫 후렴 뒤에는 색소폰과 베이스가 프레이즈를 주고받는다. 두 번째 후렴 뒤에는 더블타임 필로 달리는 빠른 비밥 피아노 솔로가 나오고, 이어 알티시모로 치솟는 테너 솔로, 드럼과의 포바스 주고받기, 스톱타임 히트가 온다. 멜로디는 절에서 좁은 음역으로 박자 뒤에 늦게 붙어 말하듯 가고, 프리코러스는 같은 음을 되풀이하며 밀어 올린다. 후렴 첫 음은 위로 도약하고, 훅 끝 '해'는 길게 끈다. 보컬은 따뜻하고 약간 허스키한 남성 바리톤이고, 마이크 가까이에서 거의 드라이하게 부른다. 브릿지는 거의 정적에 베이스와 목소리만 남기고 루바토로 늘인다. 마지막 후렴은 반음 전조해 혼 섹션 샤우트 솔리와 함께 가장 크게 가고, 베이스가 가장 바쁘게 움직인다. 그 뒤 베이스 혼자 카덴차처럼 걷다가 갑자기 멈춘다. 마지막 한 줄 뒤에는 피아노 텐션 코드 하나로 닫는다. 공간은 작은 재즈 클럽의 라이브 룸에 테이프 질감이다.
style: 'Korean jazz pop, hard-swinging bebop quintet, medium-up swing around 112 bpm, minor verses, bittersweet major chorus, tritone-sub reharmonization. Male baritone, warm, slightly husky, close-miked, behind the beat, sung in Korean, korean lyrics. Fat chewy upright bass up front, walking with ghost notes, slides, double stops. Intro: bass solo. Verses whisper-quiet: bass, brushes, voice. Chorus explodes: loud ride, block-chord piano, tenor sax and muted trumpet stabs. Long instrumental stretches: sax and bass trade after chorus one; after chorus two a fast bebop piano solo, tenor sax solo with altissimo, double-time feel, trading fours, stop-time hits. Bridge near silence, bass and voice, rubato. Final chorus a half step up, shout horn soli, busiest bass. Bass solo tag, final piano tension chord. Small jazz club, tape warmth. Virtuosic, wry, tender.'
