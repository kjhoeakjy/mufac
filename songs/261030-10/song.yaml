  note: 가사 비중 낮추고 음악 비중 높여 재즈 기교 많이많이 보여줘
  plan: 지시가 가사 분량과 소리 둘 다를 말하므로 둘 다 고친다. 가사는 절과 브릿지에서 받침 줄만 덜어내 41줄을 36줄로 줄이고, 훅·후렴 글자·리프레인·마지막 후렴의 변화는 그대로 둔다. 빈 자리는 베이스 솔로 인트로, 1절 뒤 색소폰과 베이스의 주고받기, 피아노 솔로, 색소폰 솔로와 포바스, 베이스 솔로 태그 같은 연주 구간으로 채우고, 리하모니, 더블타임, 반음 전조 같은 재즈 기교를 style과 태그에 넣는다.
  changes:
  - 가사를 41줄에서 36줄로 줄였다. 훅, 후렴 글자, 리프레인, 마지막 후렴의 넷째 줄 변화는 그대로 두었다.
  - 1절에서 '얼굴은 다 아는 얼굴'과 '이런 건 금방 늘어'를 뺐다.
  - 2절을 '열한 살 내 눈에 / 올려다보던 그 등도'로 압축했다. 1절과 같은 다섯 줄 틀이다.
  - 브릿지에서 긴 줄 '아는 건 아직 하나도 없고'를 뺐다.
  - 인트로를 반주 없는 베이스 솔로(더블스톱, 슬라이드)로 바꿨다.
  - 첫 후렴 뒤에 색소폰과 베이스가 주고받는 간주를 새로 넣었다.
  - 두 번째 후렴 뒤 간주를 비밥 피아노 솔로(블록 코드, 더블타임)와 테너 솔로(알티시모, 포바스, 스톱타임)로 나눠 길게 늘렸다.
  - 마지막 후렴을 옥타브 상승에서 반음 전조와 혼 샤우트 솔리로 바꿨다.
  - 마지막 후렴 뒤에 업라이트 베이스 카덴차 솔로를 넣었다.
  - style과 sound_plan에 퀸텟 편성, 트라이톤 대리 리하모니, 블록 코드, 알티시모, 더블타임, 반음 전조 같은 재즈 기교를 더했다. 글자 수는 900자 안이다.
  before:
    lyrics: '[Intro: upright bass alone, slow walking line]


      [Verse 1: bass, brushes and voice only, whisper-quiet]

      모르는 말 앞에서

      먼저 끄덕이는 고개

      얼굴은 다 아는 얼굴

      책상 밑으로는

      다리가 떨리는데

      이런 건 금방 늘어

      들키지 않을 만큼만


      [Pre-Chorus: sparse piano comping enters, brushes build]

      낮춘 목소리 하나

      펴 둔 어깨 하나

      문 열고 나가면


      [Chorus: full band explodes, loud ride, horn stabs answer]

      어른인 척 해

      속은 아직 열한 살

      어른인 척 해

      아픈 건 집에 가서

      어른인 척 해


      [Verse 2: drops back to quiet, busier bass fills]

      열한 살 내 눈에

      올려다보던 그 어른들

      뭐든 다 아는 줄 알았던

      그 넓은 등도

      책상 밑에서는

      다리가 떨렸을까

      들키지 않을 만큼만


      [Pre-Chorus: piano comping, drums build]

      낮춘 목소리 하나

      펴 둔 어깨 하나

      문 열고 나가면


      [Chorus: full band explodes, loud ride, horn stabs answer]

      어른인 척 해

      속은 아직 열한 살

      어른인 척 해

      아픈 건 집에 가서

      어른인 척 해


      [Instrumental Break: bebop piano solo, tenor sax solo, trading fours, stop-time hits]


      [Bridge: near silence, upright bass and close voice, rubato]

      사실은 무서워

      아는 건 아직 하나도 없고

      그때 날 잡아 주던 손도

