arc: '화법: 혼잣말(아무에게도 말하지 않고 중얼거림, 브릿지에서만 속을 꺼냄). 기: 모르는 말 앞에서 먼저 끄덕이는 고개, 책상 밑에서 떨리는 다리를 담담히 놓는다. 승: 낮춘 목소리와 편 어깨로 문을 나서며 ''어른인 척 해'', 아픈 건 집에 가서. 전: 2절은 불 끈 밤, 어릴 때 다 아는 줄 알았던 어른들의 등을 떠올리고 그들의 다리도 떨렸을까 묻는다. 브릿지에서 처음으로 ''사실은 무서워''라고 말하고, 나를 잡아 주던 손도 떨렸다면 나도 떨면서 잡겠다고 받아들인다. 결: 마지막 후렴의 넷째 줄 ''아픈 건 집에 가서''가 ''누가 내 손 잡는 동안''으로 바뀐다. 척하는 이유가 나를 숨기는 데서 남을 잡아 주는 데로 넘어가고, 아웃트로는 리프레인 한 줄로 닫는다.'
line_plan: '[Verse 1] 1 사실: 모르는 말 앞(장면 하나) / 2 관찰: 먼저 끄덕이는 고개 / 3 관찰: 다 아는 얼굴 / 4 전환: 책상 밑으로는 / 5 관찰: 다리가 떨림 / 6 자조: 이런 건 금방 늚 / 7 리프레인: 들키지 않을 만큼만. [Pre-Chorus] 8 사실: 낮춘 목소리 / 9 사실: 편 어깨 / 10 전환(열림): 문 열고 나가면. [Chorus] 11 훅 / 12 관찰(자조): 속은 열한 살 / 13 훅 / 14 관찰: 아픈 건 집에 가서 / 15 훅. [Verse 2] 16 사실: 불 끈 밤(시점 바뀜) / 17 사실: 올려다보던 어른들 / 18 전환: 다 아는 줄 알았던 / 19 사실: 넓은 등 / 20 관찰: 책상 밑(1절 되받기) / 21 전환: 떨렸을까 / 22 리프레인. [Pre-Chorus] 23~25 = 8~10. [Chorus] 26 훅 / 27 / 28 훅 / 29 / 30 훅. [Bridge] 31 전환(진심): 무서워(감정어 한 번) / 32 인정: 하나도 몰라 / 33 사실: 나를 잡아 주던 손 / 34 전환: 떨고 있었다면 / 35 받아들임: 떨면서 잡을게. [Final Chorus] 36 훅 / 37 / 38 훅 / 39 바뀐 줄: 누가 내 손 잡는 동안 / 40 훅. [Outro] 41 리프레인. 훅이 들어가는 줄: 11, 13, 15, 26, 28, 30, 36, 38, 40으로 모두 9번.'
why: '''어른인 척 해''는 누구나 어제 한 번은 한 일이라서 설명 없이 바로 자기 얘기로 받힌다. 끝이 모음이라 스윙 위에서 늘여 부르기 좋고, 정해진 제목 ''어른''이 후렴 첫머리에 그대로 선다. 1절은 지금의 나, 2절은 어릴 때 올려다본 어른들로 시점을 바꿨다. 같은 훅이 처음에는 자조로 들리고, 마지막 후렴에서는 누군가를 위해 버티는 말로 바뀐다. 자우림의 ''~줄 알았던'' 과거 기대를 현재와 부딪히는 원리와 잔나비의 ''고백 직전에 자기를 낮추는 줄'' 원리를 가져왔고, 마지막 후렴은 한로로처럼 한 줄만 바꿔 결론을 냈다. 제목은 요청대로 ''어른''을 한 글자도 바꾸지 않은 단어 하나다.'
