title_kind: 단어 하나
tempo: 느림
arc: '화법: 우리(전곡 해요체). 기: 어른도 화장실에서 운다는 선언으로 열고, 찬물로 눈을 씻고 ''네 알겠습니다''에 느낌표를 붙이는 하루를 감정 없이 놓는다. 승: 옆자리와 건너편 사람도 같은 데서 울었다면, 하고 밀어 ''다들 그래요''라는 한 문장을 후렴으로 반복한다. 전: 2절은 밤으로 넘어가 잘 지낸다는 전화 끝에 차에서 내리지 못하는 사람을 보여 주고, 브릿지에서 처음으로 ''오늘 그 칸에 나도 있었어요'', ''밥은 반도 먹지 못했고요'', ''힘들어요''라고 털어놓는다. 결: 마지막 후렴의 끝줄 ''다들 그래요''가 ''나도 그래요''로 바뀌고, 코러스가 ''다들 그래요''로 받아 준 뒤, 아웃트로 ''내일 봐요 우리''로 닫는다.'
line_plan: '[Verse 1] 1 선언(사실): 어른도 화장실에서 운다 / 2 뒤집기(관찰): 물 내리는 소리 뒤에 숨긴다 / 3 사실: 빨개진 눈 밑(명사 끊김) / 4 관찰: 찬물이면 된다 / 5 사실: 답장은 ''네 알겠습니다'' / 6 관찰: 느낌표까지 붙인다(곡의 유일한 자조) / 7 리프레인: 별일 없는 날처럼. [Pre-Chorus] 8 전환: 옆자리 그 사람도 / 9 전환: 건너편 그 사람도 / 10 열어 둠: 같은 데서 울었다면. [Chorus] 11 선언(훅) 다들 그래요 / 12 모순: 울다가도 밥은 먹는다 / 13 선언(훅) / 14 모순: 그만둔다며 출근한다(공유 줄) / 15 선언(훅). [Verse 2] 16 사실: 잘 지낸다는 전화 끝에 / 17 관찰: 차에서 내리지 않는다 / 18 사실: 지운 번호(명사 끊김) / 19 관찰: 손가락은 외운다 / 20 전환: 현관문 앞에서는 / 21 관찰: 숨부터 고른다 / 22 리프레인. [Pre-Chorus] 23~25 반복. [Chorus] 26 훅 / 27 / 28 훅 / 29 / 30 훅. [Bridge] 31 전환: 남 얘기처럼 했지만 / 32 고백: 오늘 그 칸에 나도 있었다 / 33 고백: 밥은 반도 먹지 못했다(후렴 뒤집기) / 34 고백: 힘들어요 오늘은(감정 직접). [Final Chorus] 35 훅 / 36 모순 / 37 훅 / 38 모순 / 39 뒤집기: 나도 그래요(변화) / 40 (다들 그래요) 코러스 메아리. [Outro] 41 부탁: 내일 봐요 우리. 훅 위치: 11, 13, 15, 26, 28, 30, 35, 37, 40 = 9회.'
why: 직전 두 곡이 너에게와 혼잣말이어서 '우리' 화법이 필요했고, 화장실에서 울고 밥 먹고 다시 출근하는 일은 거의 모든 어른이 겪어 본 일이라 가장 넓습니다. 자우림의 원리처럼 모순(울다가도 밥은 먹어요, 그만둔다며 출근해요)을 나란히 두고 설명하지 않았고, 극동아시아타이거즈의 원리대로 마지막 후렴의 한 줄만 '다들'에서 '나도'로 바꿔 브릿지의 고백이 후렴 안에서 결론이 되게 했습니다. 한로로처럼 '내일 봐요 우리'라는 약속으로 닫았습니다. 제목은 '-요'로 끝나는 제목을 피하려고 훅 안의 낱말 '다들'만 떼어 단어 하나로 지었습니다. 부르는 순간 각자의 옆자리 사람이 떠오르는 말입니다.
