title: 잇초케
hook: 잇초케 / 오늘은 져도 돼 / 잇초케 / 내가 다 봤어
theme: 아픔
story: 시험, 면접, 경기, 고백 어디서든 진 날 먼저 웃어 버리는 사람에게 그 싸움을 다 지켜본 사람이 부르는 노래
