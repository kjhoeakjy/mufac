request:
  id: mvw53ijd
  title: 잇초케
  content: 위로하는 내용, 너무 슬프면 안됨 담백하게 위로
  genre: 메탈
instrumental: false
sound_plan: 단조 리프로 시작해 후렴에서 밝은 장조로 열리는 90년대 멜로딕 헤비메탈, 150 bpm 안팎의 갤럽 리듬이다. 화내는 메탈이 아니라 단단하게 버티는 메탈로, 위로는 소리의 힘이 맡고 가사는 낮게 누른다. 인트로는 트윈 리드 기타가 메인 리프 위에서 짧은 선율을 내고, 1절은 팜뮤트 갤럽 리듬 기타와 리프에 붙은 피크 베이스, 단단한 드럼 위에서 여성 메조가 낮고 차분하게 말하듯 좁은 음역으로 부른다. 프리코러스는 탐 필과 함께 같은 음을 반복하며 올라가고, 후렴은 하이게인 기타 두 대가 좌우로 벌어지고 더블 킥과 오픈 크래시가 들어오며 짧게 끊는 훅 뒤 둘째 줄을 길게 끈다. 2절에는 리드 기타가 보컬에 대답하고, 두 번째 후렴 뒤 트윈 리드 멜로딕 솔로가 나온다. 브릿지는 하프타임으로 내려앉아 클린 기타와 베이스, 거의 말하는 낮은 목소리만 남았다가 '소리 질러'에서 다시 쌓인다. 마지막 후렴은 한 옥타브 위 하모니와 메아리 줄에만 떼창을 얹어 가장 크게 가고, 한 번의 풀밴드 타격으로 딱 끊은 뒤 목소리 혼자 '잇초케'를 남긴다. 공간은 룸 마이크가 살아 있는 펀치 있는 드럼과 단단한 기타 벽.
style: 'Korean heavy metal, 90s melodic metal, galloping 150 bpm, minor-key riff lifting into a bright major chorus, steady and firm. Female mezzo lead, powerful clean chest voice, calm and low in verses, ringing in the chorus, slight grit on long notes, sung in Korean, korean lyrics. Twin lead guitar intro. Verse 1: palm-muted gallop, picked bass locked to the riff, tight drums, narrow talky melody. Pre-chorus adds toms, rising repeated note. Chorus: two wide high-gain guitars, double kick, open crash, short clipped hook, long held second line. Lead guitar answers the voice in verse 2. Melodic twin-lead solo after chorus two. Bridge: half-time, clean guitar, bass, near-spoken low voice. Final chorus biggest, octave-up harmony, gang vocals on the echo, hard stop. Punchy room drums, tight wall of guitars. Warm, steady, defiant.'
exclude: screamed vocals, autotune
