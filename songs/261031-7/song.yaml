title: 햇빛 쪽으로
hook: 햇빛 쪽으로
theme: 사랑
story: 마음 접었다고 말하면서 자꾸 그 사람 쪽으로 기우는 사람이, 돌려 놔도 창 쪽으로 가는 화분을 보며 혼자 중얼거리는 노래.
created: 2026-10-31 21:38
request:
  id: mvwdutql
  idea: 화분
  content: 추상적인 내용
  genre: 시티팝
  style: 여자보컬, 추상적
instrumental: false
sound_plan: 밝은 장조의 메이저 세븐 코드 위에서 프리코러스마다 살짝 단조로 꺾이는 시티팝이다. 빠르기는 98 bpm 안팎으로, 앞선 시티팝 세 곡(106·110·112)보다 한 걸음 느리게 둔다. 리듬은 부드러운 80년대 드럼머신이 맡는다. 게이트 스네어는 약하게, 하이햇은 작게 깐다. 베이스는 슬랩 대신 둥근 신스 베이스로, 싱코페이션 있는 짧은 선을 그리며 그루브를 이끈다. 화성은 Rhodes와 비브라폰이 1절을 맡고, 프리코러스부터 코러스 이펙트를 건 클린 기타와 따뜻한 패드가 더해진다. 멜로디는 절에서 좁은 음역으로 말하듯 가고, 프리코러스에서 같은 음을 되풀이하며 올라간다. 후렴은 첫 음절에서 위로 도약하고 '쪽으로'의 마지막 모음을 길게 늘인다. 보컬은 여자 소프라노로, 숨이 조금 섞인 가벼운 두성을 쓰고 박자 뒤에 살짝 걸친다. 절은 마이크 가까이 건조하게, 후렴은 공기 섞인 하모니를 쌓는다. 2절에는 마림바가 목소리에 대답하고, 두 번째 후렴 뒤에 짧은 신스 리드 솔로가 나온다. 브릿지는 베이스를 멈추고 Rhodes와 속삭이는 목소리만 남긴다. 마지막 후렴은 하모니를 더해 가장 넓게 연다. 끝은 비브라폰 혼자 남아 서서히 사라진다. 공간은 넓은 스테레오에 플레이트 리버브, 테이프의 온기를 둔다. 브라스와 색소폰은 쓰지 않는다.
style: 'Korean city pop, 80s sunlit AOR groove, around 98 bpm, major seventh chords, bittersweet minor turn in the pre-chorus. Female soprano, airy soft head voice, a little breath, just behind the beat, close dry verses, mature and sincere, sung in Korean, korean lyrics. Round synth bass on a syncopated line, soft 80s drum machine with light gated snare. Rhodes and vibraphone carry verse 1, narrow talky melody. Pre-chorus: chorus-effect guitar enters, rising repeated note, warm pad swells. Chorus opens with an upward leap, long held last note, stacked airy harmonies on the hook. Marimba answers the voice in verse 2. Short synth lead solo after chorus two. Bridge drops to Rhodes and near-whispered voice, bass stops. Final chorus fullest and widest. Outro fades on vibraphone alone. Wide stereo, plate reverb, tape warmth. Dreamy, wistful, sunlit.'
exclude: slap bass, saxophone, autotune
photo_query: potted plant sunny window
image_prompt: A young woman seen from behind in a loose cream sweater, sitting by a large apartment window in late afternoon light, one hand resting on a small potted plant whose leaves lean toward the glass. Warm amber and pastel peach tones, soft 80s city pop mood, quiet and wistful.
title_kind: 후렴 문장
tempo: 중간
arc: '기(혼잣말 화법): 벽 쪽으로 돌려 둔 화분이 하룻밤 사이 다시 창을 보고, 이름을 입에 안 올리겠다는 다짐도 아침이면 기운다. 승: 안 보려 해도 고개가 가는 곳, 후렴 ''햇빛 쪽으로''와 ''잎이 먼저 가''. 전: 2절은 해 없는 밤으로 시간이 바뀌고, 보낸 적 없는 ''잘 지내냐는 말''이 나온다. 브릿지에서 처음으로 ''기운 건 나'', ''보고 싶어''를 직접 말한다. 결: 마지막 후렴에서 ''돌려 놓아도''가 ''이젠 안 돌려''로, ''잎이 먼저 가''가 ''나도 따라가''로 바뀐다. 기우는 걸 받아들이고 아웃트로는 훅 한 줄로 끝낸다.'
line_plan: '[Verse 1] 1 사실: 벽 쪽으로 돌린 화분 / 2 전환 준비: 하룻밤 사이 / 3 관찰: 잎끝이 다시 창가 / 4 새 사실: 네 이름 등장 / 5 사실: 입에 안 올림 / 6 전환: 그런 다짐도 / 7 관찰(리프레인): 아침이면 기울어. [Pre-Chorus] 8~9 전환: 안 보려 해도 두 번 겹침 / 10 열어 둠: 고개가 가는 건. [Chorus] 11 훅 / 12 사실: 돌려 놓아도 / 13 훅 / 14 관찰: 잎이 먼저 가 / 15 훅. [Verse 2] 16 사실: 불 꺼진 방의 화분 / 17 시간 전환: 해 없는 밤 / 18 관찰: 잎은 그쪽 그대로 / 19 새 사실: 잘 지내냐는 말 / 20 사실: 보낸 적 없음 / 21 전환: 그런 마음도 / 22 리프레인: 아침이면 기울어. [Pre-Chorus] 23~25 반복. [Chorus] 26~30 반복(훅 26·28·30). [Bridge] 31 인정: 돌린 건 화분 / 32 인정: 기운 건 나 / 33 직접 감정: 보고 싶어 / 34 열어 둠: 그 한마디가. [Final Chorus] 35 훅 / 36 변화: 이젠 안 돌려 / 37 훅 / 38 변화: 나도 따라가 / 39 훅 / 40 훅. [Outro] 41 훅. 훅이 들어가는 줄: 11, 13, 15, 26, 28, 30, 35, 37, 39, 40, 41. 모두 11번.'
why: 연락 안 하겠다고 다짐하고도 마음이 그 사람 쪽으로 기우는 일은 거의 누구나 겪어 봤다. 그래서 다섯 후보 가운데 이 기분이 가장 넓다. 돌려 놔도 하룻밤 사이에 잎이 창 쪽으로 가는 화분은 누구나 아는 정확한 관찰이고, 설명 없이 마음과 겹친다. 이 비유는 브릿지에서 '돌린 건 화분 / 기운 건 나'로 딱 한 번만 드러낸다. 극동아시아타이거즈처럼 2절은 1절의 틀을 지키고 명사만 바꿨고, 절 끝 리프레인 '아침이면 기울어'를 고정했다. 한로로처럼 마지막 후렴은 두 줄만 바꿔 '돌려 놓아도'를 '이젠 안 돌려'로 뒤집었다. 제목은 외칠 수 있고 늘여 부르기 좋은 후렴 문장 그대로 골랐다.
