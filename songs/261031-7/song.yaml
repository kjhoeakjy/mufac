image_prompt: A young woman in a black hoodie sits on the edge of a small live club stage after the show, seen from behind, an electric guitar leaning beside her and a friend's hand resting on her shoulder. Hazy red and amber stage light, scattered cables, warm and steady mood.
title_kind: 지정
tempo: 빠름
arc: '화법: 너에게 말하기(진 사람을 옆에서 지켜본 사람의 말). 기: 명단 끝까지 내려가도 없는 이름, 진 쪽이 먼저 웃는 얼굴을 보여 주고 감정은 말하지 않는다. 승: 프리코러스의 풀린 주먹·내려간 어깨에서 ''오늘은 져도 돼, 내가 다 봤어''라는 한 문장으로 연다. 전: 2절은 남들이 던지는 ''다음엔 될 거래, 힘내''와 현관문 닫힌 뒤 터지는 숨으로 시점을 바꾸고, 브릿지에서 말하는 사람이 처음으로 ''나도 져 봤고 아무도 못 본 서러운 밤이 있었다''고 털어놓는다. 결: 마지막 후렴은 ''오늘은 져도 돼''가 ''내일 또 져도 돼''로, ''내가 다 봤어''가 ''내가 또 볼게''로 바뀌어 한 번의 위로가 계속 곁에 있겠다는 말이 되고, 아웃트로는 목소리 하나로 ''잇초케''만 남긴다.'
line_plan: '[Verse 1] 1 사실: 명단을 끝까지 봄 / 2 사실: 없는 이름 / 3 관찰: 다시 올려 보는 손 / 4 관찰: 그대로인 자리 / 5 관찰: 먼저 웃는 사람 / 6 관찰: 진 쪽이 꼭 그런다 / 7 전환(리프레인): 그 얼굴 안다. [Pre-Chorus] 8 사실: 풀린 주먹 / 9 사실: 내려간 어깨 / 10 전환: 이 밤 끝날 때까지(열린 끝). [Chorus] 11 훅 / 12 허락: 오늘은 져도 돼 / 13 훅 / 14 곁: 내가 다 봤어 / 15 훅 메아리. [Verse 2] 16 사실: 쏟아지는 말 / 17 관찰: 다음엔 될 거래 / 18 관찰: 힘내라는 소리 / 19 관찰: 끄덕이는 고개 / 20 전환: 현관문 닫히면 / 21 관찰: 그제야 터지는 숨 / 22 리프레인: 그 얼굴 알아. [Pre-Chorus] 23~25 반복. [Chorus] 26 훅 / 27 / 28 훅 / 29 / 30 훅 메아리. [Bridge] 31 고백: 나도 져 봤어 / 32 사실: 아무도 못 본 / 33 감정 직접: 서러운 밤 / 34 전환: 그래도 지금은 / 35 사실: 소리 지르는 나 / 36 열림: 언젠가 너도. [Final Chorus] 37 훅 / 38 바뀜: 내일 또 져도 돼 / 39 훅 / 40 바뀜: 내가 또 볼게 / 41 훅 메아리(떼창). [Outro] 42 훅 독창. 훅 줄 번호: 11, 13, 15, 26, 28, 30, 37, 39, 41, 42 = 10번.'
why: '''진 날''은 시험, 취업, 경기, 연애 어디에나 꽂히는 경험이라 가장 많은 사람이 자기 얘기로 받습니다. ''져도 돼''는 메탈의 큰 소리와 부딪히는 허락의 말이라 의외의 힘이 있고, 슬픔을 키우지 않고 ''내가 다 봤어''로 곁에 있다는 말만 남겨 담백합니다. 터치드의 후렴 낱말 바꾸기와 극동아시아타이거즈의 마지막 후렴 한 단어 뒤집기를 가져와 ''오늘은→내일 또'', ''다 봤어→또 볼게''로 바꿨고, 브릿지의 ''아무도 못 본 서러운 밤''이 처음 나와야 마지막 후렴의 ''볼게''가 다르게 들리게 했습니다. 절은 자우림처럼 명사에서 끊고 서술어를 빼서 리프 위에 짧게 얹었습니다. 제목은 지정된 소리말 한 단어를 그대로 쓰고 후렴 첫 줄과 셋째 줄에 세웠습니다.'
