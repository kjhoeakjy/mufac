sound_plan: 조성은 m9 코드의 단조 절에서 따뜻한 장조 후렴으로 열리고, 72bpm 하프타임 그루브로 느리지만 무겁게 간다. 리듬은 핑거스냅과 깊은 킥으로 1절을 비워 두고, 프리코러스에서 고스트 노트가 섞인 16분 하이햇이 들어오며, 후렴에서 박자 뒤에 늦게 떨어지는 두꺼운 스네어로 풀 비트가 된다. 베이스는 둥근 서브 베이스가 긴 음으로 뿌리를 지키다 후렴 끝마다 아래로 미끄러진다. 화성은 Wurlitzer가 인트로와 1절을 이끌고, 2절부터 해먼드 오르간이 목소리에 대답한다. 멜로디는 절에서 좁은 음역으로 말하듯 싱코페이션, 프리코러스는 같은 음을 반복하며 밀어 올리고, 후렴 첫 낱말에서 크게 도약해 down을 길게 벨팅한다. 보컬은 힘 있는 여성 알토, 따뜻한 흉성에 절제된 거침, 절은 가깝고 건조하게, 브릿지에 가성 한 줄, 후렴은 가스펠 스택 하모니. 간주는 Wurlitzer와 오르간, 브릿지는 비트를 빼고 Wurlitzer와 목소리만 남긴다. 마지막 후렴은 합창이 훅을 겹쳐 가장 크게, 애드리브를 얹고, 아웃트로는 Wurlitzer 혼자 느려지며 마지막 화음을 길게 둔다. 공간은 가깝고 따뜻한 아날로그, 리드는 앞에 건조하게, 코러스는 넓게.
style: 'R&B, 2020s gospel-tinged soul R&B, half-time groove at 72 bpm, minor verses opening to a warm major chorus. Powerful female alto, warm chest voice, controlled grit, talky verses behind the beat, belted chorus, one falsetto line in the bridge, sung in English, english lyrics, native English pronunciation. Intro: Wurlitzer chords alone. Verse 1: finger snaps, deep kick, round sub bass on long notes, narrow syncopated melody. Pre-chorus: 16th hi-hats with ghost notes, rising repeated note. Chorus: full beat, fat late snare, bass slides, upward leap on the first word, long held last word, stacked gospel harmonies. Verse 2 adds Hammond organ answers. Bridge drops to Wurlitzer and voice. Final chorus biggest, choir doubles the hook, ad-libs, ends on a held note. Close dry lead, wide backing choir, warm analog. Defiant, aching, free.'
exclude: autotune, rap verse, distorted guitar
