lyrics: |
  [Intro: Wurlitzer chords alone]

  [Verse 1: finger snaps, deep kick, sub bass on long notes]
  I know every way that this could end,
  So why do I keep looking one more time?
  It shows me who leaves and when they go,
  But it never shows me how it feels to be alive.

  [Pre-Chorus: ghost-note hi-hats, rising]
  I'm tired of knowing more than I can hold,
  So I tell my hands what I can't say:

  [Chorus: full beat, belted, stacked gospel harmonies]
  Put the stone down, put the stone down,
  I don't need the answer, I need the ground,
  And if I'm gonna lose it, let me feel it now,
  So put the stone down.

  [Verse 2: Hammond organ answers the voice]
  I let go of love before it ever left,
  'Cause I'd already seen the way it goes,
  I've been living like the ending's here,
  And I'm missing everything I'll never know.

  [Pre-Chorus: ghost-note hi-hats, rising]
  I'm tired of knowing more than I can hold,
  So I tell my hands what I can't say:

  [Chorus: full beat, belted, stacked gospel harmonies]
  Put the stone down, put the stone down,
  I don't need the answer, I need the ground,
  And if I'm gonna lose it, let me feel it now,
  So put the stone down.

  [Instrumental: Wurlitzer and organ break]

  [Bridge: beat drops, Wurlitzer and voice, falsetto]
  I was never scared of how it ends,
  I was scared of the middle, and the middle's all I've got.

  [Final Chorus: choir doubles the hook, ad-libs, biggest]
  Put the stone down, put the stone down,
  I don't need the answer, I need the ground,
  And I've seen how it ends, but I'm staying now,
  I PUT THE STONE DOWN.

  [Outro: Wurlitzer alone, slowing, last chord held]

  [End]
