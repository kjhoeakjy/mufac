title: 달의 구멍
hook: 달의 구멍에 숨자
theme: 사랑
story: 모든 연락을 끄고 싶은 밤에, 옆에 있는 사람에게 오늘만 같이 사라지자고 낮게 말하는 사람.
created: 2026-10-31 16:48
request:
  id: mvw3iuip
  title: 달의 구멍
  genre: 시티팝
  style: 여자 보컬, 감각적인
sound_plan: 장조의 메이저 세븐 화성에 프리코러스에서만 단조로 살짝 꺾이는 시티팝, 빠르기는 110 bpm 안팎의 느긋한 밤 그루브다. 리듬은 단단한 80년대 드럼과 16분 하이햇, 2절부터 셰이커를 얹는다. 베이스는 손가락으로 튕기는 펑키 베이스로, 고스트 노트와 옥타브 움직임으로 곡을 이끄는 주인공이다. 화성은 로즈 일렉트릭 피아노와 부드러운 폴리신스 아르페지오가 맡고, 프리코러스부터 코러스 이펙트를 건 클린 펑크 기타 커팅이 들어온다. 멜로디는 절에서 좁은 음역으로 말하듯, 프리코러스에서 같은 음을 되풀이하며 밀어 올리고, 후렴 첫 음 '달'에서 위로 뛰어 '숨자'를 길게 끈다. 보컬은 낮고 스모키한 여성 메조, 마이크 가까이 숨을 섞어 박자 뒤에 살짝 늦게 붙고, 후렴에서 두 줄 하모니가 감싼다. 공간은 넓은 스테레오와 플레이트 리버브로 밤 도시의 윤기를 낸다. 인트로는 베이스 리프와 아르페지오, 1절은 로즈와 베이스와 목소리로 비워 두고, 첫 후렴에서 패드와 하모니가 열린다. 2절은 셰이커와 기타 응답이 더해지고, 둘째 후렴 뒤 신스 리드 솔로 8마디가 나온다. 브릿지는 베이스가 멈추고 로즈와 패드 위에서 속삭이듯 부르며, 마지막 후렴은 가장 넓게 하모니와 가벼운 애드립을 얹은 뒤, 베이스 리프만 남아 페이드로 끝난다.
style: Korean city pop, 80s midnight groove, around 110 bpm, glossy and sensual, major seventh chords with a bittersweet minor turn in the pre-chorus. Female mezzo vocal, smoky low register, breathy and close to the mic, slightly behind the beat, cool, mature and sincere, sung in Korean, korean lyrics. Fingered funky bass with ghost notes and octave runs leads the groove. Rhodes chords and a soft polysynth arpeggio carry verse 1 over tight 80s drums with sixteenth hi-hats, lots of space, narrow conversational melody. Clean chorus-effect funk guitar cutting enters at the pre-chorus on a rising repeated note. Chorus opens with an upward leap, warm analog pads, two-part breathy harmonies on the hook, long held last word. Verse 2 adds shaker and guitar answers. Synth lead solo after the second chorus. Bridge drops to Rhodes, pad and near-whispered voice, bass stops. Final chorus fullest and widest, extra harmonies, light ad-libs. Outro fades on the bass riff alone. Wide stereo, plate reverb,
  polished studio. Sensual, cool, unhurried.
exclude: saxophone, slap bass, trap hi-hats
photo_query: woman window night moon city
image_prompt: A young woman in an oversized shirt sits by a large apartment window at night, seen from behind, a phone lying face down on the sill beside a glass. A round moon hangs over soft city lights. Deep navy and warm amber tones, quiet, sensual 80s city pop mood.
title_kind: 지정
tempo: 중간
arc: '화법: 너에게 말하기(옆에 있는 연인에게 낮게 건네는 청유). 기: 휴대폰을 뒤집어 두고 내일 알람은 맞춰 둔 채, 오늘은 없는 사람이 되어 창밖의 달을 밤에 뚫린 구멍으로 본다. 승: 둘이 들어가면 딱 맞을 그 구멍으로 ''달의 구멍에 숨자''고 말한다. 전: 2절은 시선이 너에게로 옮겨 가 막차 시간을 서로 묻지 않고 네 어깨의 바깥 냄새를 맡는다. 브릿지에서 처음으로 이게 도망인 걸 안다고 인정하고 ''네가 좋아''를 직접 말한다. 결: 마지막 후렴에서 ''너만 데리고''가 ''아침이 와도''로, 마지막 훅 ''숨자''가 ''살자''로 바뀌어 잠깐의 도피가 머물겠다는 뜻이 된다. 아웃트로는 1절의 알람을 끄는 한 줄로 끝난다.'
line_plan: '[Verse 1] 1 사실: 뒤집어 둔 휴대폰 / 2 관찰: 울려도 상관없다는 태도 / 3 관찰: 내일 알람은 맞춰 둔다(맞아 그거) / 4 전환: 그래도 오늘은 없는 사람 / 5 사실: 창밖의 달 / 6~7 관찰: 밤에 뚫어 놓은 동그란 구멍(곡의 유일한 비유) / 8 리프레인: 아직 가지 마. [Pre-Chorus] 9 사실: 저기 보여 / 10 전환: 둘이 들어가면 / 11 열린 끝: 딱 맞을 텐데. [Chorus] 12 훅 / 13 받침: 아무도 모르게 / 14 훅 / 15 받침: 너만 데리고 / 16 훅. [Verse 2] 17~18 관찰: 막차 시간은 서로 묻지 않는 밤(맞아 그거) / 19~20 사실: 네 어깨에 묻은 바깥 냄새 / 21~22 관찰: 손가락 하나로 가려지는 달(맞아 그거) / 23 전환: 거기면 충분하다 / 24 리프레인: 아직 가지 마. [Pre-Chorus] 25~27 반복. [Chorus] 28 훅 / 29 받침 / 30 훅 / 31 받침 / 32 훅. [Bridge] 33 인정: 도망인 거 안다 / 34 사실: 해 뜨면 또 나간다 / 35 전환: 그래도 오늘은 / 36 진심: 네가 좋아(감정어 직접, 곡에서 한 번). [Final Chorus] 37 훅 / 38 받침 / 39 훅 / 40 바뀜: 아침이 와도 / 41 바뀐 훅: 살자. [Outro] 42 결: 알람은 꺼 둘게(1절 3번 줄을 뒤집음). 훅 줄: 12, 14, 16, 28, 30, 32, 37, 39, 41(변주). 총 9회.'
why: 도망치고 싶은 밤과 그 밤을 같이 보내고 싶은 사람은 누구에게나 있어서, 0번이 가장 넓게 자기 얘기로 들린다. 조사 노트의 초안은 택시와 성산대교로 장면 하나를 끌고 가는 상황극이었기에, 이번에는 장면을 버리고 '휴대폰은 뒤집고 알람은 맞춰 두는' 태도로 다시 썼다. 자우림의 명사 끊김과 서술어 생략으로 줄을 짧게 끊었고, 한로로·극동아시아타이거즈의 원리대로 마지막 후렴에서 '숨자'를 '살자'로 한 글자만 바꿔 브릿지의 고백을 결론으로 만들었다. 아웃트로는 잔나비식으로 가장 높은 감정 뒤에 생활 말('알람은 꺼 둘게')로 내려오며, 1절의 알람을 뒤집는다. 제목은 지정된 '달의 구멍'을 그대로 쓰고 훅 안에 넣었으며, 형태는 짧은 명사구다.
