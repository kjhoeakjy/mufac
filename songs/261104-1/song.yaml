title: 내가 졌네
hook: 내가 졌네
theme: 사랑
story: 싸움 끝에 끝까지 버틴 사람이 혼자 남아, 지는 쪽을 택하며 오히려 가벼워지는 혼잣말.
created: 2026-11-04 11:59
request: {}
lang: ko
instrumental: false
sound_plan: 따뜻한 장조에 프리코러스에서 쓸쓸한 단조로 한 번 꺾이는 104bpm 미드템포 인디록. 인트로는 클린 일렉 기타 아르페지오 혼자 네 마디. 1절은 같은 기타에 멜로디를 움직이는 피크 베이스와 작은 방의 라이브 드럼(하이햇 8분음, 건조한 스네어)이 받치고, 멜로디는 좁은 음역에서 말하듯 담담하다. 프리코러스에서 드럼이 풀 비트로 열리고 같은 음을 반복하며 올라간다. 후렴은 두 번째 기타가 가볍게 크런치를 걸고 라이드로 바뀌며, '내가'에서 위로 도약해 '졌네'의 마지막 음을 길게 끈다. 3도 위 하모니 한 줄. 2절에 로즈가 들어오고 리드 기타가 보컬을 되받는다. 두 번째 후렴 뒤 멜로디컬한 8마디 기타 솔로. 브릿지는 기타 하나와 거의 말하듯 부르는 목소리만 남는다. 마지막 후렴은 글로켄슈필과 쌓은 하모니로 가장 크게, 보컬도 이때만 다 연다. 보컬은 꾸밈없고 약간 허스키한 여성 알토, 가깝고 건조하게, 박자보다 살짝 뒤에. 스프링 리버브와 테이프 질감, 사람 손 같은 느슨한 연주. 아웃트로는 기타 리프를 반복하다 툭 끊는다.
style: 'Korean indie rock, 2010s, mid-tempo 104 bpm, warm major key, bittersweet minor turn in the pre-chorus. Plain honest female alto, slightly husky, close dry vocal behind the beat, full voice only at the final chorus, sung in Korean, korean lyrics. Clean electric guitar arpeggios open alone. Verse 1: melodic picked bass, small-room live drums, narrow talky melody. Pre-chorus: drums open, rising repeated note. Chorus: crunchy second guitar, ride cymbal, upward leap on the first word, long held last note, third harmony. Verse 2 adds Rhodes, lead guitar answers the voice. 8-bar melodic guitar solo. Bridge strips to one guitar and near-spoken voice. Final chorus biggest, glockenspiel, stacked harmonies. Outro: guitar riff, then stops. Spring reverb, tape warmth, loose human feel. Wistful, sheepish, warm.'
exclude: synth lead, autotune, brass
photo_query: woman alone night city
image_prompt: A young woman in an oversized knit cardigan sits on a low rooftop ledge at night, seen from the side, an electric guitar resting across her knees. City lights blur far below, a single warm lamp beside her. Muted navy and amber tones, quiet and rueful.
short_scenes:
- The same woman stands on the rooftop at night, head tilted up, guitar strap over her shoulder, city lights wide behind her, warm amber lamp glow, navy sky.
- Close-up of her hand loosening on the guitar neck, fingers resting still on the strings, soft amber lamp light, navy shadows.
- The empty rooftop ledge after she has gone, the guitar leaning against the lamp, city lights still glowing below, calm navy and amber.
title_kind: 후렴 문장
tempo: 중간
arc: '화법: 혼잣말(상대 ''너''를 떠올리는 줄 포함). 기: ''이긴 쪽이 더 오래 운다''는 모순으로 열고, 끝까지 맞는 말만 고르던 자신을 미워하는 데서 멈춘다. 승: 자존심을 내려놓자 너만 보이고, 후렴은 ''내가 졌네'' 한 문장으로 패배의 가벼움과 ''네가 이겨서 다행''이라는 뒤집기를 말한다. 전: 2절은 시간이 지나 이긴 날들엔 이름이 없고 진 날만 노래가 된다는 쪽으로 시점을 옮기고, 브릿지에서 처음으로 ''보고 싶었어, 그게 다야''라고 직접 고백하며 싸운 이유조차 잊혔음을 인정한다. 결: 마지막 후렴의 넷째 줄이 ''네가 이겨서 다행이야''에서 ''너라면 또 질게''로 바뀌어, 같은 ''내가 졌네''가 체념이 아니라 스스로 고른 패배로 들린다.'
line_plan: '[1절] 1 정확한 말·모순(첫 줄 임팩트): 이긴 사람이 더 오래 아프다. 2 고백(둘째 줄 임팩트): 끝까지 버틴 건 나였다. 3 새 뜻: 옳은 말만 골라 하던 나. 4 정확한 말·감정 직접: 그런 나를 미워함(자기를 낮추는 줄). [프리코러스] 5 전환: 자존심을 내려놓는 조건. 6 새 뜻(열린 끝 -는데): 남는 건 너뿐 → 후렴 첫 음절로. [후렴] 7 훅·고백: 내가 졌네. 8 모순·선언: 진 쪽이 더 가볍다. 9 훅·고백: 내가 졌네. 10 뒤집기: 네가 이겨서 다행. [2절] 11 선언: 이긴 날엔 이름이 없다. 12 정확한 말: 진 날만 노래가 된다. 13 새 뜻: 고집으로 지킨 자리. 14 전환: 그 자리는 너 없이 넓기만 하다. [프리코러스] 15~16 = 5~6 반복. [후렴] 17~20 = 7~10 반복(훅 17, 19). [브릿지] 21 고백(곡에서 처음 직접 말하는 진심): 보고 싶었다, 그게 전부. 22 인정(열린 끝): 싸운 이유는 잊혔다. [마지막 후렴] 23 훅. 24 선언 유지. 25 훅. 26 바뀐 줄·고백: 너라면 또 지겠다. 훅 줄 번호: 7, 9, 17, 19, 23, 25 (6회).'
why: 자존심 때문에 끝까지 이겨 놓고 혼자 남은 경험은 연인이든 친구든 누구나 있어서, 가장 많은 사람이 자기 일로 받는다. '내가 졌네'는 4음절에 끝이 ㅔ 모음으로 열려 늘여 부르기 좋고, 설명 없이 뜻이 통해 제목이 곧 후렴 문장이 된다(대표곡 다수가 후렴 문장을 제목으로 삼는 형태를 따름). 극동아시아타이거즈의 '-네' 담담한 종결과 마지막 후렴에서 핵심어를 뒤집는 원리를 가져와 '졌네'를 패배에서 '또 질게'라는 선택으로 바꿨고, 잔나비처럼 고백(브릿지) 직전에 자기를 낮추는 줄(그 밤의 내가 미워)을 두었다. 조사 노트 초안의 칫솔·치약·휴대폰 같은 생활 소품은 상황극이 되므로 모두 버리고, '이긴 쪽이 더 오래 운다'는 모순 하나로 곡 전체를 세웠다.
