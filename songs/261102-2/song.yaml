title_kind: 후렴 문장
tempo: 중간
arc: '화법: 너에게 말하기 / 기: 다 끝났다고 선언했지만 너를 한 번 스치자 모든 감정이 다시 살아난다. / 승: 너는 나를 알아봤을까 묻고, 괜찮다는 말이 남에게도 나에게도 거짓말이었음을 인정한다. / 전: 브릿지에서 처음으로 진심을 말한다. 나는 떠난 적이 없고, 영혼의 반만으로 사는 법을 배웠을 뿐이다. / 결: 마지막 후렴 2행 ''A whole year of letting go comes undone''이 ''And I don''t even wanna run''으로 바뀌고, 4행 ''And all it took was one glimpse of you''가 ''Now I''d give it all for one glimpse of you''로 바뀌어, 무너짐이 바람으로 뒤집힌다.'
line_plan: '[Verse 1] 1행(선언): 너와는 끝났다고 모두에게 말했다. / 2행(고백): 한동안은 나도 정말 그렇게 믿었다. / 3행(전환): 너는 한때 내 사람이었던 적 없는 듯 스쳐 갔다. / 4행(정확한 말): 그 순간 모든 감정이 한 번 더 되살아났다. [Pre-Chorus] 1행(전환): 1초도 안 되는 시간이었다. / 2행(열어 둠): 그래도 알기엔 충분히 길었다. 후렴으로 떨어진다. [Chorus] 1행(고백, 훅 1): 너를 한 번 본 것만으로 나는 괜찮지 않다. / 2행(모순): 1년 동안 놓아 온 것이 풀려 버린다. / 3행(고백, 감정 직접): 여전히 너를 원하고, 거짓말은 못 한다. / 4행(뒤집기, 훅 2): 그 모든 건 너를 한 번 본 것으로 충분했다. [Verse 2] 1행(질문): 너는 그게 나인 줄 알았을까. / 2행(질문): 아니면 나는 그저 예전에 보던 얼굴일까. / 3행(고백): 모두에게 괜찮다고 말하고 다닌다. / 4행(모순): 할 수만 있다면 나도 그 말을 믿고 싶다. [Pre-Chorus] 1절과 같음. [Chorus] 같음(훅 3·4). [Bridge] 1행(처음 하는 진심): 사실 나는 떠난 적이 없다. / 2행(정확한 말, 큰말 soul): 내 영혼의 반만으로 사는 법을 배웠을 뿐이다. [Final Chorus] 1행 같음(훅 5). / 2행(뒤집기): 이제는 도망치고 싶지도 않다. / 3행 같음. / 4행(뒤집기, 훅 6): 이제는 너를 한 번 볼 수만 있다면 다 주겠다. 훅은 Chorus 1행과 4행, 세 번의 후렴에서 모두 6번 나온다.'
why: '''One glimpse of you''는 열린 모음 you로 끝나서 길게 늘여 부를 수 있고, 세 번 불러도 어색하지 않습니다. 이별 뒤 ''괜찮다''고 말해 본 사람이라면 누구나 자기 일로 받아들일 수 있습니다. 레퍼런스 노트 초안의 빗속 신호등, 택시, 지명 같은 장면 소품은 모두 걷어내고 ''한순간에 무너지는 회복''이라는 마음만 남겼습니다. 제목과 훅을 같은 짧은 말로 맞추는 원칙은 No Scrubs와 Say My Name에서, 작은 편곡으로 시작해 하모니로 부풀리는 전개는 Best Part에서 가져왔습니다. 마지막 후렴에서는 ''all it took''을 ''I''d give it all for''로 바꿔, 같은 훅이 원망에서 갈망으로 뒤집혀 들리게 했습니다.'
