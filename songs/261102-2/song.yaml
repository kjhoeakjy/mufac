lyrics: |
  [Intro: tremolo guitar and finger snaps]

  [Verse 1: half beat, synth bass, close voice]
  I told the world that I was done with you,
  And for a while I swore that it was true,
  Then one look and you were almost mine,
  And I felt all of it one more time

  [Pre-Chorus: hi-hats enter, rising]
  It wasn't even a second long,
  But it was long enough to know

  [Chorus: full beat, stacked harmonies]
  One glimpse of you and I'm not fine,
  A whole year of letting go, undone,
  'Cause I still want you, I can't lie,
  And all it took was one glimpse of you

  [Verse 2: muted guitar answers the voice]
  Did you even know that it was me?
  Or am I just a face you used to see?
  I keep tellin' everyone I'm good,
  And I'd believe me too, if I could

  [Pre-Chorus: hi-hats enter, rising]
  It wasn't even a second long,
  But it was long enough to know

  [Chorus: full beat, stacked harmonies]
  One glimpse of you and I'm not fine,
  A whole year of letting go, undone,
  'Cause I still want you, I can't lie,
  And all it took was one glimpse of you

  [Instrumental: guitar and pad interlude]

  [Bridge: beat drops, guitar and falsetto]
  Truth is I was never gone at all,
  I just learned to live with half my soul

  [Final Chorus: widest harmonies, ad-libs]
  One glimpse of you and I'm not fine,
  And I don't even wanna run,
  'Cause I still want you, I can't lie,
  Now I'd give it all for one glimpse of you

  [Outro: guitar loop fading]

  [End]
