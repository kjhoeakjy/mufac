title: Never Dark Enough
hook: It's never dark enough to leave
theme: 사랑
story: 해가 지지 않는 밤, 떠나겠다고 몇 번이나 말하고도 끝내 상대 곁을 떠나지 못하는 사람이 부른다.
created: 2026-11-02 15:46
request:
  id: mvyw6228
  idea: white night
  genre: 밴드
  lang: en
lang: en
instrumental: false
sound_plan: 밝은 장조에 126bpm 안팎의 4/4 밴드 팝록으로 가고, 프리코러스에서 한 번 단조로 꺾는다. 드럼은 라이브 룸 사운드로 킥은 punchy, 스네어는 crisp하게 잡는다. 절에서는 하이햇 8분음이 달리고, 프리코러스에서 탐이 쌓이며, 후렴에서 크래시가 열린다. 베이스는 피크로 8분음을 몰고 가다가 후렴에서 옥타브로 뛴다. 화성은 크런치 리듬 기타 두 대가 맡고, 1절에는 한 대만 쓰다가 후렴에서 좌우로 넓게 벌린다. 리드 기타는 후렴 훅 멜로디를 그대로 따라 부르고, 2절에서는 보컬에 대답한다. 2절부터 신스 패드가 뒤를 받친다. 멜로디는 절에서 좁은 음역으로 말하듯 짧게 끊는다. 프리코러스는 같은 음을 되풀이하며 밀어 올리고, 후렴 첫 낱말에서 위로 도약해 'leave'를 길게 끈다. 보컬은 맑고 힘 있는 여성 알토 흉성으로, 꾸밈없이 진심으로 부른다. 후렴은 더블링하고, 두 번째 후렴부터 3도 하모니를 얹는다. 공간은 라이브홀로, 보컬은 앞에 밝게, 기타는 넓게 둔다. 인트로는 맑은 기타 리프 하나로 열고 드럼 필로 밴드를 불러들인다. 두 번째 후렴 뒤에는 짧은 멜로딕 기타 솔로를 둔다. 브릿지는 하프타임으로 내려앉아 아르페지오 기타와 목소리만 남긴다. 마지막 후렴은 온음 전조로 가장 크게 가고, 마지막 훅 한 줄은 떼창으로 받는다. 아웃트로는 인트로 리프를 두 번 치고 꽉 끊어 끝낸다.
style: 'Pop rock band, 2010s indie pop rock, upbeat 126 bpm, bright major key, minor turn in the pre-chorus. Clear powerful female alto, warm chest voice, earnest, sung in English, english lyrics, native English pronunciation. Intro: bright clean guitar riff, then a drum fill brings the band in. Verse 1: one crunchy guitar, driving picked bass, tight punchy live drums, eighth hi-hats, short talky melody. Pre-chorus: tom build, rising repeated note. Chorus: two crunchy guitars wide, open crash, lead guitar doubles the hook, bass octave jumps, upward leap, long held last note, third harmony. Verse 2 adds synth pad and lead guitar answers. Short guitar solo after chorus two. Bridge: half-time, arpeggio guitar and voice. Final chorus key change up, gang vocal on the last line, hard stop. Live hall, wide guitars. Sleepless, hopeful.'
exclude: autotune, synth pop beat
photo_query: bright summer night rooftop
image_prompt: A young woman in a denim jacket seen from behind on a city rooftop past midnight, the sky still pale white and blue. An electric guitar case leans by her feet, a second figure sits beside her. Soft cream and cold blue tones, restless and tender.
short_scenes:
- Same rooftop under the pale white midnight sky, the woman stands with arms wide, the other figure laughing beside her, wind in her hair, cream and blue light at its brightest.
- Close-up of two hands almost touching on the rooftop ledge beside the guitar case, pale blue light on the fingers, quiet and hesitant.
- The empty rooftop as the sky turns gold, the guitar case left open, two jackets folded together on the ledge, warm and calm.
title_kind: 짧은 명사구
tempo: 빠름
arc: '화법: 너에게

  기: 밤이 오면 가겠다고 했는데, 너와 있으면 어둠이 오지 않는다(떠나지 못하는 나).

  승: 너는 붙잡지도 보내지도 않고, 나는 어둠이 대신 끝내 주기만 기다린다.

  전: 브릿지에서 처음으로 진심을 말한다. 원래 밤 때문이 아니었다. 한 번만 말하면 영원히 남겠다.

  결: 마지막 후렴 3행 ''So how am I supposed to sleep?''이 ''And I don''t need the night to stay''로 바뀐다. 그러면 같은 훅이 미련이 아니라 남기로 한 선언으로 들린다.'
line_plan: '[Verse 1] (ABCB)

  1. 고백: 밤이 오면 떠나겠다고 너에게 약속했다

  2. 고백: 그 말을 끝없이 되풀이해 왔다

  3. 뜻: 떠날 기회는 늘 있었다

  4. 전환: 네가 어둠을 오지 않게 만든다

  [Pre-Chorus]

  1. 모순: 남은 것도 떠난 것도 아니다

  2. 열어 둠: 가려고 할 때마다(후렴 첫 줄로 이어짐)

  [Chorus] (후렴 한 덩어리, 훅=1·4행)

  1. 모순(훅): 떠날 만큼 어둡지 않다

  2. 고백/모순: 곁에 있어도 그립다(감정 직접)

  3. 질문: 이러고 어떻게 잠드나

  4. 선언(훅): 떠날 만큼 어둡지 않다

  [Verse 2] (ABCB)

  1. 뜻: 너는 머물라고 한 적이 없다

  2. 뜻: 가라고 한 적도 없다

  3. 고백(긴 줄): 어둠이 대신 끝내 주길 기다린다

  4. 전환: 어둠은 계속 안 된다고 한다

  [Pre-Chorus] 반복

  [Chorus] 반복

  [Bridge] (훅 없음, 처음 하는 진심)

  1. 정확한 말: 원래 밤 때문이 아니었다

  2. 부탁/고백: 한 번만 말하면 영원히 남겠다(큰말 forever 단 한 번)

  [Final Chorus]

  1·2·4행 동일, 3행 뒤집기: 머무는 데 밤이 필요 없다. 4행 훅은 대문자 떼창.

  훅 위치: 1후렴 1·4행, 2후렴 1·4행, 마지막 후렴 1·4행, 총 6번'
why: 후보 0은 '어둡지 않아서 못 떠난다'는 모순 하나로 백야와 미련을 함께 담는다. 설명 없이도 누구나 자기 이별 앞의 망설임으로 받아들일 수 있다. Do I Wanna Know?처럼 후렴 가운데 줄을 물음으로 두어 따라 부르는 사람이 스스로 묻게 했다. Mr. Brightside에서는 첫 후렴을 일찍 터뜨리는 구조를 가져왔다. 마지막 후렴에서는 '밤이 필요 없다'로 한 줄만 바꿔, 핑계였던 어둠이 사실은 '너'였다는 고백으로 뒤집었다. 레퍼런스 노트의 장면형 가사(빵집, 갈매기, 커피)는 버리고, night와 dark만 남긴 뜻의 가사로 다시 썼다.
