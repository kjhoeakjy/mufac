title: 행복하지 마
hook: 행복하지 마
theme: 사랑
story: 헤어진 사람이 잘 지내길 바라면서도 너무 행복하지는 말라고, 반은 웃으며 반은 진심으로 너에게 말하는 중간 템포의 노래
created: 2026-11-21 12:50
request: {}
lang: ko
instrumental: false
sound_plan: 밝은 장조에 프리코러스에서 단조 코드로 한 번 씁쓸하게 꺾이는 92bpm 중간 템포의 어쿠스틱 팝. 인트로는 카포 끼운 어쿠스틱 기타 스트럼 혼자 네 마디. 1절은 두 번째 기타의 핑거피킹과 목소리만, 둥근 어쿠스틱 베이스가 뿌리음을 가볍게 짚고 멜로디는 좁은 음역에서 말하듯 간다. 프리코러스에서 카혼이 들어와 같은 음을 되풀이하며 밀어 올리고, 후렴은 '행복하지 마'의 첫 음에서 위로 뛰어 마지막 '마'를 길게 끈다. 후렴에는 손뼉과 스트럼, 더블링한 보컬과 3도 하모니가 붙는다. 2절은 가벼운 피아노가 보컬에 대답하고, 두 번째 후렴 뒤에 휘파람 선율 간주를 둔다. 브릿지는 기타 하나와 거의 말하듯 부르는 목소리만 남겨 가장 조용하게. 마지막 후렴은 기타 둘·피아노·카혼·하모니가 다 들어와 가장 따뜻하고, 휘파람이 훅에 대답한다. 보컬은 맑고 가까운 여성 메조, 박자에 살짝 늦게, 목소리에 작은 웃음이 묻어 있고 마지막 후렴에서만 소리를 다 연다. 거실처럼 건조하고 따뜻한 공간에 기타 줄 소리가 들리게, 끝은 기타 스트럼 하나가 느려지며 멈춘다.
style: 'Korean acoustic pop, 2010s, warm 92 bpm, bright major key with a bittersweet minor turn in the pre-chorus. Clear female mezzo, close and light, behind the beat, a small smile in the voice, full voice only at the final chorus, sung in Korean, korean lyrics. Intro: strummed acoustic guitar alone. Verse 1: fingerpicked guitar, round acoustic bass, narrow conversational melody. Pre-chorus: cajon enters, rising repeated note. Chorus: handclaps, upward leap on the hook, long held last word, doubled vocal, third harmony. Verse 2 adds light piano answering the voice. Whistle interlude after chorus two. Bridge: one guitar and near-spoken voice. Final chorus warmest, stacked harmonies, whistle answers the hook. Outro: guitar alone, slows, then stops. Living room sound, dry and warm. Wry, tender, bittersweet.'
exclude: electric guitar, synth, autotune
photo_query: woman acoustic guitar window
image_prompt: A young woman in a cream knit sweater sits sideways on a wooden floor by an open window in late afternoon, an acoustic guitar on her lap and a mug beside her. Warm golden light, soft dust in the air, cream and amber tones, wry and tender mood.
short_scenes:
- The same woman by the window tilts her head back laughing as she strums the guitar, golden light flooding the room, cream and amber tones.
- Close-up of her hand resting still on the guitar strings, fingers loose, warm afternoon light on the wood grain.
- Evening blue light in the same room, the guitar leaning against the window frame beside the empty mug, her silhouette walking out of the frame.
title_kind: 후렴 문장
tempo: 중간
arc: '화법: 너에게. 기(1절): 잘 지내라던 말이 반만 진심이었다고 털어놓고, 나머지 반은 이 노래로 하겠다고 연다. 승(프리코러스→후렴): 누구 곁에서든 네가 웃을 때면 ''행복하지 마'', 나보다 덜 웃으라는 쩨쩨한 진심. 전(2절→브릿지): 2절은 시간이 지나 네가 잘 산다는 얘기에 반갑고 밉고, 나도 이제 잘 웃는다는 걸 인정한다. 브릿지에서 처음으로 진짜 속을 말한다: 네가 우는 건 싫다, 내 탓이라 해도. 결(마지막 후렴): ''덜 웃어 줘''가 ''더 웃어 줘''로, ''행복은 말고''가 ''행복까지''로 바뀌어, 같은 ''행복하지 마''가 웃으며 하는 축복으로 들린다. 아웃트로는 가사 없이 기타 하나로 닫는다.'
line_plan: '[1절] 1: 고백(두 줄에 걸친 첫 문장) - 너에게 했던 작별 인사를 꺼낸다. 2: 뒤집기 - 그 인사가 반만 진심이었다. 3: 전환 - 나머지 반이 따로 있다. 4: 정확한 말 - 그 반은 노래로만 할 수 있는 말이다. [프리코러스] 5: 전환 - 누구 곁이든 상관없이. 6: 열어 두기(-면) - 네가 웃는 순간으로 후렴에 떨어진다. [후렴] 7: 부탁(훅) - 행복하지 말라는 쩨쩨한 진심. 8: 부탁 - 나보다 덜 웃으라는 비교. 9: 모순 - 잘 지내되 행복은 빼라는 구분, 공유용 줄. 10: 부탁(훅) - 되풀이로 못 박음. [2절] 11: 새 뜻 - 시간이 지나 네가 잘 산다는 소식. 12: 모순 - 반가움과 미움이 같이 온다. 13: 전환 - 나도 달라졌다. 14: 정확한 말 - 나도 웃으며 산다는 자조 섞인 인정. [프리코러스] 15~16: 1절과 같음. [후렴] 17~20: 첫 후렴과 같음. [브릿지] 21: 고백 - 곡에서 처음 나오는 진심, 네가 우는 건 싫다. 22: 정확한 말 - 내 탓이라 해도 싫다, 바라던 게 반대였다는 인정. 훅 없음. [마지막 후렴] 23: 부탁(훅) - 같은 말이 다르게 들림. 24: 뒤집기 - 덜을 더로. 25: 뒤집기 - 행복은 말고를 행복까지로. 26: 부탁(훅) - 웃으며 하는 거짓말이 된 훅. 훅 줄 번호: 7, 10, 17, 20, 23, 26 (총 6회).'
why: 헤어진 사람에게 잘 지내라고 하면서 속으로는 너무 잘 지내지는 말라고 바라는 마음은 거의 누구나 겪어 본, 그러나 입 밖에 내지 않는 진심이라 가장 넓게 닿는다. 자우림이 '미안해'와 '미워해'를 설명 없이 나란히 둔 것처럼 '잘 지내길, 행복은 말고'라는 모순을 풀지 않고 후렴에 세웠다. 브릿지에서 처음으로 '네가 우는 건 싫어'라는 직진 고백을 꺼내고, 한로로와 극동아시아타이거즈처럼 마지막 후렴에서 '덜'을 '더'로, '행복은 말고'를 '행복까지'로 한 글자씩 뒤집어 같은 훅이 축복으로 들리게 했다. 제목은 외치기 쉬운 5음절 부탁 문장이고 모음으로 끝나 길게 늘여 부를 수 있어 후렴 문장 그대로 썼다.
