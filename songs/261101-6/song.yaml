polish:
- '고친 줄 없음: 점검표를 다시 돌려도 고쳐야 할 줄이 나오지 않았다.'
- '도입부: 1절 첫 줄 ''보지도 않고 다 봤다며''는 모순으로 바로 연다. 사물이나 장소 서술이 아니다.'
- '후렴: 네 줄이 모두 훅 ''네가 작두냐''를 되풀이하거나 직진하는 명령이다. 훅은 다섯 글자이고 첫 줄과 마지막 줄에 있으며 제목도 들어 있다. 펑크·락 곡이라 외침형 후렴을 그대로 둔다.'
- '브릿지: ''나도 남의 팔자에 / 칼을 댄 밤이 있어''는 곡에서 처음 나오는 인정이고 곡을 한 번 뒤집는다. 훅도 없다.'
- '마지막 후렴: ''씨발 나도 작두냐'', ''남의 팔자에 칼 대지 마'' 두 줄이 바뀌어 화살이 자신에게 돌아온다. 그대로 둔다.'
- '추상: 생활 소품, 장소, 시각이 없다. 사물은 작두를 뜻하는 칼·맨발뿐이고 ''어떤 마음''만 남는다.'
- '말장난: ''날 위에서 날을 바꿔'' 하나뿐이라 둔다. ''맨발로 춤을 추네'' 반복은 리프레인이라 허용한다.'
- '어미: 해체 종결은 전체의 3분의 1 아래이고 ''-다/-었다''로 끝나는 줄은 없다. 짧은 부정도 ''않고'', ''대지 마'' 꼴이라 고칠 것이 없다.'
- '감정어: 직접 쓴 감정어는 없다. 하지만 ''지랄 마'', ''피는 내가 흘리는데''가 분노와 아픔을 바로 말하므로 후렴을 건드리지 않는다.'
- 욕설은 장르와 화자의 태도에 맞아 사용자가 쓴 그대로 둔다.
