title: 작두
hook: 네가 작두냐
theme: 어른
story: 남의 팔자를 다 안다는 듯 떠드는 사람에게, 늘 듣기만 하던 사람이 처음으로 소리 지르며 되묻는다.
created: 2026-11-01 14:50
request:
  id: mvxer9yq
  title: 작두
  genre: 락
  style: 빠르고 욕하고 소리지르기
instrumental: false
sound_plan: 단조 파워코드의 거친 락, 152bpm 안팎의 빠른 8비트로 달린다. 드럼은 한 방에서 친 라이브 드럼으로 킥은 단단하고 스네어는 두툼하며, 절은 닫힌 하이햇, 후렴은 크래시를 열어 둔다. 베이스는 피크로 치며 기타 리프와 킥에 붙어 8분음으로 밀고, 브릿지에서는 혼자 남아 하프타임으로 박자를 지킨다. 디스토션 리듬 기타 둘을 좌우에 두고 절은 팜뮤트, 후렴은 기타 벽으로 연다. 멜로디는 절에서 좁은 음역의 말하듯 내지르는 짧은 프레이즈, 프리코러스는 같은 음을 반복하며 올라가고, 후렴 첫 음절 '네가'에서 위로 뛰어 짧게 끊어 치는 훅을 외친다. 보컬은 거친 결의 남성 흉성으로 소리 지르되 음정은 지키고, 후렴 훅은 떼창이 받아친다. 인트로는 기타 리프 혼자 시작해 전 밴드가 들이닥치고, 2절에 리드 기타가 보컬에 대답하며, 두 번째 후렴 뒤 지저분한 8마디 기타 솔로 후 갑자기 멈춘다. 브릿지는 베이스와 거의 말하는 목소리로 내려앉아 고백을 하고, 마지막 후렴은 옥타브 위 외침과 떼창으로 가장 크게 터진 뒤 리프 한 번으로 딱 끊는다.
style: 'Korean rock, 2000s garage punk edge, fast 152 bpm, driving straight eighths, minor key power chords. Male lead, raspy chest voice, shouted and furious, talky clipped verses right on the beat, screamed hook, sung in Korean, korean lyrics. Intro: one distorted guitar riff alone, then live drums and picked bass slam in. Verse 1: palm-muted riff, closed hi-hat, bass locked to the kick, narrow shouted melody. Pre-chorus: toms, rising repeated note, guitars open. Chorus: two distorted guitars left and right, open crash, fat snare, upward leap on the first word, short clipped hook, gang vocals shout the hook back. Verse 2 adds a lead guitar answering the voice. Noisy 8-bar guitar solo. Bridge: half-time, bass and near-spoken voice. Final chorus loudest, octave-up shout, hard stop. Live room drums, raw and loud. Angry, defiant, cathartic.'
exclude: autotune, synth pop beat, string orchestra
photo_query: punk rock singer shouting
image_prompt: A man in his thirties seen from the side, black hoodie, shouting into a microphone on a stand in a small dim rock club. Red stage light, a distorted electric guitar leaning on an amp behind him. Gritty red and black tones, defiant and raw.
short_scenes:
- The same man in the black hoodie screaming the chorus, fist raised, red stage light flaring, the guitarist behind him bent over the amp, crowd hands blurred in front.
- Close-up of his hand gripping the microphone stand, knuckles white, red light on metal, sweat on the skin, the amp glowing in soft focus.
- After the last chord, the empty small stage in red light, microphone stand tilted, guitar leaning on the amp, the man sitting on the stage edge from behind.
title_kind: 지정
tempo: 빠름
arc: '화법: 너에게. 기(1절): 보지도 않고 다 안다는 너, 틀릴수록 더 크게 말하는 너가 남의 팔자 위에서 춤추는 모습을 못 박는다. 승(프리코러스→후렴): 피는 내가 흘린다는 정확한 말로 밀어 올려 ''네가 작두냐''를 내지른다. 전(2절→브릿지): 2절은 어제와 오늘 말을 바꾸는 너로 시간이 바뀌고, 브릿지에서 처음으로 나도 남의 팔자에 칼을 댄 밤이 있다고 고백한다. 결(마지막 후렴): ''씨발 네가 작두냐''가 ''씨발 나도 작두냐''로, ''내 팔자에''가 ''남의 팔자에''로 바뀌어 분노가 나와 모두를 향한 말이 된다. 아웃트로는 가사 없이 리프 한 번과 끊음.'
line_plan: '[Verse 1] 1 모순: 보지 않고 다 봤다는 사람 / 2 선언(정확한 말): 틀릴수록 더 크게 말한다 / 3 새 뜻: 남의 팔자 위라는 자리 / 4 새 뜻+리프레인: 그 위에서 춤춘다(작두 비유 한 번). [Pre-Chorus] 5 전환: 욕으로 판을 뒤집음 / 6 정확한 말, 열린 끝(-는데): 피는 내가 흘린다. [Chorus] 7 질문(훅) / 8 질문 강화, 욕을 얹은 훅 / 9 부탁·명령: 내 팔자에 칼 대지 마 / 10 질문(훅). 훅 줄: 7,8,10. [Verse 2] 11 새 뜻(시간 전환): 어제는 망한다던 말 / 12 뒤집기(정확한 말): 오늘은 될 줄 알았다는 말 / 13 전환: 칼날 위에서 하루를 바꿔 디딤 / 14 리프레인: 4번과 같은 줄. [Pre-Chorus] 15~16 5~6 반복. [Chorus] 17~20 7~10 반복, 훅 줄 17,18,20. [Bridge] 21~22 고백: 나도 남의 팔자에 칼을 댄 적이 있다(훅 없음). [Final Chorus] 23 질문(훅) / 24 뒤집기: 나도 작두냐 / 25 부탁·명령의 확장: 남의 팔자에 칼 대지 마 / 26 질문(훅). 훅 ''네가 작두냐'' 총 8회, ''작두냐'' 9회.'
why: '''네가 작두냐''는 명절 어른, 직장 상사, 훈수 두는 선배처럼 누구에게나 있는 ''다 아는 듯 떠드는 사람''에게 그대로 던질 수 있어 가장 넓게 공감된다. 크라잉넛 ''말달리자''의 원리대로 외침 앞에 모순과 선언을 쌓아 두고, 상황극 없이 ''팔자''와 ''칼''이라는 뜻만 남겨 누구나 자기 사람을 꽂아 넣게 했다. 극동아시아타이거즈처럼 마지막 후렴에서 ''네가''를 ''나도''로 한 글자 바꿔 칼끝이 나에게 돌아오게 했고, 브릿지에서 처음으로 나도 그랬다고 고백해 그 변화를 받친다. 한로로식으로 소리가 닮은 말을 한 줄에 붙여 ''날 위에서 날을 바꿔''(칼날/하루)로 2절의 시간 변화를 보여 준다. 제목은 지정된 ''작두'' 한 단어 그대로이며, 훅 안의 낱말로 후렴마다 세 번 불린다.'
