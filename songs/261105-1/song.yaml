title: 그때 말할걸
hook: 그때 말할걸
theme: 아픔
story: 가지 말라는 말을 삼키고 사람을 보낸 누구나, 뒤늦게 그 사람에게 건네는 느린 고백.
created: 2026-11-05 12:16
request: {}
lang: ko
instrumental: false
sound_plan: 장조에 프리코러스에서 단조로 한 번 꺾이는 씁쓸한 진행, 74bpm의 느린 드라마 OST 발라드. 인트로는 그랜드 피아노와 낮은 첼로 한 줄. 1절은 피아노 분산화음과 목소리만, 좁은 음역에서 말하듯 부른다. 프리코러스에 현악 패드가 깔리고 같은 음을 되풀이하며 밀어 올려 '-는데'에서 열린 채 후렴으로 떨어진다. 첫 후렴은 훅 첫 음에서 위로 도약하고 마지막 낱말을 길게 끌며, 드럼 없이 현이 대선율을 맡는다. 2절에 하프 아르페지오, 더블베이스의 긴 뿌리음, 부드러운 킥이 들어오고, 두 번째 후렴은 현 전체와 보컬 더블링으로 넓어진다. 간주는 오보에와 피아노. 브릿지는 피아노와 거의 말하는 목소리로 내려앉는다. 마지막 후렴 직전 한 음 위로 전조하고 팀파니 롤, 가장 넓은 현, 쌓인 하모니로 처음으로 목소리를 다 연다. 보컬은 맑고 따뜻한 메조, 절에서는 숨이 섞인 가까운 소리로 박자 뒤에 둔다. 공간은 큰 홀 잔향에 보컬만 가깝게. 아웃트로는 현이 길게 남고 피아노 한 음으로 끝낸다.
style: 'Korean drama OST ballad, 2010s, slow 74 bpm, bittersweet major with a minor turn in the pre-chorus. Female mezzo, clear and warm, breathy close vocal behind the beat, full voice only at the final chorus, mature and sincere, sung in Korean, korean lyrics. Intro: grand piano and low cello. Verse 1: piano arpeggios and voice, narrow conversational melody. Pre-chorus: string pad, rising repeated note. Chorus: upward leap on the hook, long held last note, strings only. Verse 2 adds harp, double bass roots and soft kick. Full strings in chorus two, doubled vocal. Oboe interlude. Bridge drops to piano and near-spoken voice. Key change into the final chorus, timpani roll, stacked harmonies. Outro: strings hold, one piano note. Hall reverb, intimate vocal. Regretful, tender.'
exclude: electric guitar, synth, trap hi-hats
photo_query: woman alone window winter night
image_prompt: A woman in a long dark coat seen from behind, standing at a tall window on a winter night, one hand resting on the cold glass. A dim warm lamp behind her, city lights blurred outside. Deep blue and amber tones, quiet regret.
short_scenes:
- The same woman in the dark coat at the tall window, head lifted toward the blurred city lights, breath fogging the glass, deep blue and amber glow.
- Close-up of her hand pressed flat on the cold window glass, faint amber lamplight on her fingers, city lights soft behind.
- The empty window at night after she has gone, the lamp still on, her faint handprint fading on the glass, blue and amber stillness.
title_kind: 후렴 문장
tempo: 느림
arc: '화법: 너에게. 기(1절): 웃으며 너를 보낸 일, 그게 어른스러운 줄 알았던 믿음, 삼킨 한마디가 밤을 늘인다는 것까지만 말한다. 승(프리코러스→후렴): 시간이 다 가져가도 너만 남는다는 데서 ''그때 말할걸''이라는 후회 한 문장으로 떨어진다. 전(2절→브릿지): 2절은 지금의 너를 향해 잘 지내라 빌면서 돌아오길 꿈꾸는 모순으로 시점을 옮긴다. 브릿지에서 처음으로 ''떠난 건 너, 놓은 건 나''라고 자기 몫을 인정한다. 결(마지막 후렴): 마지막 줄이 ''사랑해, 그 쉬운 걸''에서 ''지금 말할게, 사랑해''로 바뀌어, 후회가 늦은 고백이 된다. 아웃트로는 가사 없이 현과 피아노 한 음.'
line_plan: '[1절] 1 고백: 웃으며 보냈다(임팩트-고백). 2 뒤집기: 그게 어른인 줄 알았다(임팩트-뒤집기). 3 정확한 말: 삼킨 부탁의 이름. 4 새 뜻: 삼킨 만큼 밤이 길다. [프리] 5 선언: 시간은 다 데려간다. 6 전환(열린 끝 -는데): 너만 두고 간다. [후렴] 7 훅(고백). 8 모순: 보내 놓고 기다린다. 9 훅. 10 모순·고백: 가장 쉬운 말 사랑해를 못 했다. [2절] 11 새 뜻(시점 전환): 잘 지내라 빈다. 12 모순: 돌아오는 너를 꿈꾼다. 13~14 정확한 말: 늦게 안 사랑이 더 오래 남는다. [프리] 15~16 반복. [후렴] 17~20 반복(훅 17·19). [브릿지] 21 인정: 떠난 건 너. 22 뒤집기·진심: 놓은 건 나. [마지막 후렴] 23 훅. 24 모순 유지. 25 훅. 26 뒤집기: 지금 말할게, 사랑해. 훅 줄 번호: 7, 9, 17, 19, 23, 25 (6번).'
why: 가지 말라는 말을 삼키고 누군가를 보낸 기억은 연인이든 친구든 거의 모든 사람에게 있어서, 다섯 후보 중 가장 넓게 자기 얘기가 된다. 조사 노트의 초안은 지하철·편의점·삼각김밥으로 한 장면을 세운 상황극이라 쓰지 않았고, 사물은 밤과 손 둘만 남기고 뜻만으로 짰다. 자우림의 '~줄 알았어'로 과거의 믿음을 세워 현재와 부딪히게 하는 원리, 한로로와 극동아시아타이거즈의 '마지막 후렴에서 한 낱말만 뒤집기'를 가져와 '그때 말할걸'이 마지막에 '지금 말할게'로 돌아오게 했다. 제목은 후렴 문장 그대로다. 외쳐지는 반말 한 덩이라 처음 듣는 사람도 두 번째 후렴에서 따라 부를 수 있다.
