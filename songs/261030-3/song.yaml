why: '''꿈 깨''라는 말은 거의 모든 사람이 들어 봤고, 그 말에 ''버리긴 뭘 버려''로 받아치는 순간 각자 서랍 속 물건이 하나씩 떠오르기 때문에 가장 넓다. 쇼팽이 즉흥 환상곡을 서랍에 넣고 태워 달라고 했지만 결국 세상에 나와 가장 사랑받은 곡이 됐다는 사실이 ''태우긴 또 뭘 태워''라는 한 줄과 속으로 이어진다. 크라잉넛처럼 외칠 수 있는 한 덩이 말을 제목과 후렴에 두고, 잔나비처럼 후렴 직전에 ''머리는 좀 빠졌지만''으로 자기를 낮춘 뒤 터뜨렸다. 터치드처럼 마지막 후렴은 두 줄만 바꿔 서랍 속에 넣어 두던 사람이 꺼내 트는 사람으로 바뀌게 했다. 제목은 후렴 문장 그대로 반말 반박으로 두어, 조사한 곡들에서 가장 많았던 반말 문장 제목 형태를 따랐다.'
