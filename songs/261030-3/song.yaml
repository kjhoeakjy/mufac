title: 하늘값
hook: 하늘값은 안 받는대 건물주도 똑같아
theme: 어른
story: 월세와 카드값에 치인 사람이 퇴근길에 고개를 젖히고, 이건 공짜라고 우기며 외치는 노래.
created: 2026-10-30 12:01
request:
  id: sky6
  idea: 하늘
  classic: auto
style: korean pop-punk, timpani and choir, 170 bpm, intro and chorus quote the uploaded classical theme prominently, verses original, overdriven guitar theme, gang shouts, raspy female vocal
exclude: ballad, waltz, 3/4, brass section, solo piano, lo-fi, rap, autotune, english lyrics
photo_query: blue sky city rooftops
image_prompt: Bright noon, a huge clear blue sky over crowded low-rise city rooftops with water tanks and laundry lines, a few small people seen from behind tilting their heads up, saturated summer colors. No text, no signs, no faces.
title_kind: 단어 하나
why: '''하늘''을 앞의 두 곡처럼 안부나 권유로 쓰지 않고, 돈 안 내도 모두 똑같이 받는 것으로 끌어내렸다. 실러의 ''모든 사람은 형제''가 ''건물주도 똑같아''로 바뀌면서 원곡의 넓은 태도와 지금 사람들의 월세·퇴사 피로가 속으로 이어진다. 술탄 오브 더 디스코처럼 거창한 주제를 생활로 끌어내리고, 크라잉넛처럼 4·4·4·3 율격으로 짜서 환희의 송가 한 덩어리에 떼창이 바로 얹히게 했다. 절은 극동아시아타이거즈식 담담한 반말 ''-네''로 맺어 진심 한 줄(다 같은 데 보고 있네)만 남겼다. 제목은 단어 하나로 했다. 처음 보는 합성어라 궁금해서 눌러 보게 되고, 조사한 곡에서 가장 많은 형태가 단어·명사구라 검색에도 강하다.'
share_line: 잔고 없는 나도 오늘 고개 들면 갑부야
