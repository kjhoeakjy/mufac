classic:
  id: fantaisie_impromptu
  name: 즉흥 환상곡
  composer: 프레데리크 쇼팽
  year: 1834
  en: Chopin's Fantaisie-Impromptu
  reason: 주제어가 '꿈'이고 장르는 락이라, 꿈을 서랍 속에 숨겨 두었다가 터뜨리는 태도가 필요하다. 쇼팽이 1834년 스물네 살에 쓴 이 곡은 생전에 출판하지 않았고 태워 달라고 유언했지만, 친구 폰타나가 1855년에 출판해 가장 많이 사랑받는 곡이 되었다. 서랍에 넣어 둔 꿈이 결국 세상으로 나온다는 이야기가 락의 반항적인 에너지와 정확히 맞는다. 중간의 느린 선율은 1917년 「I'm Always Chasing Rainbows」가 되었고, 그 노래의 가사가 곧 꿈을 쫓는다는 내용이어서 '꿈'이라는 키워드와 직접 이어진다. 빠른 16분음표의 질주로 시작하는 첫 소절은 많은 사람이 단번에 알아듣고, 앞서 쓴 환희의 송가나 터키 행진곡과도 겹치지 않는다. 긴 후렴 여덟 줄은 락의 고조되는 구조에 잘 맞는다.
  note: 쇼팽은 1834년, 스물네 살에 즉흥 환상곡을 썼습니다. 그는 이 곡을 생전에 출판하지 않았고, 남긴 원고를 태워 달라고 했지만 친구 율리안 폰타나가 1855년에 세상에 내놓았습니다. 중간의 느린 선율은 1917년 미국 노래 「I'm Always Chasing Rainbows」가 되기도 했습니다. 서랍에 넣어 두었던 곡이 가장 많이 사랑받게 됐다는 이야기 위에, 아직 못 버린 것 하나씩 가진 사람들의 노래를 얹었습니다.
  instrument: guitar
