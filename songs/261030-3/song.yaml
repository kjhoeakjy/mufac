title: 너는 삼 초면 잊는다며
hook: 너는 삼 초면 잊는다며
theme: 사랑
story: 자기를 금붕어라 부르며 뭐든 잘 잊던 사람과 헤어진 뒤, 남은 쪽이 셋을 셀 때마다 다시 그 사람을 떠올리는 이야기다.
created: 2026-10-30 14:51
request:
  id: mvujw6to
  idea: 금붕어
  genre: 인디밴드
style: Korean indie rock, slow-burn 2010s band sound, around 82 bpm. Warm male baritone, slightly raspy, plain and unforced, a little behind the beat, mature and sincere, sung in Korean, korean lyrics. Clean electric guitar with light tremolo carries verse 1 over soft bass and brushed live drums. A second guitar with gentle overdrive enters at the pre-chorus. Chorus opens into full band, steady eighth-note bass, wide ringing chords. Short guitar lead before the bridge, then the bridge drops to one clean guitar and voice. Final chorus is the biggest and widest, drums open up. Short outro on a single clean guitar. Live band in a room, natural reverb, warm tape. Tender, wry, unhurried.
exclude: autotune, synth pads, brass section
photo_query: man watching goldfish window
image_prompt: A young man in a gray hoodie, seen from behind, sits on the floor of a small room at dusk beside a round goldfish bowl on a low shelf. A folded umbrella leans against the wall. Muted blue light from the window mixes with a warm lamp glow, quiet and wistful.
title_kind: 후렴 문장
tempo: 느림
arc: '화법: 너에게 말하기. 기: 우산을 잃어버리고 약속을 다시 묻던 너는 ''나 금붕어잖아'' 하며 웃었고, 나는 그 말에 따라 웃었다. 승: 연락 한 번 없는 걸 보니 나쯤은 쉽게 잊었겠지. 그래서 후렴은 ''너는 삼 초면 잊는다며''를 되풀이하고, 셋을 세고 나면 또 처음부터 너다. 전: 2절에서는 시점이 지금의 나로 옮겨 가고, 쓸데없는 걸 오래 외우는 나를 보여 준다. 브릿지에서 처음으로 금붕어도 몇 달은 기억한다는 사실과 ''보고 싶다''는 말이 나오고, 바로 ''아니면 말고''로 물러선다. 결: 마지막 후렴의 셋째 줄 ''하나 둘 셋 세고 나면''이 ''거짓말인 줄 알면서''로 바뀌고, 메아리는 ''아직 처음부터 너''가 된다. 아웃트로는 ''우산은 챙겼니'' 한마디로 1절에 다시 닿는다.'
why: 헤어진 사람은 금방 잊는 것 같은데 나만 남아 있다는 기분은 거의 모두가 겪어 봤고, '금붕어는 삼 초'라는 통념 덕분에 설명 없이 한 줄로 통하기 때문에 골랐다. 잔나비 「뜨거운 여름밤은 가고 남은 건 볼품없지만」처럼 후렴 첫 문장을 그대로 제목으로 삼아 부르는 순간 제목이 박히게 했고, 같은 제목 「금붕어」가 있는 한로로와 겹치지 않도록 단어 하나 대신 후렴 문장형을 택했다. 한로로 「0+0」과 터치드 「불시」처럼 마지막 후렴은 둘째 연의 한 줄과 메아리만 바꿨다. 셋을 세는 줄이 '잊으려는 시도'에서 '거짓말인 줄 알면서도 세는 것'으로 뜻이 바뀐다. 이전 곡이 빠른 스카 펑크와 중간 템포 시티팝이었으므로 이번에는 느린 인디록으로 했다. 화법은 우리와 혼잣말을 피해 너에게 말하기로 정했다.
share_line: 보고 싶다 아니면 말고
