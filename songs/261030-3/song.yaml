polish:
- '[Verse 2] ''다 같은 데 보고 있네'' → ''입 벌리고 쳐다보네'': ''다 같은 데''는 모두 같은 처지라는 뜻을 정리해 주는 결론 줄이라 지웠다. 대신 입 벌리고 올려다보는 아저씨 모습만 남겨 웃음이 나게 했다. 8음절은 1절 4행과 같다.'
- '[Final Chorus] ''내일 와도 모레 와도'' → ''내일 봐도 모레 봐도'': ''와도''는 누가 어디로 오는지 흐릿하다. 하늘을 ''보는'' 말로 바꿔 뜻을 분명히 했다. 음절 수(15)와 줄 끝 ''공짜야''는 그대로다.'
- 제목 '하늘값'은 짧은 명사이고 주제를 풀어 쓴 문장이 아니라서 그대로 두었다.
- 1절과 후렴은 점검표에 걸리는 줄이 없어서 손대지 않았다. 감정을 이름으로 부르는 말이 없고, 자조와 능청이 살아 있다.
classic:
  id: ode_to_joy
  name: 환희의 송가
  composer: 루트비히 판 베토벤
  year: 1824
  reason: '''하늘''이라는 키워드는 앞의 두 곡이 엄마에게 건네는 안부와 ''너도 봐''라는 다정한 권유로 이미 다뤘으니, 이번에는 모두가 같은 하늘 아래 있다는 넓고 힘 있는 노래로 가는 것이 맞다. 「환희의 송가」의 가사인 실러의 시 「환희에 부쳐」(1785)에는 ''형제들이여, 별이 빛나는 하늘 위에 사랑하는 아버지가 계시리라''는 구절이 있어, 원곡 자체가 하늘을 올려다보며 모든 사람이 형제가 된다고 노래한다. 베토벤은 20대부터 이 시에 곡을 붙이려 했고 30년 만인 1824년 교향곡 9번 마지막 악장으로 완성했다. 초연 때 완전히 귀가 먹어 박수를 듣지 못한 그를 알토 가수가 돌려세워 환호하는 청중을 보게 했다는 일화는, 혼자가 아니라 함께라는 이 노래의 태도와 그대로 이어진다. 1989년 베를린 장벽이 무너진 성탄절에 ''환희''를 ''자유''로 바꿔 불렀듯 가사를 바꿔 불러도 힘을 잃지 않는 선율이다. 첫 네 음만 들어도 누구나 알아듣고 따라 부를 수 있어, 후렴에서 그대로 부를 때 가장 많은 사람을 함께 하늘을 올려다보게 만들 수 있다.'
  note: 「환희의 송가」는 베토벤이 1824년에 완성한 교향곡 9번의 마지막 악장으로, 실러의 시 「환희에 부쳐」에 곡을 붙였습니다. 시의 중심은 하늘 아래 모든 사람이 형제가 된다는 구절이고, 베토벤은 20대부터 품은 이 시를 30년 만에 노래로 만들었습니다. 초연 때 귀가 먹은 그는 박수를 듣지 못했고, 알토 가수가 돌려세워 주고서야 환호하는 객석을 보았다고 전합니다. 이 노래는 그 '모두 같다'는 말을, 하늘만큼은 건물주도 나도 공짜로 받는다는 오늘의 말로 바꿔 불렀습니다.
