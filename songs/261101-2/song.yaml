lyrics: |
  [Intro: fingered bass riff and acoustic guitar]

  [Verse 1: bass, acoustic guitar, close voice]
  잔잔한 날에는 내가 없고
  흔들릴 때에만 내가 있다
  네가 일으킨 파란 속에서
  젖은 채로 가벼운 마음
  반듯한 하루를 접어 두고
  기울어진 쪽으로 걸어가
  불을 끄지 못한 밤

  [Pre-Chorus: nylon guitar and soft electric piano enter, rising]
  가라앉으라는 말에
  나는 더 깊이 흔들리고
