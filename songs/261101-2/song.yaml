    style: 'Korean city pop, 80s night drive, 102 bpm, maj7 chords, bittersweet minor turn in the pre-chorus. Female alto, low, cool, slightly husky, close dry verses, just behind the beat, sincere, sung in Korean, korean lyrics. Slap bass with octave pops leads from the intro. Verse 1: DX7 electric piano and tight 80s drums, sixteenth hi-hats, narrow talky melody. Pre-chorus: chorus-effect funk guitar cutting enters, rising repeated note. Chorus: upward leap, synth brass stabs, two-part harmonies, short hook with a long held last word. Verse 2 adds congas and bell synth answers. Alto sax solo after chorus two. Bridge drops to electric piano, pad and near-whispered voice, bass stops. Final chorus widest, extra harmonies, ad-libs. Outro fades on the bass riff. Wide stereo, plate reverb, analog warmth. Cool, restless, wistful.'
