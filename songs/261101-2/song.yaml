    sound_plan: 장조의 메이저세븐 코드 위에 프리코러스에서만 단조로 살짝 꺾이는 80년대 밤 드라이브 시티팝, 102bpm 안팎의 중간 템포다. 드럼은 타이트한 80년대 드럼에 16분 하이햇, 스네어는 깔끔하게, 2절부터 콩가가 가볍게 들어온다. 베이스는 옥타브로 튀는 슬랩 베이스가 인트로부터 곡을 끌고 가는 주인공이다. 화성은 DX 계열 일렉 피아노가 1절을 받치고, 프리코러스에서 코러스 이펙트를 건 클린 펑크 기타 커팅이 들어오며, 후렴에만 신스 브라스 스탭이 찍힌다. 멜로디는 절에서 좁은 음역으로 말하듯, 프리코러스는 같은 음을 반복하며 올라가고, 후렴 첫 음 '찬'에서 위로 뛰어 '화란'의 '란'을 길게 늘인다. 보컬은 낮고 서늘하며 약간 허스키한 여자 알토, 절은 마이크 가까이 건조하게 박자 뒤로 걸치고 후렴은 두 줄 하모니로 넓힌다. 공간은 넓은 스테레오에 플레이트 리버브, 아날로그 온기. 2절에 벨 신스가 보컬에 대답하고, 두 번째 후렴 뒤 알토 색소폰 솔로 8마디, 브릿지는 베이스가 멈추고 일렉 피아노·패드·속삭이는 목소리만 남는다. 마지막 후렴은 가장 넓게 하모니와 애드립을 더하고, 아웃트로는 슬랩 베이스 리프만 남아 페이드아웃으로 끝난다.
