    arc: '화법: 너에게. 기: 파란과 노란 사이에서 기울고 돌아오는 소리만 있다. 네 쪽으로 기울면 모든 게 둥글어진다. 승: 하고 싶은 말은 ''찬란 말고 화란''이다. 네가 오면 다 화란이다. 전: 2절은 색이 하얀과 까만으로 바뀌고, 네 쪽에서 멀어지면 모든 게 반듯해진다. 브릿지에서 안과 밖이 뒤집히고, 엉망이 편했다는 것과 네 소란이 보고 싶다는 것을 처음 말한다. 결: 마지막 후렴 셋째 줄 ''네가 오면 다 화란''이 ''다시 와서 화란''으로 바뀌어 기다리던 말이 부르는 말이 된다. 아웃트로는 ''네 쪽으로 다시 파란'' 한 줄로 열어 둔다.'
