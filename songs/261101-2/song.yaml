  - 1절을 '잔잔한 날에는 내가 없고 / 흔들릴 때에만 내가 있다'로 시작해, 첫 줄부터 모순을 담은 어른의 문장으로 바꿨습니다.
  - '''파란''에 물결(波瀾)이라는 겹뜻을 실어 ''네가 일으킨 파란''으로 쓰고, 제목 ''화란(禍亂)''과 한 축으로 묶었습니다.'
