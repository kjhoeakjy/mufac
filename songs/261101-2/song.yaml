    모든 것이 제자리에 놓여

    하얀 벽에 걸린 바른 시계

    한 번도 틀리지 않는 고요

    그 고요가 나를 지우고

    숨소리마저 가지런해

    불을 끄지 못한 밤


    잊으라는 말에

    나는 더 또렷해지고

    네 이름이 입술에 닿으면


    찬란 말고 화란

    고요보다 네 소란

    부서져도 너라면

    찬란 말고 화란

    (말고 화란)


    고요를 다 가져도

    나는 비어 있었고

    흐트러진 그 계절이 편했다

    보고 싶다, 네 소란

    이번에는 놓지 않을게


    찬란 말고 화란

    고요보다 네 소란

    다시 와서 화란

    찬란 말고 화란

