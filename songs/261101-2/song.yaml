title: 화란
hook: 찬란 말고 화란
theme: 사랑
story: 좋은 사람 대신 늘 자기를 흔들어 놓는 사람을 고르고 마는 여자가, 떠난 그 사람에게 다시 와서 엎질러 달라고 담담하게 말하는 중간 템포 그루브.
created: 2026-11-01 11:47
request:
  id: mvx8881c
  title: 화란
  idea: 화란, 찬란, 파란
  genre: 시티팝
  style: 여자보컬, 가사 내용 추상적으로
instrumental: false
sound_plan: 장조의 메이저세븐 코드 위에 프리코러스에서만 단조로 살짝 꺾이는 80년대 밤 드라이브 시티팝, 102bpm 안팎의 중간 템포다. 드럼은 타이트한 80년대 드럼에 16분 하이햇, 스네어는 깔끔하게, 2절부터 콩가가 가볍게 들어온다. 베이스는 옥타브로 튀는 슬랩 베이스가 인트로부터 곡을 끌고 가는 주인공이다. 화성은 DX 계열 일렉 피아노가 1절을 받치고, 프리코러스에서 코러스 이펙트를 건 클린 펑크 기타 커팅이 들어오며, 후렴에만 신스 브라스 스탭이 찍힌다. 멜로디는 절에서 좁은 음역으로 말하듯, 프리코러스는 같은 음을 반복하며 올라가고, 후렴 첫 음 '찬'에서 위로 뛰어 '화란'의 '란'을 길게 늘인다. 보컬은 낮고 서늘하며 약간 허스키한 여자 알토, 절은 마이크 가까이 건조하게 박자 뒤로 걸치고 후렴은 두 줄 하모니로 넓힌다. 공간은 넓은 스테레오에 플레이트 리버브, 아날로그 온기. 2절에 벨 신스가 보컬에 대답하고, 두 번째 후렴 뒤 알토 색소폰 솔로 8마디, 브릿지는 베이스가 멈추고 일렉 피아노·패드·속삭이는 목소리만 남는다. 마지막 후렴은 가장 넓게 하모니와 애드립을 더하고, 아웃트로는 슬랩 베이스 리프만 남아 페이드아웃으로 끝난다.
style: 'Korean city pop, 80s night drive, 102 bpm, maj7 chords, bittersweet minor turn in the pre-chorus. Female alto, low, cool, slightly husky, close dry verses, just behind the beat, sincere, sung in Korean, korean lyrics. Slap bass with octave pops leads from the intro. Verse 1: DX7 electric piano and tight 80s drums, sixteenth hi-hats, narrow talky melody. Pre-chorus: chorus-effect funk guitar cutting enters, rising repeated note. Chorus: upward leap, synth brass stabs, two-part harmonies, short hook with a long held last word. Verse 2 adds congas and bell synth answers. Alto sax solo after chorus two. Bridge drops to electric piano, pad and near-whispered voice, bass stops. Final chorus widest, extra harmonies, ad-libs. Outro fades on the bass riff. Wide stereo, plate reverb, analog warmth. Cool, restless, wistful.'
exclude: distorted guitar, trap hi-hats, autotune
photo_query: woman night city drive retro
image_prompt: A woman in a loose 80s blazer seen from the side, sitting in a parked car at night by the harbor, a paper cup of water trembling on the dashboard. Teal and coral city light through the windshield, glossy reflections, cool and restless mood.
short_scenes:
- The same woman in the 80s blazer stands outside the car at the harbor, hair blown sideways by wind, waves breaking under teal and coral city lights.
- Close-up of her hand on the dashboard beside the paper cup, the water inside rippling in dim coral light.
- The empty driver seat at dawn, the paper cup still on the dashboard, its water perfectly still, pale teal sky over the harbor.
title_kind: 지정
tempo: 중간
arc: '화법: 너에게. 기: 좋은 사람은 지루하고 나를 다 엎는 너만 좋다고, 네가 들어온 밤 컵 속의 물이 일어났다고 고백한다. 승: 그래서 하고 싶은 말은 ''찬란 말고 화란'', 다 엎질러 놓고 가라, 멀쩡한 나는 싫다. 전: 2절은 네가 없는 계절로 시간이 바뀌어 물은 잠잠하고 잘 지내는데 조용한 게 시끄럽다. 브릿지에서 처음으로 부서지고 싶었다는 것, 엉망인 내가 편했다는 것, 네 난리가 보고 싶다는 것을 인정하고 이번엔 피하지 않겠다고 말한다. 결: 마지막 후렴의 둘째 줄 ''다 엎질러 놓고 가''가 ''다시 엎질러 줘''로 바뀌어 떠나보내던 말이 부르는 말이 되고, 아웃트로는 ''컵 속의 물이 일어나'' 한 줄로 네가 오는지 열어 둔다.'
line_plan: '[Verse 1] 1 고백(임팩트: 선언) 좋은 사람은 지루하다 / 2 고백(임팩트: 고백) 다 엎는 너만 좋다 / 3 사실: 네가 들어온 밤 / 4 관찰: 컵 속 물이 일어남(사물1, 비유 1) / 5 사실: 반듯하게 접어 둔 날 / 6 전환: 한꺼번에 펼쳐짐 / 7 리프레인: 파란은 네 쪽에서 와. [Pre-Chorus] 8 사실: 밀어내면 밀려옴 / 9 관찰: 젖은 발끝 / 10 전환(열린 끝 -면): 네가 또 부르면. [Chorus] 11 훅(뒤집기) 찬란 말고 화란 / 12 부탁: 다 엎질러 놓고 가 / 13 고백: 멀쩡한 나는 싫어 / 14 훅 / 15 메아리. [Verse 2] 16 사실(시간 바뀜): 네가 없는 계절 / 17 사실: 컵 속 물은 잠잠 / 18 사실: 반듯해진 방 / 19 고백: 잘 지내 정말로 / 20~21 관찰(모순): 조용한 게 시끄러운 줄 몰랐네 / 22 리프레인(뜻이 바뀜: 이제는 기다림). [Pre-Chorus] 23 사실: 기다려도 오지 않음 / 24 사실: 잔잔한 물가 / 25 전환(열린 끝): 네 이름을 부르면. [Chorus] 26 훅 / 27 부탁 / 28 고백 / 29 훅 / 30 메아리. [Bridge] 31 고백(처음 인정): 부서지고 싶었나 봐 / 32 사실: 너를 만난 그 밤부터 / 33 고백: 엉망인 내가 편했어 / 34 감정 직접: 보고 싶어 네 난리 / 35 전환: 이번엔 피하지 않을게. [Final Chorus] 36 훅 / 37 부탁(바뀐 줄): 다시 엎질러 줘 / 38 고백 / 39 훅 / 40 메아리 / 41 훅. [Outro] 42 1절 4줄 되돌림. 훅 줄 번호: 11, 14, 26, 29, 36, 39, 41(7번) + 메아리 15, 30, 40.'
why: 제목이 '화란'으로 정해졌으니 '찬란'과 '화란'이 한 줄에서 부딪히는 1번이 세 키워드를 가장 짧게 묶습니다. 자우림이 '미안해'와 '미워해'를 나란히 두고 풀지 않듯, 훅을 '찬란 말고 화란'이라는 설명 없는 모순으로 세웠습니다. 좋은 사람보다 나를 흔드는 사람에게 끌려 본 기억은 누구에게나 있어서 넓게 닿습니다. 극동아시아타이거즈처럼 2절은 1절의 틀에 명사만 바꿔 '컵 속의 물'이 일어났다가 잠잠해지게 했고, 한로로처럼 마지막 후렴은 한 줄만 바꿔 '놓고 가'를 '다시 엎질러 줘'로 돌려 결론을 냈습니다. 제목은 지정된 단어 하나 그대로이며 후렴 안에서 매번 마지막 낱말로 늘여 부릅니다.
