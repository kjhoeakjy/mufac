    흔들릴 때에만 내가 있다

    네가 일으킨 파란 속에서

    젖은 채로 가벼운 마음

    반듯한 하루를 접어 두고

    기울어진 쪽으로 걸어가

    불을 끄지 못한 밤


    가라앉으라는 말에

    나는 더 깊이 흔들리고

    네가 다시 손을 내밀면


    찬란 말고 화란

    고요보다 네 소란

