polish:
- '좋은 사람은 지루해 → 좋은 사람은 지루한데: 1절에 해체 어미(-아/-어)가 다섯 줄이라 연결어미로 바꾸고, 다음 줄과 한 문장의 모순으로 묶었다'
- '반듯하게 접어 둔 날 / 한꺼번에 펼쳐져 → 반듯하게 접어 둔 날들이 / 한꺼번에 펼쳐지고: 앞의 ''밤''과 ''날''이 명사 끝 토막으로 겹쳤고, 해체 어미도 줄이려고 주어를 살리고 연결어미로 넘겼다'
- '파란은 네 쪽에서 와 → 파란은 네 쪽에서부터(1·2절): 해체 어미가 몰려 있어 조사로 끊었다. 두 절의 리프레인이니 같은 글자로 맞췄다'
- '잔잔한 물가에서 → 마른 발끝으로: 사람이 없는 풍경 줄이라 1절 프리코러스 ''젖은 발끝으로''와 짝을 맞추고, 네가 없는 상태가 보이게 했다'
