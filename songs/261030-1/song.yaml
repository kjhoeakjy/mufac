    이 노래의 선율은 구스타브 홀스트가 1914~1916년에 쓴 모음곡 「행성」 가운데 「목성」의 가운데 부분에서 왔습니다. 홀스트는 전쟁에 나가려 했지만 군 복무 부적격 판정을 받았고, 이 곡은 1차 대전 마지막 몇 주이던 1918년 9월 29일 런던에서 초대받은 약 250명 앞에서 처음 연주되었습니다. 1921년 홀스트는 이 선율에 시를 붙여 자신이 살던 마을 이름을 딴 찬송 「택스테드」를 만들었고, 이 노래는 오랫동안 멀리 있는 이를 생각하는 자리에서 함께 불려 왔습니다. 가지 못하고 남은 자리에서 먼 곳을 향해 부르던 선율 위에, 자주 내려가지 못하는 자녀가 엄마에게 보내는 날씨 안부를 얹었습니다.

