classic:
  id: jupiter
  name: 목성
  composer: 구스타브 홀스트
  year: 1916
  reason: '''하늘''이라는 키워드로 가장 많은 사람을 움직이려면 누구나 고개를 들면 같은 하늘을 본다는 공통의 자리가 필요하고, 홀스트의 「목성」은 바로 하늘의 행성을 그린 모음곡 「행성」에서 나온 곡입니다. 홀스트는 1차 대전 중인 1916년에 「목성, 기쁨을 가져오는 자」를 썼습니다. 1921년에는 그 가운데 선율에 "내 조국이여, 그대에게 맹세하노라"라는 시를 붙여 찬송가로 만들었는데, 이 시의 둘째 연은 땅 위의 나라를 넘어 ''오래전 들었던 또 하나의 나라'', 곧 하늘의 나라를 노래합니다. 그래서 이 선율은 영국의 장례식과 추모식에서 가장 많이 불리는 노래가 되었고, 다이애나 비의 결혼식과 장례식에서 모두 불렸습니다. 기쁨의 날에도 떠나보내는 날에도 같은 하늘 아래 함께 부르는 맹세라는 점이, 하늘을 올려다보며 다짐하거나 먼저 간 이를 떠올리는 이 노래의 화자와 정확히 같은 자리에 섭니다. 넓고 느리게 여럿이 따라 부르는 선율이라 후렴 하나로 가장 많은 사람을 함께 부르게 만들 수 있는 곡입니다.'
  note: 이 노래의 선율은 구스타브 홀스트가 1914~1916년에 쓴 모음곡 「행성」 가운데 「목성」의 가운데 부분에서 왔습니다. 홀스트는 전쟁에 나가려 했지만 군 복무 부적격 판정을 받았고, 이 곡은 1차 대전 마지막 몇 주이던 1918년 9월 29일 런던에서 초대받은 약 250명 앞에서 처음 연주되었습니다. 1921년 홀스트는 이 선율에 시를 붙여 자신이 살던 마을 이름을 딴 찬송 「택스테드」를 만들었고, 이 노래는 오랫동안 멀리 있는 이를 생각하는 자리에서 함께 불려 왔습니다. 가지 못하고 남은 자리에서 먼 곳을 향해 부르던 선율 위에, 자주 내려가지 못하는 자녀가 엄마에게 보내는 날씨 안부를 얹었습니다.
