title_kind: 후렴 문장
why: 엄마가 전화만 하면 '거긴 비 안 오냐'부터 묻는다는 건 거의 모든 사람이 겪었지만 노래로 말한 적 없는 순간이라 가장 넓게 '내 얘기다'를 부르고, 같은 질문이 마지막에 화자의 입에서 나오며 한 걸음(먼저 전화를 건다)으로 끝난다. 「목성」은 전쟁 중 전선에 가지 못하고 남은 홀스트가 쓴 선율이고 훗날 멀리 있는 이를 향해 함께 부르는 찬송이 되었는데, 이 노래의 화자도 자주 가지 못하는 먼 곳의 엄마를 향해 하늘에 대고 안부를 보낸다는 점에서 같은 자리에 선다. 제목은 질문 겸 날씨 보고인 후렴 첫 문장이 곧 이야기이고 '하늘'이 검색에 걸리도록 후렴 문장 그대로 골랐다. 신호등처럼 사물 하나(빨래와 날씨)로 곡 전체를 끌고 가는 원리와, 자우림식 혼잣말 반말과 '이거 엄마 거야' 같은 능청을 가져왔고, 감정 단어 대신 '맑다고 말할 데가 엄마밖에 없네'로 보고 싶다는 말을 대신했다.
share_line: 맑다고 말할 데가 엄마밖에 없네
