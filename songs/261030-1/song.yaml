why: 다섯 후보 가운데 퇴근 시간은 직업과 나이를 가리지 않고 거의 모든 사람이 매일 겪는 기쁨이라 가장 넓게 따라 부를 수 있다. 퇴근하는 순간에는 얄미운 옆자리도 형제가 된다고 우긴다. 슬픈 사연 없이 밝게 썼다. 크라잉넛처럼 외칠 수 있는 한 덩이 말로 후렴을 짜고, 술탄 오브 더 디스코처럼 마지막 후렴에서 '부장님도 형제다'로 거창한 형제애를 초라한 사무실로 떨어뜨렸다. 제목은 단어처럼 짧은 명사구 '여섯 시'로 골랐다. 조사한 히트곡에서 명사 제목이 가장 많았고, 부르는 순간 각자의 퇴근 시간이 떠오른다.
