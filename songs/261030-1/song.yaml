title: 여기는 하늘 맑아
hook: 여기는 하늘 맑아, 거기는 어때 엄마
theme: 어른
story: 혼자 사는 자녀가 일요일 베란다에서 빨래를 널다가, 전화만 하면 날씨부터 묻던 엄마를 자기가 닮아 가고 있다는 걸 알아차린다.
